<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 3: Boolean Algebra Simulator</title><style>
:root{--ink:#173842;--teal:#197d91;--purple:#6555ad;--coral:#ed625e;--gold:#efb23f;--bg:#f2f7f6;--card:#fff;--line:#cbdfe2;--good:#16734b}*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}header{padding:24px;background:linear-gradient(120deg,#153e49,#6555ad);color:#fff}header h1{margin:0 0 7px}header p{max-width:850px;margin:0}.topnav{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.btn,button{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:10px 14px;font-weight:750;cursor:pointer;text-decoration:none}.btn:hover,button:hover{filter:brightness(.97)}main{max-width:1200px;margin:auto;padding:22px;display:grid;grid-template-columns:285px 1fr;gap:22px}.sidebar{position:sticky;top:12px;align-self:start;display:grid;gap:8px}.sidebar button{text-align:left}.sidebar button.active{background:var(--purple);color:#fff;border-color:var(--purple)}.progress{height:11px;background:#dae8e8;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--purple));transition:width .35s}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 28px #17384210;margin-bottom:18px}.lead{font-size:17px}.example{padding:15px;background:#eef9f8;border-left:5px solid var(--teal);border-radius:10px}.predict{padding:15px;background:#fff8e8;border-left:5px solid var(--gold);border-radius:10px;margin:18px 0}.lab{background:#fbfdfd;border:1px solid var(--line);border-radius:16px;padding:18px;min-height:300px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.switch{min-width:76px;font-size:18px}.signal{display:inline-grid;place-items:center;width:66px;height:66px;border-radius:14px;background:#e9f4f3;border:3px solid var(--teal);font-size:26px;font-weight:900;transition:.3s}.signal.high{background:#ded8ff;border-color:var(--purple)}.wire{height:6px;min-width:55px;flex:1;background:#9cb8bc;border-radius:6px;position:relative;overflow:hidden}.wire.on{background:var(--coral)}.wire.on:after{content:"";position:absolute;width:18px;height:6px;background:white;animation:travel 1s linear infinite}.gate{width:125px;min-height:82px;border:3px solid var(--purple);border-radius:12px 55px 55px 12px;display:grid;place-items:center;font-size:22px;font-weight:900;background:#f2efff}.truth{border-collapse:collapse;width:100%;max-width:520px;margin-top:15px}.truth th,.truth td{border:1px solid var(--line);padding:8px;text-align:center}.truth tr.active{background:#fff0ee;outline:2px solid var(--coral)}.equation{font:700 22px ui-monospace,monospace;background:#f5f1ff;padding:14px;border-radius:10px}.steps{display:grid;gap:10px}.step{padding:12px;border:1px solid var(--line);border-radius:10px;opacity:.25;transform:translateY(6px)}.step.show{opacity:1;transform:none;transition:.35s}.feedback{font-weight:750;min-height:25px}.good{color:var(--good)}.bad{color:#a23434}.lawgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.law{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.circuit{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.block{padding:14px;border-radius:10px;background:#eaf6f5;border:2px solid var(--teal);font-weight:800}.arrow{font-size:26px;color:var(--coral)}fieldset{border:1px solid var(--line);border-radius:10px;margin:14px 0}label{display:block;margin:7px}.quiz{display:none}@keyframes travel{from{left:-20px}to{left:100%}}@media(max-width:820px){main{grid-template-columns:1fr}.sidebar{position:static}.sidebar{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.sidebar{grid-template-columns:1fr}.wire{min-width:25px}.gate{width:105px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><header><h1>Lecture 3: Boolean Algebra and Simplification</h1><p>Every topic includes a full explanation, worked example, prediction prompt, concept-specific interactive visualization, and knowledge check.</p><p style="margin:10px 0 0"><strong>Rebuilt version 2: concept-specific Boolean Algebra laboratory</strong></p><nav class="topnav"><a class="btn" href="lectures-dashboard.html">All Lectures</a><a class="btn" href="index.html">Main Book</a><button onclick="replay()">Replay current animation</button></nav></header><main><aside class="sidebar" id="nav"></aside><section><div class="progress"><i id="bar"></i></div><p id="progressText"></p><article class="card" id="content"></article><article class="card quiz" id="quiz"></article></section></main><script>
const DATA={"modules": [{"title": "Variables, Complements, and Literals", "explain": "A Boolean variable represents one of two logic states: 0 or 1. The complement reverses the state, so if A = 0 then A' = 1, and if A = 1 then A' = 0. A literal is either a variable, such as A, or its complement, such as A'.", "example": "If A = 1 and B = 0, the literals A, A', B, and B' evaluate to 1, 0, 0, and 1.", "type": "complement", "predict": "Before running the visual, predict A' when A is changed."}, {"title": "Boolean Addition and OR", "explain": "Boolean addition is the OR operation. A sum is 1 when at least one input is 1. The special Boolean rule is 1 + 1 = 1 because the result describes a logic state, not an arithmetic quantity.", "example": "A + B + C is 0 only for A = B = C = 0. Every other input combination makes the sum 1.", "type": "gate", "gate": "OR", "predict": "Choose A and B, predict A + B, then run the gate."}, {"title": "Boolean Multiplication and AND", "explain": "Boolean multiplication is the AND operation. A product is 1 only when every factor is 1. Any 0 in a product forces the complete product to 0.", "example": "ABC = 1 only for A = 1, B = 1, and C = 1.", "type": "gate", "gate": "AND", "predict": "Choose A and B, predict AB, then run the gate."}, {"title": "Sum Terms and Product Terms", "explain": "A sum term contains literals joined only by OR. A product term contains literals joined only by AND. Recognizing the term type lets you identify the one exceptional output condition quickly.", "example": "A + B' + C is a sum term and becomes 0 only when A = 0, B = 1, and C = 0. AB'C is a product term and becomes 1 only for that same assignment.", "type": "terms", "predict": "Set A, B, and C. Predict both A + B' + C and AB'C."}, {"title": "Boolean Laws and Identities", "explain": "Boolean laws simplify expressions without changing their truth tables. Important laws include identity, null, idempotent, complement, commutative, associative, distributive, and absorption laws.", "example": "A + AB = A by absorption. A(A + B) = A is the dual absorption law.", "type": "laws", "predict": "Select a law and predict the simplified right-hand side."}, {"title": "DeMorgan's Theorems", "explain": "DeMorgan's theorems move a complement across a grouping operator. Complement every literal and exchange AND with OR, or OR with AND.", "example": "(AB)' = A' + B' and (A + B)' = A'B'. Both identities can be verified row by row.", "type": "demorgan", "predict": "Predict the transformed operator and the complement applied to each literal."}, {"title": "Evaluating Boolean Expressions", "explain": "Evaluate complements first, then products, then sums, unless parentheses specify another order. Showing intermediate literal values prevents common mistakes.", "example": "For A = 1, B = 0, C = 1: A'B + AC = 0·0 + 1·1 = 1.", "type": "evaluate", "predict": "Set A, B, and C and calculate F = A'B + AC before revealing the steps."}, {"title": "Step-by-Step Simplification", "explain": "Simplification applies one valid identity at a time. Each new line must remain equivalent to the previous line for every input combination.", "example": "AB + A(B + C) + B(B + C) expands to AB + AB + AC + B + BC, then reduces to B + AC.", "type": "simplify", "predict": "Try to identify the law used at each transformation."}, {"title": "Truth Table to Simplified Circuit", "explain": "A reliable design workflow is: define inputs and output, generate the truth table, write an expression for the required 1-rows, simplify the expression, and implement the reduced gate network.", "example": "For F = A'B + AB, factor B(A' + A) = B. The two product terms and OR gate are replaced by a direct connection from B.", "type": "converter", "predict": "Predict whether A'B + AB depends on A after simplification."}], "quiz": [["If A = 0, what is A'?", ["0", "1", "Undefined"], 1], ["Which input makes A + B equal 0?", ["00", "01", "11"], 0], ["Which input makes AB equal 1?", ["00", "10", "11"], 2], ["A + AB simplifies to", ["AB", "A", "B"], 1], ["(A + B)' is", ["A' + B'", "A'B'", "AB"], 1], ["A'B + AB simplifies to", ["A", "B", "A + B"], 1]]};let current=0;let completed=JSON.parse(localStorage.getItem('lecture3CompletedV2')||'[]');const $=s=>document.querySelector(s);function bitButton(name,v){return `<button class="switch" data-bit="${name}" onclick="toggleBit('${name}')">${name} = <b>${v}</b></button>`}let bits={A:0,B:0,C:0};
function nav(){const n=$('#nav');n.innerHTML=DATA.modules.map((m,i)=>`<button class="${i===current?'active':''}" onclick="openModule(${i})">${i+1}. ${m.title}${completed.includes(i)?' ✓':''}</button>`).join('')+`<button onclick="showQuiz()">Final Quiz</button>`;updateProgress()}
function openModule(i){current=i;$('#quiz').style.display='none';$('#content').style.display='block';render();scrollTo({top:0,behavior:'smooth'})}function updateProgress(){$('#bar').style.width=(completed.length/DATA.modules.length*100)+'%';$('#progressText').textContent=`Progress: ${completed.length}/${DATA.modules.length} concepts completed`}
function render(){nav();const m=DATA.modules[current];$('#content').innerHTML=`<h2>${m.title}</h2><p class="lead">${m.explain}</p><div class="example"><b>Worked example</b><br>${m.example}</div><div class="predict"><b>Predict before interacting</b><p>${m.predict}</p><input id="prediction" aria-label="Your prediction" placeholder="Write your prediction"><button onclick="savePrediction()">Lock prediction</button><p class="feedback" id="predictionFeedback"></p></div><h3>Interactive explanation</h3><div class="lab" id="lab">${lab(m)}</div><div class="row" style="margin-top:18px"><button onclick="completeModule()">Mark understood and continue</button></div>`;updateLab()}
function savePrediction(){const p=$('#prediction').value.trim();$('#predictionFeedback').textContent=p?'Prediction saved. Now use the simulator and compare.':'Write a prediction first.';$('#predictionFeedback').className='feedback '+(p?'good':'bad')}
function lab(m){if(m.type==='complement')return `<div class="row">${bitButton('A',bits.A)}<div class="wire"></div><div class="gate">NOT</div><div class="wire" id="outwire"></div><div class="signal" id="out"></div></div><p id="explainResult"></p><table class="truth"><tr><th>A</th><th>A'</th></tr><tr data-r="0"><td>0</td><td>1</td></tr><tr data-r="1"><td>1</td><td>0</td></tr></table>`;if(m.type==='gate')return `<div class="row">${bitButton('A',bits.A)}${bitButton('B',bits.B)}<div class="wire" id="inwire"></div><div class="gate">${m.gate}</div><div class="wire" id="outwire"></div><div class="signal" id="out"></div></div><p id="explainResult"></p><div id="truthArea"></div>`;if(m.type==='terms')return `<div class="row">${bitButton('A',bits.A)}${bitButton('B',bits.B)}${bitButton('C',bits.C)}</div><p class="equation">S = A + B' + C &nbsp;&nbsp; P = AB'C</p><div class="row"><div>Sum term S: <span class="signal" id="sum"></span></div><div>Product term P: <span class="signal" id="prod"></span></div></div><p id="explainResult"></p>`;if(m.type==='laws')return `<div class="lawgrid">${[['Identity','A + 0 = A'],['Null','A + 1 = 1'],['Idempotent','A + A = A'],['Complement',"A + A' = 1"],['Absorption','A + AB = A'],['Distributive','A(B + C) = AB + AC']].map((x,i)=>`<button class="law" onclick="showLaw(${i})"><b>${x[0]}</b><br>${x[1]}</button>`).join('')}</div><div class="steps" id="lawSteps"></div>`;if(m.type==='demorgan')return `<div class="row"><button onclick="setDM(0)">(AB)'</button><button onclick="setDM(1)">(A + B)'</button></div><div class="steps" id="dmSteps"></div><button onclick="nextDM()">Next transformation step</button><div id="dmTruth"></div>`;if(m.type==='evaluate')return `<div class="row">${bitButton('A',bits.A)}${bitButton('B',bits.B)}${bitButton('C',bits.C)}</div><p class="equation">F = A'B + AC</p><button onclick="revealEvaluation()">Reveal evaluation steps</button><div class="steps" id="evalSteps"></div>`;if(m.type==='simplify')return `<p class="equation">AB + A(B + C) + B(B + C)</p><button onclick="nextSimplify()">Reveal next algebra step</button><button onclick="resetSimplify()">Reset</button><div class="steps" id="simpleSteps"></div>`;return `<div class="circuit"><div class="block">Truth table</div><span class="arrow">→</span><div class="block">A'B + AB</div><span class="arrow">→</span><div class="block" id="simpleBlock">?</div><span class="arrow">→</span><div class="block" id="circuitBlock">Gate network</div></div><button onclick="convertCircuit()">Simplify and rebuild circuit</button><p id="explainResult"></p>`}
function toggleBit(n){bits[n]=1-bits[n];renderBits();updateLab()}function renderBits(){document.querySelectorAll('[data-bit]').forEach(b=>{const n=b.dataset.bit;b.innerHTML=`${n} = <b>${bits[n]}</b>`})}function setSignal(el,v){if(!el)return;el.textContent=v;el.classList.toggle('high',!!v)}
function updateLab(){const m=DATA.modules[current];renderBits();if(m.type==='complement'){let o=1-bits.A;setSignal($('#out'),o);$('#outwire').classList.toggle('on',!!o);$('#explainResult').textContent=`A is ${bits.A}, so the NOT gate produces A' = ${o}.`;document.querySelectorAll('[data-r]').forEach(r=>r.classList.toggle('active',+r.dataset.r===bits.A))}if(m.type==='gate'){let o=m.gate==='OR'?(bits.A||bits.B):(bits.A&&bits.B);setSignal($('#out'),+o);$('#inwire').classList.toggle('on',!!(bits.A||bits.B));$('#outwire').classList.toggle('on',!!o);$('#explainResult').textContent=m.gate==='OR'?`At least one input is ${o?'HIGH':'not HIGH'}, so A + B = ${+o}.`:`${o?'Both inputs are HIGH':'At least one input is LOW'}, so AB = ${+o}.`;$('#truthArea').innerHTML=truth2(m.gate,bits.A,bits.B)}if(m.type==='terms'){let bp=1-bits.B,s=+(bits.A||bp||bits.C),p=+(bits.A&&bp&&bits.C);setSignal($('#sum'),s);setSignal($('#prod'),p);$('#explainResult').textContent=`B' = ${bp}. Sum: ${bits.A} + ${bp} + ${bits.C} = ${s}. Product: ${bits.A}·${bp}·${bits.C} = ${p}.`}}
function truth2(g,a,b){return `<table class="truth"><tr><th>A</th><th>B</th><th>${g==='OR'?'A + B':'AB'}</th></tr>${[[0,0],[0,1],[1,0],[1,1]].map(r=>`<tr class="${r[0]===a&&r[1]===b?'active':''}"><td>${r[0]}</td><td>${r[1]}</td><td>${g==='OR'?+(r[0]||r[1]):+(r[0]&&r[1])}</td></tr>`).join('')}</table>`}
const laws=[['A + 0','Identity element 0 does not change OR.','A'],['A + 1','A 1 in an OR expression forces the result HIGH.','1'],['A + A','Repeating the same literal adds no new condition.','A'],["A + A'",'A and its complement cover both possible states.','1'],['A + AB','When A is 1 the result is already 1; when A is 0, AB is 0.','A'],['A(B + C)','Distribute A to both literals inside the parentheses.','AB + AC']];function showLaw(i){$('#lawSteps').innerHTML=`<div class="step show"><b>${laws[i][0]}</b></div><div class="step show">${laws[i][1]}</div><div class="step show"><b>= ${laws[i][2]}</b></div>`}
let dmType=0,dmStep=0;function setDM(t){dmType=t;dmStep=0;drawDM()}function nextDM(){dmStep=Math.min(3,dmStep+1);drawDM()}function drawDM(){const a=dmType===0?["(AB)'","Move the outer complement across AND","Change AND to OR and complement A and B","A' + B'"]:["(A + B)'","Move the outer complement across OR","Change OR to AND and complement A and B","A'B'"];$('#dmSteps').innerHTML=a.map((x,i)=>`<div class="step ${i<=dmStep?'show':''}">${x}</div>`).join('');$('#dmTruth').innerHTML=dmStep===3?`<p class="good"><b>Verified:</b> both sides match for 00, 01, 10, and 11.</p>`:''}
function revealEvaluation(){let ap=1-bits.A,p1=ap&&bits.B,p2=bits.A&&bits.C,f=+(p1||p2);$('#evalSteps').innerHTML=[[`A' = ${ap}`],[`A'B = ${ap}·${bits.B} = ${+p1}`],[`AC = ${bits.A}·${bits.C} = ${+p2}`],[`F = ${+p1} + ${+p2} = ${f}`]].map((x,i)=>`<div class="step show" style="transition-delay:${i*.2}s">${x}</div>`).join('')}
let ss=0;const simp=['AB + A(B + C) + B(B + C)','AB + AB + AC + B + BC  — distributive law','AB + AC + B + BC  — idempotent law','B + AC + BC  — absorption: B + AB = B','B + AC  — absorption: B + BC = B'];function nextSimplify(){ss=Math.min(simp.length-1,ss+1);drawSimp()}function resetSimplify(){ss=0;drawSimp()}function drawSimp(){if($('#simpleSteps'))$('#simpleSteps').innerHTML=simp.map((x,i)=>`<div class="step ${i<=ss?'show':''}">${i+1}. ${x}</div>`).join('')}
function convertCircuit(){$('#simpleBlock').textContent='B';$('#circuitBlock').textContent='Direct B connection';$('#explainResult').textContent="Factor B: A'B + AB = B(A' + A) = B(1) = B. The output does not depend on A."}
function completeModule(){if(!completed.includes(current))completed.push(current);localStorage.setItem('lecture3CompletedV2',JSON.stringify(completed));if(current<DATA.modules.length-1)current++;render()}function replay(){const lab=$('#lab');if(!lab)return;lab.style.opacity='.2';requestAnimationFrame(()=>{lab.style.opacity='1';updateLab()})}
function showQuiz(){$('#content').style.display='none';const q=$('#quiz');q.style.display='block';q.innerHTML='<h2>Lecture 3 Final Quiz</h2>'+DATA.quiz.map((x,i)=>`<fieldset><legend><b>${i+1}. ${x[0]}</b></legend>${x[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}<p id="f${i}"></p></fieldset>`).join('')+'<button onclick="grade()">Submit quiz</button><p id="score"></p>'}function grade(){let n=0;DATA.quiz.forEach((x,i)=>{const a=document.querySelector(`input[name=q${i}]:checked`),f=$(`#f${i}`);if(a&&+a.value===x[2]){n++;f.textContent='Correct';f.className='good'}else{f.textContent='Correct answer: '+x[1][x[2]];f.className='bad'}});$('#score').textContent=`Score: ${n}/${DATA.quiz.length}`}
render();if(DATA.modules[current].type==='demorgan')drawDM();if(DATA.modules[current].type==='simplify')drawSimp();
</script></body></html>
