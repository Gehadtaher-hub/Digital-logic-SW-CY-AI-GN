<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Logic Lectures</title><style>
:root{--n:#123b56;--t:#197d91;--v:#6555ad;--g:#f0b23b;--r:#ed625e;--ink:#17343d;--line:#c8e1df}*{box-sizing:border-box}body{margin:0;font:16px/1.65 Segoe UI,Arial;color:var(--ink);background:linear-gradient(135deg,#fff8e6,#edf9f7,#efecfb)}header{background:linear-gradient(100deg,var(--n),var(--t),var(--v));color:white;padding:15px 20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--g)}header a{color:white;font-weight:700}main{max-width:1180px;margin:auto;padding:18px}.hero,.panel,.topicnav{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 25px #123b5614}.hero h1{margin:.2rem 0}.controls,.tabs,.bits{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}select,button,.linkbtn{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:white;color:var(--n);font-weight:800;cursor:pointer;text-decoration:none}button.active,.primary{background:linear-gradient(100deg,var(--t),var(--v));color:white}.layout{display:grid;grid-template-columns:250px 1fr;gap:15px}.topicnav button{display:block;width:100%;text-align:left;margin:6px 0}.view{display:none}.view.active{display:block}.box{border-radius:11px;padding:14px;margin:13px 0}.explain{background:#eef9f8;border-left:6px solid var(--t)}.example{background:#fff7dd;border-left:6px solid var(--g)}.clarify{background:#fff0ef;border-left:6px solid var(--r)}.diagram{overflow:auto;background:#f9ffff;border:1px solid var(--line);border-radius:13px;padding:12px;margin:12px 0}svg{display:block;max-width:100%;height:auto;margin:auto}.simgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}.sim{background:white;border:1px solid var(--line);border-radius:13px;padding:16px}.switch{display:inline-flex;gap:7px;align-items:center;padding:8px 10px;margin:4px;border:1px solid var(--line);border-radius:8px}.switch input{width:21px;height:21px}.read{font-family:Consolas,monospace;background:#102f42;color:#cafff4;padding:12px;border-radius:9px;margin-top:10px}.lamp{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:#ccd7d8;border:5px solid #789;font-weight:900;margin:8px}.lamp.on{background:#ffe45e;border-color:#e3a719;box-shadow:0 0 20px #ffd33d}input[type=range]{width:100%}.kmap{display:grid;grid-template-columns:repeat(4,58px);gap:5px;justify-content:center}.kmap button{width:58px;height:54px;padding:2px}.kmap button.one{background:#ffe49a}.worked{border:1px solid var(--line);border-radius:12px;padding:15px;margin:12px 0}.step{font-family:Consolas,monospace;background:#f0f6f6;padding:8px;border-radius:7px;margin:6px 0}@media(max-width:750px){.layout{display:block}.topicnav{margin-bottom:12px}.topicnav button{display:inline-block;width:auto}main{padding:10px}}</style></head><body>
<header><b>Digital Logic: Lectures 1–5</b><div><a href="index.html">Main Book</a> · <a href="studio.html">Practice Studio</a></div></header><main><section class="hero"><h1 id="title"></h1><p id="subtitle">Detailed explanation, circuit diagrams, worked examples, simulator, and quiz in one page.</p></section><div class="controls"><label><b>Lecture: </b><select id="lecture"></select></label></div><nav class="tabs"><button class="active" data-view="explanation">Explanation</button><button data-view="examples">Worked Examples</button><button data-view="simulator">Simulator</button><button data-view="quiz">Quiz</button><a class="linkbtn" href="studio.html">Practice Studio</a></nav><div class="layout"><aside class="topicnav" id="topics"></aside><section><div id="explanation" class="view active panel"></div><div id="examples" class="view panel"></div><div id="simulator" class="view panel"></div><div id="quiz" class="view panel"></div></section></div></main><script>
const L=[{"title": "Digital and Analog Foundations", "topics": [["Analog and digital signals", "Analog quantities change continuously, while digital quantities use defined states. In positive logic, LOW represents 0 and HIGH represents 1. A real digital input accepts voltage ranges rather than one exact voltage.", "A temperature sensor produces 2.8 V. An ADC is required before a processor can store and process the reading."], ["ADC and DAC", "An ADC performs sampling, quantization, and binary encoding. An n-bit ADC has 2^n possible codes. A DAC performs the reverse interface by producing an analog voltage or current from a binary word.", "For a 3-bit ADC covering 0–5 V: levels=8 and nominal step=5/8=0.625 V."], ["Pulses and timing", "A digital pulse is described by rising edge, falling edge, pulse width, period, frequency, and duty cycle. The relations are f=1/T and duty cycle=(HIGH time/T)×100%.", "If T=20 μs and HIGH time=8 μs, f=50 kHz and duty cycle=40%."], ["Serial and parallel transfer", "Serial transfer sends bits one after another on fewer lines. Parallel transfer sends several bits simultaneously on multiple lines. The choice depends on distance, speed, wiring, and cost.", "An 8-bit value needs eight bit times serially but can be transferred in one interval over eight parallel data lines."]]}, {"title": "Logic Gates and Boolean Functions", "topics": [["NOT, AND, and OR", "NOT complements one input. AND is HIGH only when all inputs are HIGH. OR is HIGH when at least one input is HIGH. Their Boolean forms are A̅, A·B, and A+B.", "For A=1 and B=0: AND=0, OR=1, and NOT A=0."], ["NAND and NOR", "NAND is the complement of AND, while NOR is the complement of OR. Evaluate the basic operation first and then invert the result.", "For A=1 and B=1: NAND=0 and NOR=0."], ["XOR and XNOR", "XOR is HIGH when two inputs differ. XNOR is HIGH when two inputs are equal. XOR is used in addition and parity; XNOR is used for equality comparison.", "For A=1 and B=0: XOR=1 and XNOR=0."], ["Universal gates", "NAND and NOR are universal because either type alone can implement every Boolean function. Connecting both inputs of a NAND or NOR gate together creates an inverter.", "NAND(A,A)=A̅ and NOR(A,A)=A̅."]]}, {"title": "Boolean Algebra and Simplification", "topics": [["Boolean laws", "Identity, null, idempotent, complement, commutative, associative, distributive, and absorption laws simplify expressions without changing their truth tables.", "A+AB=A by absorption, so the AB term is unnecessary."], ["DeMorgan’s theorems", "The complement of a product equals the sum of the complemented variables. The complement of a sum equals the product of the complemented variables.", "NOT(A+B·C)=A̅·(B̅+C̅)."], ["Circuit to expression", "Translate a circuit from inputs toward the output. Name intermediate gate outputs, then substitute them into the final expression.", "If X=B·C and F=A+X, then F=A+B·C."], ["Truth-table verification", "Two expressions are equivalent only when their outputs match for every possible input combination. A truth table gives a complete comparison.", "A+AB and A match for 00, 01, 10, and 11, proving equivalence."]]}, {"title": "Canonical Forms and Karnaugh Maps", "topics": [["Minterms and SOP", "A minterm contains every variable once. Canonical SOP is the OR of minterms corresponding to rows where the function equals 1.", "For A,B,C=101, the minterm is A·B̅·C and its index is m5."], ["Maxterms and POS", "A maxterm contains every variable once. Canonical POS is the AND of maxterms corresponding to rows where the function equals 0.", "Use Σm for a sum of minterms and ΠM for a product of maxterms."], ["K-map grouping", "Group adjacent 1s for SOP using rectangles of 1, 2, 4, 8, or 16 cells. Prefer the largest groups. Opposite edges are adjacent and groups may overlap.", "For Σm(1,3,5,7), C remains 1 while A and B change, so F=C."], ["Don’t-care conditions", "A don’t-care X may be treated as 0 or 1 when that produces a larger useful group. It does not have to be included.", "Use an X to expand a pair into a group of four only when the final expression becomes simpler."]]}, {"title": "Combinational Circuit Design", "topics": [["Half and full adders", "A half adder adds A and B: Sum=A XOR B and Carry=A·B. A full adder also accepts Cin: Sum=A XOR B XOR Cin.", "For A=1, B=1, Cin=1, the total is 3=11₂, so Sum=1 and Cout=1."], ["Subtractors and adder-subtractor", "A half subtractor produces Difference and Borrow. An adder-subtractor uses XOR control and two’s complement so one circuit can perform addition or subtraction.", "For A=0 and B=1, Difference=1 and Borrow=1."], ["BCD adder", "A BCD digit is valid only from 0000 to 1001. If a four-bit result exceeds 1001 or produces a decimal carry, add 0110 to correct the BCD result.", "7+5 gives 1100; add 0110 to obtain BCD 0001 0010, representing 12."], ["Decoder, encoder, and multiplexer", "A decoder activates one output for an input code. An encoder maps an active input to a code. A multiplexer selects one data input using select lines.", "A 4-to-1 MUX uses two select lines; S1S0=10 selects D2."]]}];let li=0,ti=0;const $=x=>document.getElementById(x);function init(){L.forEach((l,i)=>$('lecture').insertAdjacentHTML('beforeend',`<option value="${i}">Lecture ${i+1}: ${l.title}</option>`));$('lecture').onchange=e=>{li=+e.target.value;ti=0;render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));render()}function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));if(id==='simulator')bindSim();}function diagram(){if(li===0)return `<svg viewBox="0 0 760 180"><g font-size="18" text-anchor="middle">${['Analog input','Sample','Quantize','Encode','Digital word'].map((x,i)=>`<rect x="${20+i*145}" y="55" width="120" height="65" rx="10" fill="${i%2?'#f1effc':'#e8f7f5'}" stroke="#197d91"/><text x="${80+i*145}" y="92">${x}</text>${i<4?`<path d="M140 ${87} H${160+i*145}" stroke="#ed625e" stroke-width="4"/>`:''}`).join('')}</g></svg>`;if(li===1)return `<svg viewBox="0 0 650 220"><text x="25" y="70" font-size="22">A</text><text x="25" y="157" font-size="22">B</text><line x1="55" y1="63" x2="205" y2="63" stroke="#197d91" stroke-width="5"/><line x1="55" y1="150" x2="205" y2="150" stroke="#197d91" stroke-width="5"/><path d="M205 40 H305 A75 65 0 0 1 305 170 H205 Z" fill="#e9f7f6" stroke="#123b56" stroke-width="5"/><line x1="380" y1="105" x2="570" y2="105" stroke="#197d91" stroke-width="5"/><text x="585" y="112" font-size="22">Y</text><text x="260" y="205" font-size="22">AND gate</text></svg>`;if(li===3)return `<svg viewBox="0 0 620 330">${Array.from({length:16},(_,i)=>`<rect x="${150+(i%4)*85}" y="${55+Math.floor(i/4)*55}" width="85" height="55" fill="#fff" stroke="#123b56"/><text x="${190+(i%4)*85}" y="${88+Math.floor(i/4)*55}" text-anchor="middle">m${i}</text>`).join('')}<text x="320" y="30" text-anchor="middle" font-size="21">4-variable Karnaugh map</text></svg>`;return `<svg viewBox="0 0 720 180"><rect x="220" y="40" width="280" height="100" rx="18" fill="#e8f7f5" stroke="#123b56" stroke-width="4"/><text x="360" y="88" text-anchor="middle" font-size="24">${li===4?'Combinational block':'Boolean function'}</text><text x="360" y="118" text-anchor="middle">inputs → logic → output</text><line x1="40" y1="70" x2="220" y2="70" stroke="#197d91" stroke-width="4"/><line x1="40" y1="120" x2="220" y2="120" stroke="#197d91" stroke-width="4"/><line x1="500" y1="90" x2="680" y2="90" stroke="#ed625e" stroke-width="4"/></svg>`}function render(){let l=L[li];$('title').textContent=`Lecture ${li+1}: ${l.title}`;$('topics').innerHTML='<b>Topics</b>'+l.topics.map((t,i)=>`<button class="${i===ti?'active':''}" data-topic="${i}">${i+1}. ${t[0]}</button>`).join('');document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{ti=+b.dataset.topic;render()});let t=l.topics[ti];$('explanation').innerHTML=`<h2>${t[0]}</h2><div class="box explain"><h3>Detailed explanation</h3><p>${t[1]}</p></div><div class="diagram">${diagram()}</div><div class="box example"><h3>Worked example</h3><p>${t[2]}</p></div><div class="box clarify"><h3>Important clarification</h3><p>The rule applies to this topic only. Use the diagram and simulator to verify each input case instead of memorizing an unrelated general paragraph.</p></div><div class="controls"><button id="prev">Previous topic</button><button class="primary" id="openSim">Open simulator</button><button id="next">Next topic</button></div>`;$('prev').onclick=()=>{ti=Math.max(0,ti-1);render()};$('next').onclick=()=>{ti=Math.min(l.topics.length-1,ti+1);render()};$('openSim').onclick=()=>show('simulator');renderExamples();renderSim();renderQuiz()}function renderExamples(){let l=L[li];$('examples').innerHTML=`<h2>Lecture ${li+1} Worked Examples</h2>`+l.topics.map((t,i)=>`<div class="worked"><h3>${i+1}. ${t[0]}</h3><div class="step">Given: identify the input values and required output.</div><div class="step">Rule: ${t[1].split('.')[0]}.</div><div class="step">Calculation: ${t[2]}</div><div class="box example"><b>Verified result:</b> ${t[2]}</div></div>`).join('')}function renderSim(){$('simulator').innerHTML=`<h2>Lecture ${li+1} Simulator</h2>${simHtml()}`}function simHtml(){if(li===0)return `<div class="simgrid"><div class="sim"><h3>ADC Quantizer</h3><label>Voltage <b id="av">2.50 V</b></label><input id="adc" type="range" min="0" max="5" step=".01" value="2.5"><label>Bits <select id="bits"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label><div id="ar" class="read"></div></div><div class="sim"><h3>Waveform Calculator</h3><label>Period μs <input id="per" type="number" value="20"></label><label> HIGH μs <input id="hi" type="number" value="8"></label><div id="wr" class="read"></div></div></div>`;if(li===1)return `<div class="sim"><h3>Gate Simulator</h3><select id="gate"><option>AND</option><option>OR</option><option>NAND</option><option>NOR</option><option>XOR</option><option>XNOR</option></select><label class="switch"><input id="a" type="checkbox">A</label><label class="switch"><input id="b" type="checkbox">B</label><span id="lamp" class="lamp">0</span><div id="gr" class="read"></div></div>`;if(li===2)return `<div class="sim"><h3>Boolean Evaluator</h3><label class="switch"><input id="a" type="checkbox">A</label><label class="switch"><input id="b" type="checkbox">B</label><label class="switch"><input id="c" type="checkbox">C</label><select id="expr"><option value="abc">F=A+B·C</option><option value="abs">F=A+A·B</option><option value="dem">F=NOT(A+B)</option></select><div id="br" class="read"></div></div>`;if(li===3)return `<div class="sim"><h3>Interactive K-map</h3><p>Click a cell to change 0 → 1 → X.</p><div id="kg" class="kmap"></div><div id="kr" class="read"></div></div>`;return `<div class="simgrid"><div class="sim"><h3>Full Adder</h3><label class="switch"><input id="a" type="checkbox">A</label><label class="switch"><input id="b" type="checkbox">B</label><label class="switch"><input id="c" type="checkbox">Cin</label><span id="sl" class="lamp">0</span><span id="cl" class="lamp">0</span><div id="fr" class="read"></div></div><div class="sim"><h3>4-to-1 Multiplexer</h3><div class="bits">${[0,1,2,3].map(i=>`<button class="db" data-i="${i}">D${i}=0</button>`).join('')}</div><label class="switch"><input id="s1" type="checkbox">S1</label><label class="switch"><input id="s0" type="checkbox">S0</label><div id="mr" class="read"></div></div></div>`}function bindSim(){if(li===0){let u=()=>{let v=+$('adc').value,n=+$('bits').value,N=2**n,st=5/N,k=Math.min(N-1,Math.floor(v/st));$('av').textContent=v.toFixed(2)+' V';$('ar').innerHTML=`levels=${N}<br>step=${st.toFixed(4)} V<br>code=${k.toString(2).padStart(n,'0')}`},w=()=>{let T=+$('per').value,H=+$('hi').value;$('wr').innerHTML=`frequency=${(1000/T).toFixed(2)} kHz<br>duty=${(H/T*100).toFixed(1)}%`};$('adc').oninput=$('bits').onchange=u;$('per').oninput=$('hi').oninput=w;u();w()}else if(li===1){let u=()=>{let a=+$('a').checked,b=+$('b').checked,g=$('gate').value,y={AND:a&b,OR:a|b,NAND:!(a&b),NOR:!(a|b),XOR:a^b,XNOR:!(a^b)}[g]?1:0;$('gr').textContent=`${g}(${a},${b})=${y}`;$('lamp').textContent=y;$('lamp').classList.toggle('on',!!y)};$('a').onchange=$('b').onchange=$('gate').onchange=u;u()}else if(li===2){let u=()=>{let a=+$('a').checked,b=+$('b').checked,c=+$('c').checked,e=$('expr').value,y=e==='abc'?a|(b&c):e==='abs'?a|(a&b):!(a|b);$('br').textContent=`A=${a}, B=${b}, C=${c} → F=${+y}`};['a','b','c'].forEach(x=>$(x).onchange=u);$('expr').onchange=u;u()}else if(li===3){let v=Array(16).fill(0),draw=()=>{$('kg').innerHTML=v.map((x,i)=>`<button class="${x===1?'one':''}" data-k="${i}">m${i}<br>${x}</button>`).join('');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let i=+b.dataset.k;v[i]=v[i]===0?1:v[i]===1?'X':0;draw()});$('kr').textContent='Σm(' + v.map((x,i)=>x===1?i:null).filter(x=>x!==null).join(',') + ')'};draw()}else{let u=()=>{let a=+$('a').checked,b=+$('b').checked,c=+$('c').checked,s=a^b^c,co=(a&b)|(a&c)|(b&c);$('sl').textContent=s;$('cl').textContent=co;$('sl').classList.toggle('on',!!s);$('cl').classList.toggle('on',!!co);$('fr').innerHTML=`Sum=${s}<br>Cout=${co}`};['a','b','c'].forEach(x=>$(x).onchange=u);let d=[0,0,0,0],m=()=>{let i=+$('s1').checked*2 + +$('s0').checked;$('mr').textContent=`select D${i} → Y=${d[i]}`};document.querySelectorAll('.db').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;d[i]^=1;b.textContent=`D${i}=${d[i]}`;m()});$('s1').onchange=$('s0').onchange=m;u();m()}}function renderQuiz(){let t=L[li].topics;$('quiz').innerHTML=`<h2>Lecture ${li+1} Quiz</h2>`+t.map((x,i)=>`<div class="worked"><b>${i+1}. Which topic is described by this statement?</b><p>${x[1].split('.')[0]}.</p>${t.map((o,j)=>`<label style="display:block"><input type="radio" name="q${i}" value="${j}"> ${o[0]}</label>`).join('')}<p id="f${i}"></p></div>`).join('')+`<button class="primary" id="grade">Submit quiz</button><p id="score"></p>`;$('grade').onclick=()=>{let n=0;t.forEach((x,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`),ok=a&&+a.value===i;if(ok)n++;$('f'+i).textContent=ok?'Correct.':'Correct answer: '+x[0]});$('score').innerHTML=`<b>Score: ${n}/${t.length}</b>`}}init();</script></body></html>
