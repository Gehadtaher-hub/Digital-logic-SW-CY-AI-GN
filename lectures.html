<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Logic Lectures</title><style>:root{--n:#123b56;--t:#197d91;--v:#6555ad;--g:#f0b23b;--r:#ed625e;--line:#c8e1df}*{box-sizing:border-box}body{margin:0;font:16px/1.6 Segoe UI,Arial;color:#17343d;background:linear-gradient(135deg,#fff8e6,#edf9f7,#efecfb)}header{background:linear-gradient(100deg,var(--n),var(--t),var(--v));padding:14px 20px;color:white;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:4px solid var(--g)}.headlinks{display:flex;gap:9px;flex-wrap:wrap}.headlinks a{display:inline-block;background:white;color:var(--n);padding:9px 13px;border-radius:9px;text-decoration:none;font-weight:800;white-space:nowrap}main{max-width:1200px;margin:auto;padding:16px}.hero,.panel,.topics{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 24px #123b5615}.hero h1{margin:0}.controls,.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}button,select,.link{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:white;color:var(--n);font-weight:800;cursor:pointer;text-decoration:none}.active,.primary{color:white!important;background:linear-gradient(100deg,var(--t),var(--v))!important}.layout{display:grid;grid-template-columns:290px 1fr;gap:14px}.topics{max-height:75vh;overflow:auto}.topics button{width:100%;display:block;text-align:left;margin:6px 0}.view{display:none}.view.active{display:block}.box{padding:15px;border-radius:11px;margin:12px 0}.explain{background:#edf9f8;border-left:6px solid var(--t)}.example{background:#fff7dd;border-left:6px solid var(--g)}.note{background:#fff0ef;border-left:6px solid var(--r)}.diagram{background:#fbffff;border:1px solid var(--line);border-radius:13px;padding:14px;overflow:auto}.diagram svg{display:block;max-width:100%;height:auto;margin:auto}.simgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.sim{border:1px solid var(--line);border-radius:12px;padding:15px}.read{background:#102f42;color:#cafff4;padding:12px;border-radius:9px;font-family:Consolas,monospace;margin-top:10px}.switch{display:inline-flex;gap:6px;padding:8px;margin:4px;border:1px solid var(--line);border-radius:8px}.lamp{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:#ccd7d8;border:5px solid #789;font-weight:900}.lamp.on{background:#ffe45e;border-color:#e3a719;box-shadow:0 0 20px #ffd33d}.kgrid{display:grid;grid-template-columns:repeat(4,58px);gap:5px;justify-content:center}.kgrid button{width:58px;height:54px;padding:2px}.one{background:#ffe49a!important}.worked{border:1px solid var(--line);border-radius:12px;padding:15px;margin:12px 0}.step{background:#f1f6f6;padding:8px;border-radius:7px;margin:6px 0;font-family:Consolas,monospace}@media(max-width:760px){header{align-items:stretch}.headlinks{width:100%}.headlinks a{flex:1;text-align:center}.layout{display:block}.topics{max-height:none;margin-bottom:12px}.topics button{width:auto;display:inline-block}main{padding:9px}.tabs>*{flex:1;text-align:center}}</style></head><body><header><b>Digital Logic: Lectures 1–5</b><div class="headlinks"><a href="index.html">Main Book</a><a href="studio.html">Practice Studio</a></div></header><main><section class="hero"><h1 id="title"></h1><p>Explanation, topic-specific diagrams, detailed worked examples, simulator, and quiz in one page.</p></section><div class="controls"><label><b>Lecture: </b><select id="lecture"></select></label></div><nav class="tabs"><button class="active" data-v="explain">Explanation</button><button data-v="examples">Worked Examples</button><button data-v="sim">Simulator</button><button data-v="quiz">Quiz</button><a class="link" href="studio.html">Practice Studio</a></nav><div class="layout"><aside class="topics" id="topics"></aside><section><div id="explain" class="view active panel"></div><div id="examples" class="view panel"></div><div id="sim" class="view panel"></div><div id="quiz" class="view panel"></div></section></div></main><script>const L=[{"title":"Digital and Analog Foundations","topics":[{"t":"Digital and Analog Quantities","e":"Analog quantities vary continuously across a range. Digital quantities are represented by discrete states. A digital system still uses physical voltages, but each voltage is interpreted within a permitted LOW or HIGH range.","x":["A microphone voltage varies continuously, so the microphone output is analog.","After conversion, a sample such as 101₂ is digital because the sample uses discrete binary states."],"d":"analog"},{"t":"Advantages of Digital Systems","e":"Digital systems provide repeatable storage, programmable processing, easier error detection, and strong tolerance to small voltage disturbances. Digital does not mean perfectly immune to noise; a disturbance becomes a problem when a signal crosses a logic threshold.","x":["A stored binary word can be copied without gradually changing its numerical value.","A noisy HIGH remains a valid 1 while the voltage stays inside the accepted HIGH range."],"d":"levels"},{"t":"Hybrid Digital System","e":"A hybrid system connects an analog environment to digital processing. A sensor produces an analog signal, an ADC creates binary data, a processor operates on the data, and a DAC or digital actuator creates a physical output.","x":["Digital audio path: microphone → ADC → digital processing → DAC → loudspeaker.","Temperature control path: sensor → ADC → controller → driver → fan."],"d":"hybrid"},{"t":"ADC: Sampling","e":"Sampling measures an analog signal at specific instants. Sampling controls when measurements are taken. Sampling does not yet choose a binary code or a quantization level.","x":["At times 0, 1, 2, and 3 ms, the ADC records four instantaneous voltage samples.","Increasing the sampling rate creates more measurements per second."],"d":"sampling"},{"t":"ADC: Quantization and Encoding","e":"Quantization assigns each sample to one of a finite number of levels. Encoding converts the selected level number into a binary word. An n-bit ADC provides 2ⁿ possible codes.","x":["A 3-bit ADC has 2³=8 codes: 000 through 111.","For a 0–5 V range using 8 equal intervals, the nominal step is 5/8=0.625 V."],"d":"quant"},{"t":"DAC Operation","e":"A DAC converts a binary input into a proportional analog voltage or current. More input bits provide more possible output steps and therefore finer resolution.","x":["For a 3-bit DAC, code 101₂ represents decimal 5.","With an ideal 0–5 V scale based on 7 full-scale intervals, output=5×5/7≈3.57 V."],"d":"dac"},{"t":"Binary Digits and Logic Levels","e":"A bit is a binary digit with value 0 or 1. In positive logic, LOW represents 0 and HIGH represents 1. Real devices define ranges for valid LOW and HIGH voltages, with an undefined region between them.","x":["A voltage inside the valid LOW range is interpreted as 0.","A voltage inside the valid HIGH range is interpreted as 1."],"d":"levels"},{"t":"Digital Pulses and Edges","e":"A positive-going pulse begins with a rising edge and ends with a falling edge. Real transitions require time. Rise time is commonly measured from 10% to 90% of amplitude, and fall time from 90% to 10%.","x":["LOW→HIGH is a rising edge.","HIGH→LOW is a falling edge."],"d":"pulse"},{"t":"Period and Frequency","e":"The period T is the duration of one complete cycle. Frequency f is the number of cycles per second. The quantities are reciprocal: f=1/T and T=1/f. Convert the period to seconds before calculating frequency in hertz.","x":["T=2 ms=0.002 s, so f=1/0.002=500 Hz.","f=1 MHz, so T=1 μs."],"d":"frequency"},{"t":"Pulse Width and Duty Cycle","e":"Pulse width is the time a pulse remains active. Duty cycle is the active time as a percentage of the complete period: duty=(HIGH time/T)×100%.","x":["HIGH time=5 ms and T=20 ms gives duty=25%.","A 50% duty cycle has equal HIGH and LOW durations."],"d":"duty"},{"t":"Timing Diagrams","e":"A timing diagram shows several digital signals on one time axis. To find an output waveform, divide the time axis at every input transition and evaluate the circuit separately within each interval.","x":["For an inverter, output is LOW during every interval in which input is HIGH.","For AND, output is HIGH only during intervals where all inputs are HIGH."],"d":"timing"},{"t":"Serial and Parallel Data Transfer","e":"Serial transfer sends bits sequentially over one or a small number of paths. Parallel transfer sends several bits simultaneously using several paths. Serial reduces wiring, while parallel can move a short word in one transfer interval.","x":["Eight serial bits at 2 μs per bit require 16 μs.","An 8-bit parallel transfer uses eight data paths for one simultaneous word."],"d":"transfer"}]},{"title":"Logic Gates and Boolean Functions","topics":[{"t":"The Inverter","e":"The NOT gate produces the complement of its input. A bubble on a logic symbol indicates inversion or an active-LOW terminal.","x":["NOT 1=0.","The 1's complement of 1010 is 0101."],"d":"not"},{"t":"AND Gate","e":"AND is HIGH only when every input is HIGH. Its Boolean expression is Y=A·B.","x":["A=1,B=1 gives Y=1.","Any input 0 forces Y=0."],"d":"and"},{"t":"OR Gate","e":"OR is HIGH when at least one input is HIGH. Its Boolean expression is Y=A+B.","x":["A=0,B=1 gives Y=1.","Only 00 gives Y=0."],"d":"or"},{"t":"NAND and NOR","e":"NAND complements AND. NOR complements OR. Both are universal gates.","x":["NAND(1,1)=0.","NOR(0,0)=1."],"d":"nand"},{"t":"XOR and XNOR","e":"XOR is HIGH when inputs differ. XNOR is HIGH when inputs are equal.","x":["XOR(1,0)=1.","XNOR(1,1)=1."],"d":"xor"},{"t":"Gate Timing Analysis","e":"Mark every input transition, create time intervals, and evaluate the gate in each interval.","x":["An AND waveform is HIGH only where both input waveforms overlap HIGH.","An inverter output changes after each input transition."],"d":"timing"}]},{"title":"Boolean Algebra and Simplification","topics":[{"t":"Boolean Operators","e":"Complement, product, and sum represent NOT, AND, and OR. Normal precedence is NOT, then AND, then OR.","x":["In A+B·C, evaluate B·C first.","An overbar applies to the grouped expression beneath it."],"d":"boolean"},{"t":"Identity and Null Laws","e":"A+0=A, A·1=A, A+1=1, and A·0=0.","x":["X·1+0=X.","Y+1=1."],"d":"laws"},{"t":"Complement and Absorption","e":"A+A̅=1, A·A̅=0, A+AB=A, and A(A+B)=A.","x":["A+AB simplifies to A.","A·A̅ is always 0."],"d":"laws"},{"t":"DeMorgan’s Theorems","e":"The complement of a product is the sum of complements. The complement of a sum is the product of complements.","x":["NOT(AB)=A̅+B̅.","NOT(A+B)=A̅B̅."],"d":"demorgan"},{"t":"Expressions and Circuits","e":"Name intermediate gate outputs, then substitute them into the final output expression.","x":["X=B·C and F=A+X gives F=A+B·C.","Use a truth table to verify equivalence."],"d":"circuit"}]},{"title":"Canonical Forms and Karnaugh Maps","topics":[{"t":"Minterms and Canonical SOP","e":"A minterm contains every variable once. Canonical SOP includes the minterms for output-1 rows.","x":["Input 101 gives minterm A·B̅·C=m5.","F=Σm(1,3,5,7)."],"d":"sop"},{"t":"Maxterms and Canonical POS","e":"A maxterm contains every variable once. Canonical POS includes the maxterms for output-0 rows.","x":["Use ΠM(indices) notation.","Minterm and maxterm literal rules are opposite."],"d":"pos"},{"t":"K-map Structure","e":"K-map rows and columns use Gray-code order so adjacent cells differ in only one variable.","x":["A four-variable map has 16 cells.","Opposite edges are adjacent."],"d":"kmap"},{"t":"Grouping and Simplification","e":"Group 1s in powers of two. Keep only variables that remain constant within each group.","x":["Σm(1,3,5,7) simplifies to C.","A group of four eliminates two changing variables."],"d":"group"},{"t":"Don’t-Care Conditions","e":"A don't-care may be treated as 0 or 1 when that creates a simpler result.","x":["Use X to enlarge a group when helpful.","Do not include X when it does not improve the expression."],"d":"dontcare"}]},{"title":"Combinational Circuit Design","topics":[{"t":"Combinational Design Procedure","e":"Define inputs and outputs, build the truth table, derive each output function, simplify, implement, and verify.","x":["n inputs produce 2ⁿ possible input combinations.","Outputs depend on present inputs only."],"d":"design"},{"t":"Half Adder","e":"A half adder adds two bits: Sum=A⊕B and Carry=A·B.","x":["1+1 gives Sum=0, Carry=1.","0+1 gives Sum=1, Carry=0."],"d":"halfadder"},{"t":"Full Adder","e":"A full adder adds A, B, and Cin. Sum=A⊕B⊕Cin and Cout is HIGH when at least two inputs are HIGH.","x":["1+1+1=11₂, so Sum=1,Cout=1.","0+1+1=10₂, so Sum=0,Cout=1."],"d":"fulladder"},{"t":"Subtractors and Adder-Subtractor","e":"A subtractor produces Difference and Borrow. An adder-subtractor uses conditional complementing and two's complement.","x":["0−1 gives Difference=1 and Borrow=1.","Control 0 selects addition and control 1 selects subtraction."],"d":"subtractor"},{"t":"BCD Adder","e":"BCD correction adds 0110 when a four-bit sum is greater than 1001 or produces a decimal carry.","x":["7+5=1100; add 0110 to obtain BCD 0001 0010.","Each decimal digit uses a separate 4-bit code."],"d":"bcd"},{"t":"Decoder and Encoder","e":"A decoder activates one output for an input code. An encoder maps an active input into a code.","x":["A 3-to-8 decoder has eight output lines.","Input 101 selects output 5."],"d":"decoder"},{"t":"Multiplexer","e":"A multiplexer routes one of several data inputs to one output using select lines.","x":["A 4-to-1 MUX needs two select lines.","S1S0=10 selects D2."],"d":"mux"}]}];let li=0,ti=0,$=x=>document.getElementById(x);function init(){L.forEach((l,i)=>lecture.insertAdjacentHTML('beforeend',`<option value="${i}">Lecture ${i+1}: ${l.title}</option>`));lecture.onchange=e=>{li=+e.target.value;ti=0;render();show('explain')};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));render()}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x.dataset.v===id));if(id==='sim')bind()}function svg(t){let common='viewBox="0 0 760 260" role="img" aria-label="'+t.t+' diagram"';if(t.d==='analog')return `<svg ${common}><defs><linearGradient id="g"><stop stop-color="#197d91"/><stop offset="1" stop-color="#6555ad"/></linearGradient></defs><path d="M30 135 C90 35 150 235 210 135 S330 35 390 135 S510 235 570 135" fill="none" stroke="url(#g)" stroke-width="6"/><text x="300" y="35" font-size="22">Analog: continuous amplitude</text><path d="M30 230 H100 V175 H180 V230 H260 V175 H340 V230 H430 V175 H510 V230 H590" fill="none" stroke="#ed625e" stroke-width="6"/><text x="610" y="205" font-size="20">Digital</text></svg>`;if(t.d==='levels')return `<svg ${common}><line x1="70" y1="210" x2="690" y2="210" stroke="#123b56"/><rect x="90" y="145" width="190" height="65" fill="#dff4f5"/><rect x="470" y="55" width="190" height="155" fill="#ded8ff"/><rect x="280" y="110" width="190" height="100" fill="#fff0ef"/><text x="185" y="180" text-anchor="middle" font-size="22">Valid LOW = 0</text><text x="565" y="95" text-anchor="middle" font-size="22">Valid HIGH = 1</text><text x="375" y="145" text-anchor="middle">Undefined region</text></svg>`;if(t.d==='hybrid')return flow(['Sensor','ADC','Processor','DAC / Driver','Physical output']);if(t.d==='sampling')return `<svg ${common}><path d="M20 140 C90 40 150 240 220 140 S350 40 420 140 S550 240 620 140" fill="none" stroke="#197d91" stroke-width="5"/>${[80,170,260,350,440,530,620].map(x=>`<line x1="${x}" y1="45" x2="${x}" y2="225" stroke="#ed625e" stroke-dasharray="6 5"/><circle cx="${x}" cy="140" r="7" fill="#ed625e"/>`).join('')}<text x="380" y="30" text-anchor="middle" font-size="22">Samples taken at discrete times</text></svg>`;if(t.d==='quant')return `<svg ${common}><path d="M40 220 H150 V185 H260 V145 H370 V105 H480 V65 H620" fill="none" stroke="#6555ad" stroke-width="7"/><g font-size="17">${[['000',80,235],['001',180,200],['010',290,160],['011',400,120],['100',520,80]].map(a=>`<text x="${a[1]}" y="${a[2]}">${a[0]}</text>`).join('')}</g><text x="380" y="30" text-anchor="middle" font-size="22">Quantized levels and binary codes</text></svg>`;if(t.d==='dac')return flow(['Binary word','DAC network','Analog steps','Filter','Analog output']);if(t.d==='pulse'||t.d==='frequency'||t.d==='duty'||t.d==='timing')return `<svg ${common}><path d="M35 210 H120 V70 H310 V210 H430 V70 H650" fill="none" stroke="#197d91" stroke-width="7"/><line x1="120" y1="35" x2="310" y2="35" stroke="#ed625e" stroke-width="3"/><text x="215" y="27" text-anchor="middle">HIGH time</text><line x1="120" y1="238" x2="430" y2="238" stroke="#6555ad" stroke-width="3"/><text x="275" y="255" text-anchor="middle">Period T</text></svg>`;if(t.d==='transfer')return `<svg ${common}><text x="35" y="55" font-size="21">Serial</text><line x1="130" y1="48" x2="700" y2="48" stroke="#197d91" stroke-width="5"/><text x="260" y="35">1 0 1 1 0 0 1 0 over time</text><text x="35" y="115" font-size="21">Parallel</text>${[0,1,2,3,4,5,6,7].map((n,i)=>`<line x1="130" y1="${95+i*20}" x2="700" y2="${95+i*20}" stroke="${i%2?'#6555ad':'#197d91'}" stroke-width="3"/><text x="100" y="${100+i*20}">b${n}</text>`).join('')}</svg>`;if(['not','and','or','nand','xor'].includes(t.d)){let label=t.t,inv=t.d==='not'||t.d==='nand';return `<svg ${common}><text x="35" y="95" font-size="22">A</text><text x="35" y="175" font-size="22">B</text><line x1="70" y1="88" x2="230" y2="88" stroke="#197d91" stroke-width="5"/><line x1="70" y1="168" x2="230" y2="168" stroke="#197d91" stroke-width="5"/><rect x="230" y="55" width="250" height="145" rx="28" fill="#e8f7f5" stroke="#123b56" stroke-width="5"/><text x="355" y="135" text-anchor="middle" font-size="28">${label}</text>${inv?'<circle cx="495" cy="128" r="15" fill="white" stroke="#123b56" stroke-width="5"/>':''}<line x1="${inv?510:480}" y1="128" x2="680" y2="128" stroke="#ed625e" stroke-width="5"/><text x="695" y="136" font-size="22">Y</text></svg>`}if(['kmap','group','dontcare','sop','pos'].includes(t.d))return `<svg ${common}><text x="380" y="28" text-anchor="middle" font-size="21">Gray-code order: 00 01 11 10</text>${Array.from({length:16},(_,i)=>`<rect x="${190+(i%4)*90}" y="${45+Math.floor(i/4)*50}" width="90" height="50" fill="${t.d==='group'&&[1,3,5,7].includes(i)?'#ffe49a':'#fff'}" stroke="#123b56"/><text x="${235+(i%4)*90}" y="${76+Math.floor(i/4)*50}" text-anchor="middle">m${i}</text>`).join('')}</svg>`;if(t.d.includes('adder'))return flow(['A, B, Cin','XOR stage','Sum','Carry logic','Cout']);if(t.d==='mux')return flow(['D0–D3','Select S1S0','4-to-1 MUX','Selected path','Y']);if(t.d==='decoder')return flow(['Binary code','Decoder','One active line','Encoder','Binary code']);return flow(['Inputs','Boolean rule','Intermediate result','Verification','Output'])}function flow(a){return `<svg viewBox="0 0 800 180">${a.map((x,i)=>`<rect x="${20+i*155}" y="55" width="125" height="70" rx="12" fill="${i%2?'#f1effc':'#e8f7f5'}" stroke="#197d91"/><text x="${82+i*155}" y="96" text-anchor="middle" font-size="17">${x}</text>${i<4?`<path d="M145 ${90} H${175+i*155}" stroke="#ed625e" stroke-width="4"/>`:''}`).join('')}</svg>`}function render(){let l=L[li],t=l.topics[ti];title.textContent=`Lecture ${li+1}: ${l.title}`;topics.innerHTML='<h3>Topics</h3>'+l.topics.map((x,i)=>`<button data-t="${i}" class="${i===ti?'active':''}">${i+1}. ${x.t}</button>`).join('');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ti=+b.dataset.t;render()});explain.innerHTML=`<h2>${t.t}</h2><div class="box explain"><h3>Detailed explanation</h3><p>${t.e}</p></div><div class="diagram">${svg(t)}</div><div class="box example"><h3>Worked examples</h3><ol>${t.x.map(x=>`<li>${x}</li>`).join('')}</ol></div><div class="box note"><b>Important:</b> The diagram and worked examples on this topic are specific to ${t.t}; they are not reused from another topic.</div>`;examples.innerHTML=`<h2>Lecture ${li+1} Worked Examples</h2>`+l.topics.map((x,i)=>`<div class="worked"><h3>${i+1}. ${x.t}</h3>${x.x.map((e,n)=>`<div class="step">Example ${n+1}: ${e}</div>`).join('')}</div>`).join('');sim.innerHTML=simHtml();quiz.innerHTML=quizHtml()}function simHtml(){if(li===0)return `<h2>Lecture 1 Simulator</h2><div class="simgrid"><div class="sim"><h3>ADC Quantizer</h3><input id="adc" type="range" min="0" max="5" step=".01" value="2.5" style="width:100%"><select id="bits"><option>2</option><option selected>3</option><option>4</option><option>5</option></select><div id="ar" class="read"></div></div><div class="sim"><h3>Waveform Calculator</h3><input id="per" type="number" value="20"> μs period <input id="hi" type="number" value="8"> μs HIGH<div id="wr" class="read"></div></div></div>`;if(li===1)return `<h2>Gate Simulator</h2><div class="sim"><select id="gate"><option>AND</option><option>OR</option><option>NAND</option><option>NOR</option><option>XOR</option><option>XNOR</option></select><label class="switch"><input id="a" type="checkbox">A</label><label class="switch"><input id="b" type="checkbox">B</label><span id="lamp" class="lamp">0</span><div id="gr" class="read"></div></div>`;if(li===3)return `<h2>Interactive K-map</h2><div id="kg" class="kgrid"></div><div id="kr" class="read"></div>`;return `<h2>Lecture ${li+1} Simulator</h2><div class="sim"><label class="switch"><input id="a" type="checkbox">A</label><label class="switch"><input id="b" type="checkbox">B</label><label class="switch"><input id="c" type="checkbox">C / Cin</label><div id="br" class="read"></div></div>`}function bind(){if(li===0){let u=()=>{let v=+adc.value,n=+bits.value,N=2**n,s=5/N,k=Math.min(N-1,Math.floor(v/s));ar.innerHTML=`input=${v.toFixed(2)} V<br>levels=${N}<br>step=${s.toFixed(4)} V<br>code=${k.toString(2).padStart(n,'0')}`},w=()=>wr.innerHTML=`frequency=${(1000/+per.value).toFixed(2)} kHz<br>duty=${(+hi.value/+per.value*100).toFixed(1)}%`;adc.oninput=bits.onchange=u;per.oninput=hi.oninput=w;u();w()}else if(li===1){let u=()=>{let A=+a.checked,B=+b.checked,g=gate.value,y={AND:A&B,OR:A|B,NAND:!(A&B),NOR:!(A|B),XOR:A^B,XNOR:!(A^B)}[g]?1:0;gr.textContent=`${g}(${A},${B})=${y}`;lamp.textContent=y;lamp.classList.toggle('on',!!y)};a.onchange=b.onchange=gate.onchange=u;u()}else if(li===3){let v=Array(16).fill(0),d=()=>{kg.innerHTML=v.map((x,i)=>`<button data-k="${i}" class="${x===1?'one':''}">m${i}<br>${x}</button>`).join('');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let i=+b.dataset.k;v[i]=v[i]===0?1:v[i]===1?'X':0;d()});kr.textContent='Σm('+v.map((x,i)=>x===1?i:null).filter(x=>x!==null).join(',')+')'};d()}else{let u=()=>{let A=+a.checked,B=+b.checked,C=+c.checked;if(li===2)br.textContent=`A+B·C = ${A|(B&C)}; A+AB = ${A|(A&B)}`;else br.textContent=`Sum=${A^B^C}; Cout=${(A&B)|(A&C)|(B&C)}`};a.onchange=b.onchange=c.onchange=u;u()}}function quizHtml(){let t=L[li].topics.slice(0,6);return `<h2>Lecture ${li+1} Quiz</h2>`+t.map((x,i)=>`<div class="worked"><b>${i+1}. Which topic matches this statement?</b><p>${x.e.split('.')[0]}.</p>${t.map((o,j)=>`<label style="display:block"><input type="radio" name="q${i}" value="${j}"> ${o.t}</label>`).join('')}<p id="f${i}"></p></div>`).join('')+`<button id="grade" class="primary">Submit quiz</button><p id="score"></p>`}function gradeQuiz(){let t=L[li].topics.slice(0,6),n=0;t.forEach((x,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`),ok=a&&+a.value===i;if(ok)n++;$('f'+i).textContent=ok?'Correct.':'Correct answer: '+x.t});score.innerHTML=`<b>Score: ${n}/${t.length}</b>`}document.addEventListener('click',e=>{if(e.target.id==='grade')gradeQuiz()});function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x.dataset.v===id));if(id==='sim')bind()}function init(){L.forEach((l,i)=>lecture.insertAdjacentHTML('beforeend',`<option value="${i}">Lecture ${i+1}: ${l.title}</option>`));lecture.onchange=e=>{li=+e.target.value;ti=0;render();show('explain')};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));render()}init();</script></body></html>
