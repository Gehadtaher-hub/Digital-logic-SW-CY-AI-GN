<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Logic Lectures</title><style>:root{--n:#123b56;--t:#197d91;--v:#6555ad;--g:#f0b23b;--r:#ed625e;--line:#c8e1df}*{box-sizing:border-box}body{margin:0;font:16px/1.6 Segoe UI,Arial;color:#17343d;background:linear-gradient(135deg,#fff8e6,#edf9f7,#efecfb)}header{position:sticky;top:0;z-index:100;background:linear-gradient(100deg,var(--n),var(--t),var(--v));padding:14px 20px;color:white;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:4px solid var(--g)}.headlinks{display:flex;gap:9px;flex-wrap:wrap}.headlinks a{display:inline-block;background:white;color:var(--n);padding:9px 13px;border-radius:9px;text-decoration:none;font-weight:800;white-space:nowrap}main{max-width:1200px;scroll-margin-top:90px;margin:auto;padding:16px}.hero,.panel,.topics{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 24px #123b5615}.hero h1{margin:0}.controls,.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}button,select,.link{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:white;color:var(--n);font-weight:800;cursor:pointer;text-decoration:none}button.active,.topics button.active,.primary{color:white!important;background:linear-gradient(100deg,var(--t),var(--v))!important}.view.active{display:block;background:white;color:#17343d}.layout{display:grid;grid-template-columns:290px 1fr;gap:14px}.topics{max-height:75vh;overflow:auto}.topics button{width:100%;display:block;text-align:left;margin:6px 0}.view{display:none}.view.active{display:block;background:white;color:#17343d}.box{padding:15px;border-radius:11px;margin:12px 0}.explain{background:#edf9f8;border-left:6px solid var(--t);color:#17343d}.example{background:#fff7dd;border-left:6px solid var(--g);color:#17343d}.note{background:#fff0ef;border-left:6px solid var(--r);color:#17343d}.diagram{background:#fbffff;border:1px solid var(--line);border-radius:13px;padding:14px;overflow:auto}.diagram svg{display:block;max-width:100%;height:auto;margin:auto}.simgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.sim{border:1px solid var(--line);border-radius:12px;padding:15px}.read{background:#102f42;color:#cafff4;padding:12px;border-radius:9px;font-family:Consolas,monospace;margin-top:10px}.switch{display:inline-flex;gap:6px;padding:8px;margin:4px;border:1px solid var(--line);border-radius:8px}.lamp{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:#ccd7d8;border:5px solid #789;font-weight:900}.lamp.on{background:#ffe45e;border-color:#e3a719;box-shadow:0 0 20px #ffd33d}.kgrid{display:grid;grid-template-columns:repeat(4,58px);gap:5px;justify-content:center}.kgrid button{width:58px;height:54px;padding:2px}.one{background:#ffe49a!important}.worked{border:1px solid var(--line);border-radius:12px;padding:15px;margin:12px 0}.step{background:#f1f6f6;padding:8px;border-radius:7px;margin:6px 0;font-family:Consolas,monospace}.diagram-wrap{position:relative}.replay{position:absolute;right:10px;top:10px;z-index:2;background:#fff;border:1px solid var(--line);padding:7px 10px;font-size:13px}.diagram svg .trace{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.8s ease forwards}.diagram svg path{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.8s ease forwards}.diagram svg rect{transform-box:fill-box;transform-origin:center;animation:pop .55s ease both}.diagram svg circle{transform-box:fill-box;transform-origin:center;animation:sample .7s ease both}.diagram svg text{opacity:0;animation:fade .55s ease .7s forwards}.diagram svg line{opacity:0;animation:fade .45s ease .25s forwards}@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}@keyframes sample{from{opacity:0;transform:scale(.25)}to{opacity:1;transform:scale(1)}}@keyframes fade{to{opacity:1}}@media(prefers-reduced-motion:reduce){.diagram svg *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}@media(max-width:760px){header{align-items:stretch}.headlinks{width:100%}.headlinks a{flex:1;text-align:center}.layout{display:block}.topics{max-height:none;margin-bottom:12px}.topics button{width:auto;display:inline-block}main{padding:9px}.tabs>*{flex:1;text-align:center}}</style></head><body><header><b>Digital Logic: Lectures 1–5</b><div class="headlinks"><a href="index.html">Main Book</a><a href="studio.html">Practice Studio</a></div></header><main><section class="hero"><h1 id="title"></h1><p>Explanation, topic-specific diagrams, detailed worked examples, simulator, and quiz in one page.</p></section><div class="controls"><label><b>Lecture: </b><select id="lecture"></select></label></div><nav class="tabs"><button class="active" data-v="explain">Explanation</button><button data-v="examples">Worked Examples</button><button data-v="sim">Simulator</button><button data-v="quiz">Quiz</button><a class="link" href="studio.html">Practice Studio</a></nav><div class="layout"><aside class="topics" id="topics"></aside><section><div id="explain" class="view active panel"></div><div id="examples" class="view panel"></div><div id="sim" class="view panel"></div><div id="quiz" class="view panel"></div></section></div></main><script>const L=[{"title":"Digital and Analog Foundations","topics":[{"t":"Digital and Analog Quantities","e":"Analog quantities vary continuously across a range. Digital quantities are represented by discrete states. A digital system still uses physical voltages, but each voltage is interpreted within a permitted LOW or HIGH range.","x":["A microphone voltage varies continuously, so the microphone output is analog.","After conversion, a sample such as 101₂ is digital because the sample uses discrete binary states."],"d":"analog"},{"t":"Advantages of Digital Systems","e":"Digital systems provide repeatable storage, programmable processing, easier error detection, and strong tolerance to small voltage disturbances. Digital does not mean perfectly immune to noise; a disturbance becomes a problem when a signal crosses a logic threshold.","x":["A stored binary word can be copied without gradually changing its numerical value.","A noisy HIGH remains a valid 1 while the voltage stays inside the accepted HIGH range."],"d":"levels"},{"t":"Hybrid Digital System","e":"A hybrid system connects an analog environment to digital processing. A sensor produces an analog signal, an ADC creates binary data, a processor operates on the data, and a DAC or digital actuator creates a physical output.","x":["Digital audio path: microphone → ADC → digital processing → DAC → loudspeaker.","Temperature control path: sensor → ADC → controller → driver → fan."],"d":"hybrid"},{"t":"ADC: Sampling","e":"Sampling measures an analog signal at specific instants. Sampling controls when measurements are taken. Sampling does not yet choose a binary code or a quantization level.","x":["At times 0, 1, 2, and 3 ms, the ADC records four instantaneous voltage samples.","Increasing the sampling rate creates more measurements per second."],"d":"sampling"},{"t":"ADC: Quantization and Encoding","e":"Quantization assigns each sample to one of a finite number of levels. Encoding converts the selected level number into a binary word. An n-bit ADC provides 2ⁿ possible codes.","x":["A 3-bit ADC has 2³=8 codes: 000 through 111.","For a 0–5 V range using 8 equal intervals, the nominal step is 5/8=0.625 V."],"d":"quant"},{"t":"DAC Operation","e":"A DAC converts a binary input into a proportional analog voltage or current. More input bits provide more possible output steps and therefore finer resolution.","x":["For a 3-bit DAC, code 101₂ represents decimal 5.","With an ideal 0–5 V scale based on 7 full-scale intervals, output=5×5/7≈3.57 V."],"d":"dac"},{"t":"Binary Digits and Logic Levels","e":"A bit is a binary digit with value 0 or 1. In positive logic, LOW represents 0 and HIGH represents 1. Real devices define ranges for valid LOW and HIGH voltages, with an undefined region between them.","x":["A voltage inside the valid LOW range is interpreted as 0.","A voltage inside the valid HIGH range is interpreted as 1."],"d":"levels"},{"t":"Digital Pulses and Edges","e":"A positive-going pulse begins with a rising edge and ends with a falling edge. Real transitions require time. Rise time is commonly measured from 10% to 90% of amplitude, and fall time from 90% to 10%.","x":["LOW→HIGH is a rising edge.","HIGH→LOW is a falling edge."],"d":"pulse"},{"t":"Period and Frequency","e":"The period T is the duration of one complete cycle. Frequency f is the number of cycles per second. The quantities are reciprocal: f=1/T and T=1/f. Convert the period to seconds before calculating frequency in hertz.","x":["T=2 ms=0.002 s, so f=1/0.002=500 Hz.","f=1 MHz, so T=1 μs."],"d":"frequency"},{"t":"Pulse Width and Duty Cycle","e":"Pulse width is the time a pulse remains active. Duty cycle is the active time as a percentage of the complete period: duty=(HIGH time/T)×100%.","x":["HIGH time=5 ms and T=20 ms gives duty=25%.","A 50% duty cycle has equal HIGH and LOW durations."],"d":"duty"},{"t":"Timing Diagrams","e":"A timing diagram shows several digital signals on one time axis. To find an output waveform, divide the time axis at every input transition and evaluate the circuit separately within each interval.","x":["For an inverter, output is LOW during every interval in which input is HIGH.","For AND, output is HIGH only during intervals where all inputs are HIGH."],"d":"timing"},{"t":"Serial and Parallel Data Transfer","e":"Serial transfer sends bits sequentially over one or a small number of paths. Parallel transfer sends several bits simultaneously using several paths. Serial reduces wiring, while parallel can move a short word in one transfer interval.","x":["Eight serial bits at 2 μs per bit require 16 μs.","An 8-bit parallel transfer uses eight data paths for one simultaneous word."],"d":"transfer"}]},{"title":"Logic Gates and Boolean Functions","topics":[{"t":"The Inverter","e":"The NOT gate produces the complement of its input. A bubble on a logic symbol indicates inversion or an active-LOW terminal.","x":["NOT 1=0.","The 1's complement of 1010 is 0101."],"d":"not"},{"t":"AND Gate","e":"AND is HIGH only when every input is HIGH. Its Boolean expression is Y=A·B.","x":["A=1,B=1 gives Y=1.","Any input 0 forces Y=0."],"d":"and"},{"t":"OR Gate","e":"OR is HIGH when at least one input is HIGH. Its Boolean expression is Y=A+B.","x":["A=0,B=1 gives Y=1.","Only 00 gives Y=0."],"d":"or"},{"t":"NAND and NOR","e":"NAND complements AND. NOR complements OR. Both are universal gates.","x":["NAND(1,1)=0.","NOR(0,0)=1."],"d":"nand"},{"t":"XOR and XNOR","e":"XOR is HIGH when inputs differ. XNOR is HIGH when inputs are equal.","x":["XOR(1,0)=1.","XNOR(1,1)=1."],"d":"xor"},{"t":"Gate Timing Analysis","e":"Mark every input transition, create time intervals, and evaluate the gate in each interval.","x":["An AND waveform is HIGH only where both input waveforms overlap HIGH.","An inverter output changes after each input transition."],"d":"timing"}]},{"title":"Boolean Algebra and Simplification","topics":[{"t":"Boolean Operators","e":"Complement, product, and sum represent NOT, AND, and OR. Normal precedence is NOT, then AND, then OR.","x":["In A+B·C, evaluate B·C first.","An overbar applies to the grouped expression beneath it."],"d":"boolean"},{"t":"Identity and Null Laws","e":"A+0=A, A·1=A, A+1=1, and A·0=0.","x":["X·1+0=X.","Y+1=1."],"d":"laws"},{"t":"Complement and Absorption","e":"A+A̅=1, A·A̅=0, A+AB=A, and A(A+B)=A.","x":["A+AB simplifies to A.","A·A̅ is always 0."],"d":"laws"},{"t":"DeMorgan’s Theorems","e":"The complement of a product is the sum of complements. The complement of a sum is the product of complements.","x":["NOT(AB)=A̅+B̅.","NOT(A+B)=A̅B̅."],"d":"demorgan"},{"t":"Expressions and Circuits","e":"Name intermediate gate outputs, then substitute them into the final output expression.","x":["X=B·C and F=A+X gives F=A+B·C.","Use a truth table to verify equivalence."],"d":"circuit"}]},{"title":"Canonical Forms and Karnaugh Maps","topics":[{"t":"Minterms and Canonical SOP","e":"A minterm contains every variable once. Canonical SOP includes the minterms for output-1 rows.","x":["Input 101 gives minterm A·B̅·C=m5.","F=Σm(1,3,5,7)."],"d":"sop"},{"t":"Maxterms and Canonical POS","e":"A maxterm contains every variable once. Canonical POS includes the maxterms for output-0 rows.","x":["Use ΠM(indices) notation.","Minterm and maxterm literal rules are opposite."],"d":"pos"},{"t":"K-map Structure","e":"K-map rows and columns use Gray-code order so adjacent cells differ in only one variable.","x":["A four-variable map has 16 cells.","Opposite edges are adjacent."],"d":"kmap"},{"t":"Grouping and Simplification","e":"Group 1s in powers of two. Keep only variables that remain constant within each group.","x":["Σm(1,3,5,7) simplifies to C.","A group of four eliminates two changing variables."],"d":"group"},{"t":"Don’t-Care Conditions","e":"A don't-care may be treated as 0 or 1 when that creates a simpler result.","x":["Use X to enlarge a group when helpful.","Do not include X when it does not improve the expression."],"d":"dontcare"}]},{"title":"Combinational Circuit Design","topics":[{"t":"Combinational Design Procedure","e":"Define inputs and outputs, build the truth table, derive each output function, simplify, implement, and verify.","x":["n inputs produce 2ⁿ possible input combinations.","Outputs depend on present inputs only."],"d":"design"},{"t":"Half Adder","e":"A half adder adds two bits: Sum=A⊕B and Carry=A·B.","x":["1+1 gives Sum=0, Carry=1.","0+1 gives Sum=1, Carry=0."],"d":"halfadder"},{"t":"Full Adder","e":"A full adder adds A, B, and Cin. Sum=A⊕B⊕Cin and Cout is HIGH when at least two inputs are HIGH.","x":["1+1+1=11₂, so Sum=1,Cout=1.","0+1+1=10₂, so Sum=0,Cout=1."],"d":"fulladder"},{"t":"Subtractors and Adder-Subtractor","e":"A subtractor produces Difference and Borrow. An adder-subtractor uses conditional complementing and two's complement.","x":["0−1 gives Difference=1 and Borrow=1.","Control 0 selects addition and control 1 selects subtraction."],"d":"subtractor"},{"t":"BCD Adder","e":"BCD correction adds 0110 when a four-bit sum is greater than 1001 or produces a decimal carry.","x":["7+5=1100; add 0110 to obtain BCD 0001 0010.","Each decimal digit uses a separate 4-bit code."],"d":"bcd"},{"t":"Decoder and Encoder","e":"A decoder activates one output for an input code. An encoder maps an active input into a code.","x":["A 3-to-8 decoder has eight output lines.","Input 101 selects output 5."],"d":"decoder"},{"t":"Multiplexer","e":"A multiplexer routes one of several data inputs to one output using select lines.","x":["A 4-to-1 MUX needs two select lines.","S1S0=10 selects D2."],"d":"mux"}]}];let li=0,ti=0,$=x=>document.getElementById(x);function init(){L.forEach((l,i)=>lecture.insertAdjacentHTML('beforeend',`<option value="${i}">Lecture ${i+1}: ${l.title}</option>`));lecture.onchange=e=>{li=+e.target.value;ti=0;render();show('explain')};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));render()}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x.dataset.v===id));if(id==='sim')bind()}function svg(t){
const C='viewBox="0 0 800 300" role="img" aria-label="'+t.t+' diagram"';
const axes='<line x1="65" y1="245" x2="750" y2="245" stroke="#789" stroke-width="2"/><line x1="65" y1="35" x2="65" y2="245" stroke="#789" stroke-width="2"/>';
if(t.d==='analog')return `<svg ${C}>${axes}<text x="20" y="35">Amplitude</text><text x="735" y="275">Time</text><path d="M70 135 C130 45 190 225 250 135 S370 45 430 135 S550 225 610 135 S700 45 745 120" fill="none" stroke="#197d91" stroke-width="6"/><text x="170" y="55" font-size="20" fill="#176779">Analog: any value</text><path d="M70 225 H145 V170 H230 V225 H315 V170 H400 V225 H485 V170 H570 V225 H655 V170 H745" fill="none" stroke="#ed625e" stroke-width="6"/><text x="525" y="155" font-size="20" fill="#b83d3a">Digital: defined levels</text></svg>`;
if(t.t==='Advantages of Digital Systems')return `<svg ${C}><text x="400" y="28" text-anchor="middle" font-size="21">Noise margin preserves a valid logic state</text><rect x="60" y="65" width="300" height="165" rx="14" fill="#eef9f8" stroke="#197d91" stroke-width="3"/><path d="M85 195 H125 V105 H175 V115 H225 V98 H275 V110 H330" fill="none" stroke="#197d91" stroke-width="6"/><line x1="85" y1="145" x2="330" y2="145" stroke="#ed625e" stroke-dasharray="7 5"/><text x="208" y="255" text-anchor="middle">Small noise, still interpreted as HIGH</text><rect x="440" y="65" width="300" height="165" rx="14" fill="#f1effc" stroke="#6555ad" stroke-width="3"/><text x="590" y="110" text-anchor="middle" font-size="20">Stored word</text><text x="590" y="155" text-anchor="middle" font-size="34">101101₂</text><path d="M490 185 H690" stroke="#6555ad" stroke-width="5"/><text x="590" y="215" text-anchor="middle">Repeatable copy and processing</text></svg>`;
if(t.d==='hybrid')return flow(['Physical quantity','Sensor','ADC','Processor','DAC / actuator']);
if(t.d==='sampling')return `<svg ${C}>${axes}<path d="M70 150 C125 50 180 245 235 145 S345 50 400 145 S510 245 565 145 S675 50 745 145" fill="none" stroke="#197d91" stroke-width="5"/>${[95,175,255,335,415,495,575,655,735].map((x,i)=>{let y=[108,205,110,82,170,218,120,72,140][i];return `<line x1="${x}" y1="245" x2="${x}" y2="${y}" stroke="#ed625e" stroke-width="3"/><circle cx="${x}" cy="${y}" r="7" fill="#ed625e"/>`}).join('')}<text x="410" y="25" text-anchor="middle" font-size="21">Sampling instants and measured amplitudes</text></svg>`;
if(t.d==='quant')return `<svg ${C}>${axes}<path d="M75 225 H160 V195 H245 V165 H330 V135 H415 V105 H500 V75 H585 V45 H745" fill="none" stroke="#6555ad" stroke-width="7"/>${[['000',115,220],['001',200,190],['010',285,160],['011',370,130],['100',455,100],['101',540,70],['110',625,40]].map(a=>`<text x="${a[1]}" y="${a[2]}" font-size="16">${a[0]}</text>`).join('')}<text x="410" y="285" text-anchor="middle">Each sampled voltage is assigned to one level and one binary code</text></svg>`;
if(t.d==='dac')return `<svg ${C}><text x="400" y="30" text-anchor="middle" font-size="21">DAC: binary word to analog level</text><g font-size="22" text-anchor="middle"><rect x="55" y="105" width="145" height="75" rx="12" fill="#eef9f8" stroke="#197d91"/><text x="128" y="150">101₂</text><path d="M200 143 H280" stroke="#ed625e" stroke-width="5"/><rect x="280" y="85" width="190" height="115" rx="15" fill="#f1effc" stroke="#6555ad" stroke-width="3"/><text x="375" y="135">DAC</text><text x="375" y="170" font-size="16">weighted conversion</text><path d="M470 143 H550" stroke="#ed625e" stroke-width="5"/><line x1="550" y1="220" x2="550" y2="85" stroke="#197d91" stroke-width="5"/><line x1="550" y1="96" x2="710" y2="96" stroke="#197d91" stroke-width="5"/><text x="630" y="75" font-size="18">3.57 V level</text></g></svg>`;
if(t.d==='levels')return `<svg ${C}>${axes}<rect x="85" y="170" width="205" height="75" fill="#dff4f5"/><rect x="290" y="95" width="220" height="150" fill="#fff0ef"/><rect x="510" y="45" width="215" height="200" fill="#e8e4fb"/><text x="188" y="210" text-anchor="middle" font-size="21">Valid LOW → 0</text><text x="400" y="145" text-anchor="middle" font-size="19">Undefined region</text><text x="617" y="90" text-anchor="middle" font-size="21">Valid HIGH → 1</text><text x="390" y="280" text-anchor="middle">Input voltage ranges, not single exact voltages</text></svg>`;
if(t.d==='pulse')return `<svg ${C}>${axes}<path d="M75 220 H180 V70 H540 V220 H730" fill="none" stroke="#197d91" stroke-width="7"/><path d="M180 220 L205 125 L230 70" fill="none" stroke="#ed625e" stroke-width="5"/><path d="M540 70 L565 155 L590 220" fill="none" stroke="#6555ad" stroke-width="5"/><text x="210" y="55" text-anchor="middle">rising edge</text><text x="565" y="55" text-anchor="middle">falling edge</text><line x1="205" y1="260" x2="230" y2="260" stroke="#ed625e" stroke-width="3"/><text x="217" y="285" text-anchor="middle">rise time</text></svg>`;
if(t.d==='frequency')return `<svg ${C}>${axes}<path d="M75 220 H150 V75 H300 V220 H390 V75 H540 V220 H630 V75 H745" fill="none" stroke="#197d91" stroke-width="7"/><line x1="150" y1="45" x2="390" y2="45" stroke="#ed625e" stroke-width="3"/><path d="M150 35 V55 M390 35 V55" stroke="#ed625e" stroke-width="3"/><text x="270" y="30" text-anchor="middle" font-size="20">One period T</text><text x="575" y="285" text-anchor="middle" font-size="20">f = 1/T</text></svg>`;
if(t.d==='duty')return `<svg ${C}>${axes}<path d="M75 220 H160 V75 H350 V220 H540 V75 H730" fill="none" stroke="#197d91" stroke-width="7"/><rect x="160" y="75" width="190" height="145" fill="#dff4f5" opacity=".65"/><rect x="350" y="75" width="190" height="145" fill="#fff0ef" opacity=".55"/><line x1="160" y1="45" x2="350" y2="45" stroke="#197d91" stroke-width="3"/><text x="255" y="30" text-anchor="middle">HIGH time</text><line x1="160" y1="260" x2="540" y2="260" stroke="#6555ad" stroke-width="3"/><text x="350" y="287" text-anchor="middle">Period T; duty = HIGH/T × 100%</text></svg>`;
if(t.d==='timing')return `<svg ${C}><g font-size="17"><text x="25" y="65">A</text><text x="25" y="130">B</text><text x="25" y="205">A·B</text></g><path d="M70 80 H150 V40 H280 V80 H410 V40 H560 V80 H745" fill="none" stroke="#197d91" stroke-width="5"/><path d="M70 145 H220 V105 H350 V145 H500 V105 H650 V145 H745" fill="none" stroke="#6555ad" stroke-width="5"/><path d="M70 220 H220 V180 H280 V220 H500 V180 H560 V220 H745" fill="none" stroke="#ed625e" stroke-width="5"/>${[70,150,220,280,350,410,500,560,650,745].map(x=>`<line x1="${x}" y1="25" x2="${x}" y2="235" stroke="#bbb" stroke-dasharray="4 5"/>`).join('')}<text x="400" y="275" text-anchor="middle">Evaluate the output in every interval between input transitions</text></svg>`;
if(t.d==='transfer')return `<svg ${C}><text x="25" y="55" font-size="20">Serial</text><line x1="130" y1="48" x2="735" y2="48" stroke="#197d91" stroke-width="5"/>${['1','0','1','1','0','0','1','0'].map((b,i)=>`<rect x="${145+i*68}" y="22" width="45" height="52" rx="6" fill="${b==='1'?'#ded8ff':'#eef9f8'}" stroke="#6555ad"/><text x="${168+i*68}" y="55" text-anchor="middle" font-size="20">${b}</text>`).join('')}<text x="25" y="135" font-size="20">Parallel</text>${[0,1,2,3,4,5,6,7].map((n,i)=>`<text x="100" y="${112+i*22}">b${n}</text><line x1="130" y1="${107+i*22}" x2="735" y2="${107+i*22}" stroke="${i%2?'#6555ad':'#197d91'}" stroke-width="3"/>`).join('')}<text x="430" y="292" text-anchor="middle">Serial: one path over time. Parallel: several paths simultaneously.</text></svg>`;
return flow(['Input','Operation','Intermediate','Verification','Output']);
}function flow(a){return `<svg viewBox="0 0 800 180">${a.map((x,i)=>`<rect x="${20+i*155}" y="55" width="125" height="70" rx="12" fill="${i%2?'#f1effc':'#e8f7f5'}" stroke="#197d91"/><text x="${82+i*155}" y="96" text-anchor="middle" font-size="17">${x}</text>${i<4?`<path d="M${145+i*155} ${90} H${175+i*155}" stroke="#ed625e" stroke-width="4"/>`:''}`).join('')}</svg>`}function render(){let l=L[li],t=l.topics[ti];title.textContent=`Lecture ${li+1}: ${l.title}`;topics.innerHTML='<h3>Topics</h3>'+l.topics.map((x,i)=>`<button data-t="${i}" class="${i===ti?'active':''}">${i+1}. ${x.t}</button>`).join('');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ti=+b.dataset.t;render()});explain.innerHTML=`<h2>${t.t}</h2><div class="box explain"><h3>Detailed explanation</h3><p>${t.e}</p></div><div class="diagram-wrap"><button class="replay" id="replayFig" type="button">Replay figure</button><div class="diagram" id="figureBox">${svg(t)}</div><p style="margin:7px 4px 0;color:#47636b;font-size:14px"><b>Figure:</b> ${t.t}</p></div><div class="box example"><h3>Worked examples</h3><ol>${t.x.map(x=>`<li>${x}</li>`).join('')}</ol></div><div class="box note"><b>Important:</b> The diagram and worked examples on this topic are specific to ${t.t}; they are not reused from another topic.</div>`;replayFig.onclick=()=>{const h=figureBox.innerHTML;figureBox.innerHTML='';requestAnimationFrame(()=>figureBox.innerHTML=h)};examples.innerHTML=`<h2>Lecture ${li+1} Worked Examples</h2>`+l.topics.map((x,i)=>`<div class="worked"><h3>${i+1}. ${x.t}</h3>${x.x.map((e,n)=>`<div class="step">Example ${n+1}: ${e}</div>`).join('')}</div>`).join('');sim.innerHTML=simHtml();quiz.innerHTML=quizHtml()}function simHtml(){if(li===0)return `<h2>Lecture 1 Simulator</h2><div class="simgrid"><div class="sim"><h3>ADC Quantizer</h3><input id="adc" type="range" min="0" max="5" step=".01" value="2.5" style="width:100%"><select id="bits"><option>2</option><option selected>3</option><option>4</option><option>5</option></select><div id="ar" class="read"></div></div><div class="sim"><h3>Waveform Calculator</h3><input id="per" type="number" value="20"> μs period <input id="hi" type="number" value="8"> μs HIGH<div id="wr" class="read"></div></div></div>`;if(li===1)return `<h2>Gate Simulator</h2><div class="sim"><select id="gate"><option>AND</option><option>OR</option><option>NAND</option><option>NOR</option><option>XOR</option><option>XNOR</option></select><label class="switch"><input id="a" type="checkbox">A</label><label class="switch"><input id="b" type="checkbox">B</label><span id="lamp" class="lamp">0</span><div id="gr" class="read"></div></div>`;if(li===3)return `<h2>Interactive K-map</h2><div id="kg" class="kgrid"></div><div id="kr" class="read"></div>`;return `<h2>Lecture ${li+1} Simulator</h2><div class="sim"><label class="switch"><input id="a" type="checkbox">A</label><label class="switch"><input id="b" type="checkbox">B</label><label class="switch"><input id="c" type="checkbox">C / Cin</label><div id="br" class="read"></div></div>`}function bind(){if(li===0){let u=()=>{let v=+adc.value,n=+bits.value,N=2**n,s=5/N,k=Math.min(N-1,Math.floor(v/s));ar.innerHTML=`input=${v.toFixed(2)} V<br>levels=${N}<br>step=${s.toFixed(4)} V<br>code=${k.toString(2).padStart(n,'0')}`},w=()=>wr.innerHTML=`frequency=${(1000/+per.value).toFixed(2)} kHz<br>duty=${(+hi.value/+per.value*100).toFixed(1)}%`;adc.oninput=bits.onchange=u;per.oninput=hi.oninput=w;u();w()}else if(li===1){let u=()=>{let A=+a.checked,B=+b.checked,g=gate.value,y={AND:A&B,OR:A|B,NAND:!(A&B),NOR:!(A|B),XOR:A^B,XNOR:!(A^B)}[g]?1:0;gr.textContent=`${g}(${A},${B})=${y}`;lamp.textContent=y;lamp.classList.toggle('on',!!y)};a.onchange=b.onchange=gate.onchange=u;u()}else if(li===3){let v=Array(16).fill(0),d=()=>{kg.innerHTML=v.map((x,i)=>`<button data-k="${i}" class="${x===1?'one':''}">m${i}<br>${x}</button>`).join('');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let i=+b.dataset.k;v[i]=v[i]===0?1:v[i]===1?'X':0;d()});kr.textContent='Σm('+v.map((x,i)=>x===1?i:null).filter(x=>x!==null).join(',')+')'};d()}else{let u=()=>{let A=+a.checked,B=+b.checked,C=+c.checked;if(li===2)br.textContent=`A+B·C = ${A|(B&C)}; A+AB = ${A|(A&B)}`;else br.textContent=`Sum=${A^B^C}; Cout=${(A&B)|(A&C)|(B&C)}`};a.onchange=b.onchange=c.onchange=u;u()}}function quizHtml(){let t=L[li].topics.slice(0,6);return `<h2>Lecture ${li+1} Quiz</h2>`+t.map((x,i)=>`<div class="worked"><b>${i+1}. Which topic matches this statement?</b><p>${x.e.split('.')[0]}.</p>${t.map((o,j)=>`<label style="display:block"><input type="radio" name="q${i}" value="${j}"> ${o.t}</label>`).join('')}<p id="f${i}"></p></div>`).join('')+`<button id="grade" class="primary">Submit quiz</button><p id="score"></p>`}function gradeQuiz(){let t=L[li].topics.slice(0,6),n=0;t.forEach((x,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`),ok=a&&+a.value===i;if(ok)n++;$('f'+i).textContent=ok?'Correct.':'Correct answer: '+x.t});score.innerHTML=`<b>Score: ${n}/${t.length}</b>`}document.addEventListener('click',e=>{if(e.target.id==='grade')gradeQuiz()});function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x.dataset.v===id));if(id==='sim')bind()}function init(){L.forEach((l,i)=>lecture.insertAdjacentHTML('beforeend',`<option value="${i}">Lecture ${i+1}: ${l.title}</option>`));lecture.onchange=e=>{li=+e.target.value;ti=0;render();show('explain')};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));render()}init();</script></body></html>
