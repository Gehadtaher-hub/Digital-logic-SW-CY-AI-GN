<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Logic Lectures</title><style>:root{--n:#123b56;--t:#197d91;--v:#6555ad;--g:#f0b23b;--r:#ed625e;--line:#c8e1df}*{box-sizing:border-box}body{margin:0;font:16px/1.6 Segoe UI,Arial;color:#17343d;background:linear-gradient(135deg,#fff8e6,#edf9f7,#efecfb)}header{position:sticky;top:0;z-index:100;background:linear-gradient(100deg,var(--n),var(--t),var(--v));padding:14px 20px;color:white;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:4px solid var(--g)}.headlinks{display:flex;gap:9px;flex-wrap:wrap}.headlinks a{display:inline-block;background:white;color:var(--n);padding:9px 13px;border-radius:9px;text-decoration:none;font-weight:800;white-space:nowrap}main{max-width:1200px;scroll-margin-top:90px;margin:auto;padding:16px}.hero,.panel,.topics{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 24px #123b5615}.hero h1{margin:0}.controls,.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}button,select,.link{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:white;color:var(--n);font-weight:800;cursor:pointer;text-decoration:none}button.active,.topics button.active,.primary{color:white!important;background:linear-gradient(100deg,var(--t),var(--v))!important}.view.active{display:block;background:white;color:#17343d}.layout{display:grid;grid-template-columns:290px 1fr;gap:14px}.topics{max-height:75vh;overflow:auto}.topics button{width:100%;display:block;text-align:left;margin:6px 0}.view{display:none}.view.active{display:block;background:white;color:#17343d}.box{padding:15px;border-radius:11px;margin:12px 0}.explain{background:#edf9f8;border-left:6px solid var(--t);color:#17343d}.example{background:#fff7dd;border-left:6px solid var(--g);color:#17343d}.note{background:#fff0ef;border-left:6px solid var(--r);color:#17343d}.diagram </style></head><body><header><b>Digital Logic: Lectures 1–5</b><div class="headlinks"><a href="index.html">Main Book</a><a href="studio.html">Practice Studio</a><a href="vhdl-gates_2.html">VHDL Lab</a></div></header><main><section class="hero"><h1 id="title"></h1><p>Explanation, worked examples, guided topic activities, and quiz in one responsive page.</p></section><div class="controls"><label><b>Lecture: </b><select id="lecture" aria-label="Select lecture"></select></label><span class="tag" id="lectureStatus">Lecture 1 selected</span></div><nav class="tabs"><button class="active" data-v="explain">Explanation</button><button data-v="sim">Simulator</button><button data-v="presentation">Presentation</button><button data-v="quiz">Quiz</button><a class="link" href="studio.html">Practice Studio</a></nav><h2 id="selectedLectureHeading" style="margin:8px 0 12px"></h2><div class="layout"><aside class="topics" id="topics"></aside><section><div id="explain" class="view active panel"></div><div id="sim" class="view panel"></div><div id="presentation" class="view panel"><div id="presentationFrameWrap" class="presentation-frame"><iframe id="lecturePresentationFrame" src="https://docs.google.com/presentation/d/e/2PACX-1vSS11HTzYWL-zcBM39rliwFBZAvOxX6hvcPU5l0iNsRCH8gkztygaNQGrt6PicroVAfoeVYIOU2w6pG/pubembed?start=false&loop=false&delayms=3000" title="Lecture 1 presentation" loading="lazy" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe></div><p><a id="lecturePresentationOpen" class="primary presentation-open" href="https://docs.google.com/presentation/d/e/2PACX-1vSS11HTzYWL-zcBM39rliwFBZAvOxX6hvcPU5l0iNsRCH8gkztygaNQGrt6PicroVAfoeVYIOU2w6pG/pubembed?start=false&loop=false&delayms=3000" target="_blank" rel="noopener noreferrer">Open presentation in a new tab</a></p><p id="presentationMissing" class="observation" hidden></p></div><div id="quiz" class="view panel"></div></section></div></main><script>const L=[{"title":"Digital and Analog Foundations","topics":[{"t":"Digital and Analog Quantities","e":"Analog quantities vary continuously across a range. Digital quantities are represented by discrete states. A digital system still uses physical voltages, but each voltage is interpreted within a permitted LOW or HIGH range.","x":["A microphone voltage varies continuously, so the microphone output is analog.","After conversion, a sample such as 101₂ is digital because the sample uses discrete binary states."],"d":"analog"},{"t":"Advantages of Digital Systems","e":"Digital systems provide repeatable storage, programmable processing, easier error detection, and strong tolerance to small voltage disturbances. Digital does not mean perfectly immune to noise; a disturbance becomes a problem when a signal crosses a logic threshold.","x":["A stored binary word can be copied without gradually changing its numerical value.","A noisy HIGH remains a valid 1 while the voltage stays inside the accepted HIGH range."],"d":"levels"},{"t":"Hybrid Digital System","e":"A hybrid system connects an analog environment to digital processing. A sensor produces an analog signal, an ADC creates binary data, a processor operates on the data, and a DAC or digital actuator creates a physical output.","x":["Digital audio path: microphone → ADC → digital processing → DAC → loudspeaker.","Temperature control path: sensor → ADC → controller → driver → fan."],"d":"hybrid"},{"t":"ADC: Sampling","e":"Sampling measures an analog signal at specific instants. Sampling controls when measurements are taken. Sampling does not yet choose a binary code or a quantization level.","x":["At times 0, 1, 2, and 3 ms, the ADC records four instantaneous voltage samples.","Increasing the sampling rate creates more measurements per second."],"d":"sampling"},{"t":"ADC: Quantization and Encoding","e":"Quantization assigns each sample to one of a finite number of levels. Encoding converts the selected level number into a binary word. An n-bit ADC provides 2ⁿ possible codes.","x":["A 3-bit ADC has 2³=8 codes: 000 through 111.","For a 0–5 V range using 8 equal intervals, the nominal step is 5/8=0.625 V."],"d":"quant"},{"t":"DAC Operation","e":"A DAC converts a binary input into a proportional analog voltage or current. More input bits provide more possible output steps and therefore finer resolution.","x":["For a 3-bit DAC, code 101₂ represents decimal 5.","With an ideal 0–5 V scale based on 7 full-scale intervals, output=5×5/7≈3.57 V."],"d":"dac"},{"t":"Binary Digits and Logic Levels","e":"A bit is a binary digit with value 0 or 1. In positive logic, LOW represents 0 and HIGH represents 1. Real devices define ranges for valid LOW and HIGH voltages, with an undefined region between them.","x":["A voltage inside the valid LOW range is interpreted as 0.","A voltage inside the valid HIGH range is interpreted as 1."],"d":"levels"},{"t":"Digital Pulses and Edges","e":"A positive-going pulse begins with a rising edge and ends with a falling edge. Real transitions require time. Rise time is commonly measured from 10% to 90% of amplitude, and fall time from 90% to 10%.","x":["LOW→HIGH is a rising edge.","HIGH→LOW is a falling edge."],"d":"pulse"},{"t":"Period and Frequency","e":"The period T is the duration of one complete cycle. Frequency f is the number of cycles per second. The quantities are reciprocal: f=1/T and T=1/f. Convert the period to seconds before calculating frequency in hertz.","x":["T=2 ms=0.002 s, so f=1/0.002=500 Hz.","f=1 MHz, so T=1 μs."],"d":"frequency"},{"t":"Pulse Width and Duty Cycle","e":"Pulse width is the time a pulse remains active. Duty cycle is the active time as a percentage of the complete period: duty=(HIGH time/T)×100%.","x":["HIGH time=5 ms and T=20 ms gives duty=25%.","A 50% duty cycle has equal HIGH and LOW durations."],"d":"duty"},{"t":"Timing Diagrams","e":"A timing diagram shows several digital signals on one time axis. To find an output waveform, divide the time axis at every input transition and evaluate the circuit separately within each interval.","x":["For an inverter, output is LOW during every interval in which input is HIGH.","For AND, output is HIGH only during intervals where all inputs are HIGH."],"d":"timing"},{"t":"Serial and Parallel Data Transfer","e":"Serial transfer sends bits sequentially over one or a small number of paths. Parallel transfer sends several bits simultaneously using several paths. Serial reduces wiring, while parallel can move a short word in one transfer interval.","x":["Eight serial bits at 2 μs per bit require 16 μs.","An 8-bit parallel transfer uses eight data paths for one simultaneous word."],"d":"transfer"}]},{"title":"Logic Gates and Boolean Functions","topics":[{"t":"The Inverter","e":"The NOT gate produces the complement of its input. A bubble on a logic symbol indicates inversion or an active-LOW terminal.","x":["NOT 1=0.","The 1's complement of 1010 is 0101."],"d":"not"},{"t":"AND Gate","e":"AND is HIGH only when every input is HIGH. Its Boolean expression is Y=A·B.","x":["A=1,B=1 gives Y=1.","Any input 0 forces Y=0."],"d":"and"},{"t":"OR Gate","e":"OR is HIGH when at least one input is HIGH. Its Boolean expression is Y=A+B.","x":["A=0,B=1 gives Y=1.","Only 00 gives Y=0."],"d":"or"},{"t":"NAND and NOR","e":"NAND complements AND. NOR complements OR. Both are universal gates.","x":["NAND(1,1)=0.","NOR(0,0)=1."],"d":"nand"},{"t":"XOR and XNOR","e":"XOR is HIGH when inputs differ. XNOR is HIGH when inputs are equal.","x":["XOR(1,0)=1.","XNOR(1,1)=1."],"d":"xor"},{"t":"Gate Timing Analysis","e":"Mark every input transition, create time intervals, and evaluate the gate in each interval.","x":["An AND waveform is HIGH only where both input waveforms overlap HIGH.","An inverter output changes after each input transition."],"d":"timing"}]},{"title":"Boolean Algebra and Simplification","topics":[{"t":"Boolean Operators","e":"Complement, product, and sum represent NOT, AND, and OR. Normal precedence is NOT, then AND, then OR.","x":["In A+B·C, evaluate B·C first.","An overbar applies to the grouped expression beneath it."],"d":"boolean"},{"t":"Identity and Null Laws","e":"A+0=A, A·1=A, A+1=1, and A·0=0.","x":["X·1+0=X.","Y+1=1."],"d":"laws"},{"t":"Complement and Absorption","e":"A+A̅=1, A·A̅=0, A+AB=A, and A(A+B)=A.","x":["A+AB simplifies to A.","A·A̅ is always 0."],"d":"laws"},{"t":"DeMorgan’s Theorems","e":"The complement of a product is the sum of complements. The complement of a sum is the product of complements.","x":["NOT(AB)=A̅+B̅.","NOT(A+B)=A̅B̅."],"d":"demorgan"},{"t":"Expressions and Circuits","e":"Name intermediate gate outputs, then substitute them into the final output expression.","x":["X=B·C and F=A+X gives F=A+B·C.","Use a truth table to verify equivalence."],"d":"circuit"}]},{"title":"Canonical Forms and Karnaugh Maps","topics":[{"t":"Minterms and Canonical SOP","e":"A minterm contains every variable once. Canonical SOP includes the minterms for output-1 rows.","x":["Input 101 gives minterm A·B̅·C=m5.","F=Σm(1,3,5,7)."],"d":"sop"},{"t":"Maxterms and Canonical POS","e":"A maxterm contains every variable once. Canonical POS includes the maxterms for output-0 rows.","x":["Use ΠM(indices) notation.","Minterm and maxterm literal rules are opposite."],"d":"pos"},{"t":"K-map Structure","e":"K-map rows and columns use Gray-code order so adjacent cells differ in only one variable.","x":["A four-variable map has 16 cells.","Opposite edges are adjacent."],"d":"kmap"},{"t":"Grouping and Simplification","e":"Group 1s in powers of two. Keep only variables that remain constant within each group.","x":["Σm(1,3,5,7) simplifies to C.","A group of four eliminates two changing variables."],"d":"group"},{"t":"Don’t-Care Conditions","e":"A don't-care may be treated as 0 or 1 when that creates a simpler result.","x":["Use X to enlarge a group when helpful.","Do not include X when it does not improve the expression."],"d":"dontcare"}]},{"title":"Combinational Circuit Design","topics":[{"t":"Combinational Design Procedure","e":"Define inputs and outputs, build the truth table, derive each output function, simplify, implement, and verify.","x":["n inputs produce 2ⁿ possible input combinations.","Outputs depend on present inputs only."],"d":"design"},{"t":"Half Adder","e":"A half adder adds two bits: Sum=A⊕B and Carry=A·B.","x":["1+1 gives Sum=0, Carry=1.","0+1 gives Sum=1, Carry=0."],"d":"halfadder"},{"t":"Full Adder","e":"A full adder adds A, B, and Cin. Sum=A⊕B⊕Cin and Cout is HIGH when at least two inputs are HIGH.","x":["1+1+1=11₂, so Sum=1,Cout=1.","0+1+1=10₂, so Sum=0,Cout=1."],"d":"fulladder"},{"t":"Subtractors and Adder-Subtractor","e":"A subtractor produces Difference and Borrow. An adder-subtractor uses conditional complementing and two's complement.","x":["0−1 gives Difference=1 and Borrow=1.","Control 0 selects addition and control 1 selects subtraction."],"d":"subtractor"},{"t":"BCD Adder","e":"BCD correction adds 0110 when a four-bit sum is greater than 1001 or produces a decimal carry.","x":["7+5=1100; add 0110 to obtain BCD 0001 0010.","Each decimal digit uses a separate 4-bit code."],"d":"bcd"},{"t":"Decoder and Encoder","e":"A decoder activates one output for an input code. An encoder maps an active input into a code.","x":["A 3-to-8 decoder has eight output lines.","Input 101 selects output 5."],"d":"decoder"},{"t":"Multiplexer","e":"A multiplexer routes one of several data inputs to one output using select lines.","x":["A 4-to-1 MUX needs two select lines.","S1S0=10 selects D2."],"d":"mux"}]}];let li=0,ti=0,$=x=>document.getElementById(x);function init(){L.forEach((l,i)=>lecture.insertAdjacentHTML('beforeend',`<option value="${i}">Lecture ${i+1}: ${l.title}</option>`));lecture.onchange=e=>{li=+e.target.value;ti=0;lectureStatus.textContent='Lecture '+(li+1)+' selected';render();show('explain');document.querySelector('main').scrollIntoView({behavior:'smooth',block:'start'})};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));render()}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x.dataset.v===id));if(id==='sim')bind()}function svg(t){
if(li===1)return gateSvg(t);
if(li===2)return booleanSvg(t);
if(li===3)return kmapSvg(t);
if(li===4)return combinationalSvg(t);
const C='viewBox="0 0 800 300" role="img" aria-label="'+t.t+' diagram"';
const axes='<line x1="65" y1="245" x2="750" y2="245" stroke="#789" stroke-width="2"/><line x1="65" y1="35" x2="65" y2="245" stroke="#789" stroke-width="2"/>';
if(t.d==='analog')return `<svg ${C}>${axes}<text x="20" y="35">Amplitude</text><text x="735" y="275">Time</text><path d="M70 135 C130 45 190 225 250 135 S370 45 430 135 S550 225 610 135 S700 45 745 120" fill="none" stroke="#197d91" stroke-width="6"/><text x="170" y="55" font-size="20" fill="#176779">Analog: any value</text><path d="M70 225 H145 V170 H230 V225 H315 V170 H400 V225 H485 V170 H570 V225 H655 V170 H745" fill="none" stroke="#ed625e" stroke-width="6"/><text x="525" y="155" font-size="20" fill="#b83d3a">Digital: defined levels</text></svg>`;

        ${guides}
        <path class="clock-wave" d="M70 68 H110 V28 H150 V68 H190 V28 H230 V68 H270 V28 H310 V68 H350 V28 H390 V68 H430 V28 H470 V68 H510 V28 H550 V68 H590 V28 H630 V68 H670 V28 H710 V68 H750" fill="none" stroke="#123b56" stroke-width="4"/>
        <path d="M70 132 H150 V92 H310 V132 H470 V92 H630 V132 H750" fill="none" stroke="#197d91" stroke-width="5"/>
        <path d="M70 196 H230 V156 H390 V196 H550 V156 H710 V196 H750" fill="none" stroke="#6555ad" stroke-width="5"/>

      </svg>`;
    }

    if (t.d === 'transfer') {
      const bits=['1','0','1','1','0','0','1','0'];
      const serial=bits.map((b,i)=>`<g class="serial-bit" style="animation-delay:${i*.38}s"><rect x="${135+i*72}" y="54" width="50" height="54" rx="7" fill="${b==='1'?'#ded8ff':'#eef9f8'}" stroke="#6555ad" stroke-width="2"/><text x="${160+i*72}" y="88" text-anchor="middle" font-size="20">${b}</text><text x="${160+i*72}" y="125" text-anchor="middle" font-size="12">t${i+1}</text></g>`).join('');
      const parallel=bits.map((b,i)=>`<g class="parallel-bit"><text x="72" y="${177+i*16}" font-size="13">b${7-i}=${b}</text><line x1="120" y1="${173+i*16}" x2="665" y2="${173+i*16}" stroke="${b==='1'?'#6555ad':'#197d91'}" stroke-width="3"/><circle cx="690" cy="${173+i*16}" r="7" fill="${b==='1'?'#6555ad':'#197d91'}"/></g>`).join('');
      return `<svg ${C}>
        <text x="25" y="34" font-size="20" font-weight="700">Serial: one wire, one bit in each time slot</text>
        <line x1="115" y1="81" x2="735" y2="81" stroke="#b9cacc" stroke-width="5"/>
        ${serial}
        <path class="serial-runner" d="M115 81 H735" fill="none" stroke="#ed625e" stroke-width="8" stroke-linecap="round"/>
        <text x="25" y="151" font-size="20" font-weight="700">Parallel: eight wires, all bits in the same time slot</text>
        ${parallel}
        <line x1="715" y1="163" x2="715" y2="292" stroke="#ed625e" stroke-width="4"/>
        <text x="741" y="227" text-anchor="middle" font-size="13" transform="rotate(90 741 227)">same transfer instant</text>
        <text x="400" y="313" text-anchor="middle" font-size="15">Serial needs 8 time slots; parallel transfers the 8-bit word simultaneously.</text>
      </svg>`;
    }

    return originalSvg(t);
  };

  /* Re-render the currently selected topic so the correction appears immediately. */
  if (typeof window.render === 'function') window.render();
})();

   const mobile=document.createElement('select');mobile.className='topic-mobile';mobile.setAttribute('aria-label','Select Lecture 3 topic');mobile.innerHTML=T.map((x,i)=>`<option value="${i}" ${i===ti?'selected':''}>${x.t}</option>`).join('');mobile.onchange=e=>{ti=+e.target.value;window.render()};topics.prepend(mobile);
   const box=explain.querySelector('.box.explain');
   if(box) box.outerHTML=`<div class="box explain rich-explanation"><p class="topic-objective">Learning objective: ${t.obj}</p><div class="lesson-roadmap"><span>1. Understand</span><span>2. Apply the law</span><span>3. Follow worked steps</span><span>4. Check equivalence</span></div><h3>Detailed explanation</h3><p>${t.e}</p><h3>Key rules and laws</h3>${t.laws.map(a=>`<div class="law-card"><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}<h3>Worked example, step by step</h3><ol class="worked-steps">${t.steps.map(x=>`<li>${x}</li>`).join('')}</ol><div class="topic-example"><b>Additional examples</b><ul>${t.x.map(x=>`<li>${x}</li>`).join('')}</ul></div><h3>Common mistake</h3><div class="mistake-box">${t.mistake}</div><h3>Knowledge check</h3><div class="check-box">${t.check}</div></div>`;
 };
 window.render();
})();

<script id="precedence-v2-script">
(()=>{
 const old=window.render;
 function markup(){return `<div class="precedence-v2" data-step="0"><div class="pv2-title">Evaluate A + B·C in the correct order</div><div class="pv2-sub">The circuit now follows the expression from inputs to output.</div><div class="pv2-equation">F = A + (B·C)</div><div class="pv2-stage"><div class="pv2-chip pv2-a">A = 1</div><div class="pv2-chip pv2-b">B = 1</div><div class="pv2-chip pv2-c">C = 0</div><div class="pv2-gate pv2-and">AND<br>B·C</div><div class="pv2-gate pv2-or">OR</div><div class="pv2-out">F = 1</div><i class="pv2-wire w-a"></i><i class="pv2-wire w-b"></i><i class="pv2-wire w-c"></i><i class="pv2-wire w-and"></i><i class="pv2-wire w-out"></i><div class="pv2-step">Predict the output, then press Start.</div></div><div class="pv2-progress"><i class="pv2-dot"></i><i class="pv2-dot"></i><i class="pv2-dot"></i></div><div class="pv2-controls"><button class="pv2-start primary">Start explanation</button><button class="pv2-next">Next step</button><button class="pv2-reset">Reset</button></div><div class="pv2-table"><span class="head">A</span><span class="head">B</span><span class="head">C</span><span class="head">F</span><span>0</span><span>0</span><span>0</span><span>0</span><span>0</span><span>1</span><span>0</span><span>0</span><span>1</span><span>0</span><span>0</span><span>1</span><span class="hot">1</span><span class="hot">1</span><span class="hot">0</span><span class="hot">1</span></div></div>`}
 function bind(){const root=document.querySelector('.precedence-v2');if(!root)return;let step=0,timer;const texts=['Predict the output, then press Start.','Step 1: AND first. B·C = 1·0 = 0.','Step 2: OR second. A + (B·C) = 1 + 0.','Step 3: Final output F = 1. The highlighted truth-table row confirms it.'];const show=n=>{step=n;root.dataset.step=n;root.querySelector('.pv2-step').textContent=texts[n];root.querySelectorAll('.pv2-dot').forEach((d,i)=>d.classList.toggle('on',i<n));};const auto=()=>{clearInterval(timer);show(1);timer=setInterval(()=>{if(step<3)show(step+1);else clearInterval(timer)},1500)};root.querySelector('.pv2-start').onclick=auto;root.querySelector('.pv2-next').onclick=()=>{clearInterval(timer);show(step===3?1:step+1)};root.querySelector('.pv2-reset').onclick=()=>{clearInterval(timer);show(0)};}
 window.render=function(){old();if(li===2&&ti===1){const d=explain.querySelector('.diagram');if(d){d.innerHTML=markup();bind()}const c=[...explain.querySelectorAll('.box')].find(x=>x.textContent.includes('How this figure connects'));if(c)c.innerHTML='<b>How this figure connects to the explanation:</b> The redesigned animation uses actual AND and OR stages, pauses between operations, and highlights the matching truth-table row.';}};
 window.render();
})();
</script>

<style id="lecture3-navigation-fix-style">

#explain{transition:opacity .16s ease,transform .16s ease}

<script id="lecture3-navigation-fix-script">
(() => {
  let changing=false;
  function resetTopicState(index){
    if(changing || li!==2 || !Number.isInteger(index) || !L[2].topics[index]) return;
    changing=true;
    const panel=document.getElementById('explain');
    panel?.classList.add('topic-changing');
    document.querySelectorAll('.dynamic-solution.open').forEach(x=>x.classList.remove('open'));
    document.querySelectorAll('.precedence-v2').forEach(x=>x.dataset.step='0');
    ti=index;
    window.render();
    requestAnimationFrame(()=>{
      panel?.classList.remove('topic-changing');
      const heading=panel?.querySelector('h2');
      if(heading) heading.scrollIntoView({behavior:'smooth',block:'start'});
      changing=false;
    });
  }
  document.addEventListener('click',e=>{
    const button=e.target.closest('[data-l3t]');
    if(!button || li!==2) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    resetTopicState(Number(button.dataset.l3t));
  },true);
  document.addEventListener('change',e=>{
    if(li!==2 || !e.target.matches('.topic-mobile')) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    resetTopicState(Number(e.target.value));
  },true);
})();
</script>

isplay:block}.l3-actions{display:flex;gap:8px;flex-wrap:wrap}.l3-next{background:#123b56;color:#fff}.l3-nav-bottom{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.l3-muted{color:#577179;font-size:14px}@media(max-width:760px){.l3-table{min-width:100%;font-size:13px}.l3-nav-bottom{flex-direction:column}.l3-gate-card svg{min-width:540px}}

<script id="l3-clean-script">
(()=>{
const topics=[
{title:'Boolean Variables, Constants, and Basic Operators',objective:'Interpret 0 and 1, complements, products, and sums as physical logic signals and gates.',explain:'A Boolean variable has only two possible values: 0 and 1. In a digital circuit these represent LOW and HIGH logic levels. NOT reverses one input, AND produces 1 only when every input is 1, and OR produces 1 when at least one input is 1.',rules:[['NOT','A̅: reverse A'],['AND','A·B: both must be 1'],['OR','A+B: at least one is 1']],gate:'basic',table:'basic',steps:['Let A=1 and B=0.','NOT A gives A̅=0.','AND gives A·B=1·0=0.','OR gives A+B=1+0=1.'],warn:'The Boolean + symbol means OR. It is not ordinary arithmetic addition.',practice:['Evaluate A̅ + A·B for A=0, B=1.','A̅=1; A·B=0; therefore F=1+0=1.']},
{title:'Operator Precedence and Parentheses',objective:'Evaluate Boolean expressions in the correct order and build the matching gate sequence.',explain:'Boolean expressions follow a fixed precedence: NOT first, AND second, OR last. Parentheses override this order. Therefore A+B·C uses an AND gate before an OR gate, while (A+B)·C uses an OR gate before an AND gate.',rules:[['Default order','NOT → AND → OR'],['Parentheses','Evaluate the inner group first'],['Circuit rule','The first operation becomes the first gate stage']],gate:'precedence',table:'precedence',steps:['Use A=1, B=1, C=0.','Calculate B·C first: 1·0=0.','Calculate A+(B·C): 1+0=1.','The output is F=1.'],warn:'A+B·C and (A+B)·C are different functions and require different circuits.',practice:['Evaluate (A+B)·C for A=0, B=1, C=1.','A+B=1; then 1·C=1. Final output F=1.']},
{title:'Identity, Null, Idempotent, and Involution Laws',objective:'Remove constants, repeated literals, and double complements from an expression.',explain:'These four law families are the basic cleanup tools of Boolean algebra. Identity leaves a value unchanged, null forces an output, idempotent removes repetition, and involution removes two consecutive complements.',rules:[['Identity','A+0=A; A·1=A'],['Null','A+1=1; A·0=0'],['Idempotent','A+A=A; A·A=A'],['Involution','(A̅)̅=A']],gate:'laws',table:'identity',steps:['Start with F=(A+A)·1+0.','Use idempotent: A+A=A.','Use identity: A·1=A.','Use identity again: A+0=A.'],warn:'OR with 1 forces the output to 1. AND with 0 forces the output to 0.',practice:['Simplify X·1 + X·0.','X·1=X and X·0=0, so X+0=X.']},
{title:'Complement Laws',objective:'Recognize a signal and its inverse and predict the resulting output.',explain:'A signal and its complement can never both be 1, so A·A̅=0. One of them must always be 1, so A+A̅=1. The gate diagram makes these two results visible.',rules:[['Complement OR','A+A̅=1'],['Complement AND','A·A̅=0'],['Constants','0̅=1; 1̅=0']],gate:'complement',table:'complement',steps:['Take any value of A.','Generate A̅ using a NOT gate.','OR receives A and A̅, so one input is always 1.','Therefore A+A̅ is always 1.'],warn:'Do not swap the results: complement OR gives 1, while complement AND gives 0.',practice:['Simplify F=A·A̅+B.','A·A̅=0, then 0+B=B.']},
{title:'Commutative and Associative Laws',objective:'Reorder and regroup terms without changing the logic function.',explain:'Commutative laws allow inputs to exchange positions. Associative laws allow grouping to change when the operator remains the same. Gate inputs are therefore interchangeable for AND and OR, and cascaded gates of the same type can be regrouped.',rules:[['Commutative OR','A+B=B+A'],['Commutative AND','AB=BA'],['Associative OR','A+(B+C)=(A+B)+C'],['Associative AND','A(BC)=(AB)C']],gate:'commutative',table:'commutative',steps:['Start with F=C+A+B.','Reorder to A+B+C using commutative law.','Regroup as A+(B+C) using associative law.','The truth table output remains unchanged.'],warn:'Associative regrouping is safe only when the same operator is used throughout the group.',practice:['Rewrite (Y·X)·Z in alphabetical order.','Use commutative and associative laws: X·Y·Z.']},
{title:'Distributive Laws: Expanding and Factoring',objective:'Convert between factored and expanded Boolean expressions using equivalent gate networks.',explain:'Distributive laws connect two-level gate networks. A(B+C) uses an OR gate followed by an AND gate. AB+AC uses two AND gates followed by an OR gate. Both networks produce the same output for every input combination.',rules:[['AND over OR','A(B+C)=AB+AC'],['OR over AND','A+BC=(A+B)(A+C)'],['Use','Expand to expose terms; factor to reduce repeated literals']],gate:'distributive',table:'distributive',steps:['Start with AB+AC.','Both terms contain A.','Factor A from both product terms.','Result: A(B+C).'],warn:'Boolean algebra has two distributive forms. The second form, A+BC=(A+B)(A+C), differs from ordinary algebra.',practice:['Factor XY+XZ.','Both terms contain X, so XY+XZ=X(Y+Z).']},
{title:'Absorption and Redundancy',objective:'Remove terms that cannot change the output of a Boolean function.',explain:'Absorption removes a more restrictive term when a simpler term already covers every case in which the restrictive term could be 1. In A+AB, whenever AB=1, A is already 1, so AB adds no new output condition.',rules:[['OR absorption','A+AB=A'],['AND absorption','A(A+B)=A'],['Extended form','A+A̅B=A+B']],gate:'absorption',table:'absorption',steps:['Start with F=A+AB.','Factor A: F=A(1+B).','Use the null law: 1+B=1.','Use identity: A·1=A.'],warn:'Absorption is not ordinary cancellation. The complete pattern must match the law.',practice:['Simplify X+XYZ.','Let K=YZ. Then X+XK=X by absorption.']},
{title:'DeMorgan’s Theorems and NAND/NOR Equivalence',objective:'Move a complement across a group and convert AND logic to OR logic or vice versa.',explain:'DeMorgan’s theorems complement every literal and exchange AND with OR. A NAND gate is equivalent to an OR gate with complemented inputs. A NOR gate is equivalent to an AND gate with complemented inputs.',rules:[['NAND form','(AB)̅=A̅+B̅'],['NOR form','(A+B)̅=A̅B̅'],['Procedure','Break the bar, change the operator, complement each literal']],gate:'demorgan',table:'demorgan',steps:['Start with (A+BC)̅.','Complement A and the product BC.','Change the outer OR to AND: A̅·(BC)̅.','Apply DeMorgan again: A̅(B̅+C̅).'],warn:'Changing only the operator is incomplete. Every literal under the original complement bar must also be complemented.',practice:['Transform (X·Y)̅.','Change AND to OR and complement both literals: X̅+Y̅.']},
{title:'Systematic Algebraic Simplification',objective:'Simplify a multi-term expression line by line and name the law used at each step.',explain:'Reliable simplification is a sequence of justified transformations. First remove constants and double complements, then factor common literals, apply complement or absorption laws, and finally verify the result.',rules:[['1','Remove 0, 1, repetition, and double NOT'],['2','Reorder and factor useful terms'],['3','Apply complement and absorption'],['4','Verify with a truth table or equivalent gates']],gate:'simplification',table:'simplification',steps:['F=AB+AB̅+AC.','Factor A from the first two terms: A(B+B̅)+AC.','Use B+B̅=1: A+AC.','Use absorption: F=A.'],warn:'A result is valid only if every line follows a Boolean law and the final function is equivalent.',practice:['Simplify P·Q+P·Q̅.','Factor P: P(Q+Q̅)=P·1=P.']},
{title:'Converting Between Expressions, Gates, and Truth Tables',objective:'Move accurately among the three main representations of a combinational logic function.',explain:'An expression specifies operations, a gate diagram implements those operations, and a truth table lists the output for every input combination. Converting between all three representations is an essential verification skill.',rules:[['Expression → gates','Build complements, product terms, then sum terms'],['Gates → expression','Name each intermediate node'],['Expression → table','Evaluate all 2ⁿ input combinations'],['Equivalence','Final output columns must match on every row']],gate:'conversion',table:'conversion',steps:['Given F=A̅B+AC.','Create A̅ with a NOT gate.','Create products A̅B and AC with two AND gates.','OR the product terms and verify all eight rows.'],warn:'Never skip an output bubble or complement mark when translating a circuit into an expression.',practice:['Describe the circuit for F=AB+C.','Use one AND gate for AB, then an OR gate combining AB with C.']}
];
const val=(x)=>x?1:0;
function rows(n,fn){let h='<table class="l3-table"><thead><tr>';let names=['A','B','C'].slice(0,n);h+=names.map(x=>`<th>${x}</th>`).join('')+'<th>F</th></tr></thead><tbody>';for(let i=0;i<2**n;i++){let bits=names.map((_,j)=>(i>>(n-1-j))&1);h+='<tr>'+bits.map(x=>`<td>${x}</td>`).join('')+`<td><b>${val(fn(...bits))}</b></td></tr>`}return h+'</tbody></table>'}
function truth(type){if(type==='basic')return '<p><b>AND truth table</b></p>'+rows(2,(a,b)=>a&&b)+'<p><b>OR truth table</b></p>'+rows(2,(a,b)=>a||b);if(type==='precedence')return rows(3,(a,b,c)=>a||(b&&c));if(type==='identity')return rows(1,a=>(a&&1)||0);if(type==='complement')return rows(1,a=>a||!a);if(type==='commutative')return rows(2,(a,b)=>a||b);if(type==='distributive')return rows(3,(a,b,c)=>a&&(b||c));if(type==='absorption')return rows(2,(a,b)=>a||(a&&b));if(type==='demorgan')return rows(2,(a,b)=>!(a&&b));if(type==='simplification')return rows(3,(a,b,c)=>(a&&b)||(a&&!b)||(a&&c));return rows(3,(a,b,c)=>(!a&&b)||(a&&c))}
const line=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#197d91" stroke-width="5"/>`;
const txt=(x,y,t)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="18" font-weight="700" fill="#17343d">${t}</text>`;
const and=(x,y,l='AND')=>`<path d="M${x} ${y} h55 a45 45 0 0 1 0 90 h-55z" fill="#dff5f3" stroke="#197d91" stroke-width="4"/>${txt(x+55,y+52,l)}`;
const or=(x,y,l='OR')=>`<path d="M${x} ${y} Q${x+32} ${y+45} ${x} ${y+90} Q${x+62} ${y+90} ${x+105} ${y+45} Q${x+62} ${y} ${x} ${y}z" fill="#fff1cc" stroke="#d59518" stroke-width="4"/>${txt(x+53,y+52,l)}`;
