<script>
const topics=[
{t:'Boolean Variables, Literals, and Expressions',d:'foundations',e:'Boolean algebra uses variables that can have only the values 0 or 1. A literal is a variable, such as A, or its complement, such as A̅. A Boolean expression combines literals with NOT, AND, and OR to describe a digital circuit.',x:['A and B̅ are literals.','F=A+B̅C is a Boolean expression with three variables.','A=1 can represent a switch that is ON.'],q:'How many literals appear in F=A+B̅C?',o:['1','2','3','4'],a:2,f:'The literals are A, B̅, and C.'},
{t:'Boolean Operators and Precedence',d:'precedence',e:'Complement represents NOT, product represents AND, and sum represents OR. Unless parentheses change the order, evaluate NOT first, AND second, and OR last.',x:['In F=A+B·C̅, find C̅ first, then B·C̅, then OR the result with A.','Parentheses in (A+B)·C force the OR operation to occur first.'],q:'Which operation is evaluated first in A+B·C̅?',o:['A+B','B·C','C̅','OR'],a:2,f:'Complement has the highest precedence.'},
{t:'Identity, Null, and Idempotent Laws',d:'identity',e:'Identity laws leave a variable unchanged: A+0=A and A·1=A. Null laws force a constant: A+1=1 and A·0=0. Idempotent laws remove repetition: A+A=A and A·A=A.',x:['X·1+0=X.','Y+1=1.','P+P=P.'],q:'Simplify X·1+0.',o:['0','1','X','X̅'],a:2,f:'X·1=X, then X+0=X.'},
{t:'Complement and Involution Laws',d:'complement',e:'A variable and its complement have opposite values. Therefore A+A̅=1 and A·A̅=0. Double complementation returns the original variable: (A̅)̅=A.',x:['X+X̅=1.','Y·Y̅=0.','(P̅)̅=P.'],q:'Simplify B·B̅.',o:['0','1','B','B̅'],a:0,f:'A variable and its complement cannot both be 1.'},
{t:'Commutative and Associative Laws',d:'rearrangement',e:'Commutative laws change operand order: A+B=B+A and A·B=B·A. Associative laws regroup operations of the same type: (A+B)+C=A+(B+C).',x:['A+B+C may be rearranged as C+A+B.','A·B·C may be grouped as A·(B·C).'],q:'Which law justifies A+B=B+A?',o:['Identity','Commutative','Complement','Absorption'],a:1,f:'The commutative law allows operands to exchange positions.'},
{t:'Distributive Laws',d:'distributive',e:'Distributive laws expand or factor expressions: A·(B+C)=A·B+A·C. The Boolean dual is A+B·C=(A+B)·(A+C). Factoring often exposes a complement pair.',x:['A·B+A·C=A·(B+C).','X·Y+X·Y̅=X·(Y+Y̅)=X.'],q:'Factor A·B+A·C.',o:['A·(B+C)','A+B+C','A·B·C','(A+B)·C'],a:0,f:'A is the common literal.'},
{t:'Absorption Laws',d:'absorption',e:'The absorption laws are A+A·B=A and A·(A+B)=A. The term A already includes every case in which A·B can be 1, so the extra term is redundant.',x:['X+X·Y=X.','P·(P+Q)=P.'],steps:['A+A·B','A·1+A·B','A·(1+B)','A·1','A'],laws:['Original expression','Identity law','Distributive law','Null law','Identity law'],q:'Simplify X+X·Y.',o:['X','Y','X·Y','1'],a:0,f:'X absorbs X·Y.'},
{t:'DeMorgan’s First Theorem',d:'demorgan-product',e:'The complement of a product equals the sum of the complemented literals: (A·B)̅=A̅+B̅. Move the complement to every literal and change AND to OR.',x:['(X·Y·Z)̅=X̅+Y̅+Z̅.','A NAND gate can be viewed as an OR gate with complemented inputs.'],q:'Apply DeMorgan to (X·Y)̅.',o:['X̅·Y̅','X̅+Y̅','X+Y','X·Y'],a:1,f:'Complement every literal and change AND to OR.'},
{t:'DeMorgan’s Second Theorem',d:'demorgan-sum',e:'The complement of a sum equals the product of the complemented literals: (A+B)̅=A̅·B̅. Move the complement inward and change OR to AND.',x:['(X+Y+Z)̅=X̅·Y̅·Z̅.','A NOR gate can be viewed as an AND gate with complemented inputs.'],q:'Apply DeMorgan to (P+Q)̅.',o:['P̅+Q̅','P̅·Q̅','P·Q','P+Q'],a:1,f:'Complement every literal and change OR to AND.'},
{t:'Simplifying Boolean Expressions',d:'simplification',e:'Simplification reduces an expression without changing its output. Factor common literals, apply complement laws, remove constants, and check absorption. Every transformation must be justified by a Boolean law.',x:['A·B+A·B̅=A·(B+B̅)=A.'],steps:['F=A·B+A·B̅','F=A·(B+B̅)','F=A·1','F=A'],laws:['Original expression','Distributive law','Complement law','Identity law'],q:'Simplify A·B+A·B̅.',o:['A','B','A·B','1'],a:0,f:'Factor A, use B+B̅=1, then A·1=A.'},
{t:'Converting Circuits into Expressions',d:'circuit-expression',e:'Start at the inputs and name every intermediate gate output. Continue toward the final output and substitute intermediate expressions. This prevents missing an inversion or grouping signals incorrectly.',x:['If X=B·C and F=A+X, then F=A+B·C.','A bubble at a gate output complements the complete gate result.'],q:'If X=B·C and F=A+X, what is F?',o:['A·B·C','A+B·C','(A+B)·C','A̅+B·C'],a:1,f:'Substitute B·C for X.'},
{t:'Implementing Expressions as Circuits',d:'expression-circuit',e:'Find the operation evaluated last because it becomes the output gate. Then work backward through every product, sum, complement, and parenthesized group.',x:['F=A+B·C uses an AND gate for B·C and a final OR gate.','F=(A+B)̅ can use one NOR gate.'],q:'Which gate is final in F=A+B·C?',o:['NOT','AND','OR','XOR'],a:2,f:'The last operation is OR.'},
{t:'Verifying Equivalence with Truth Tables',d:'equivalence',e:'Two expressions are equivalent only when their outputs match for every possible input combination. Build columns for intermediate expressions and compare the final columns. One mismatch proves non-equivalence.',x:['A+A·B and A match in all four rows.','A three-variable table contains 2³=8 rows.'],q:'When are two Boolean expressions equivalent?',o:['They use the same symbols','They have the same term count','Their outputs match for every input','They both contain AND'],a:2,f:'Every input row must produce matching outputs.'}
];
let current=0;const completed=new Set();const $=id=>document.getElementById(id);const bit=v=>v?1:0;const inv=v=>v?0:1;
function switchView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));if(id==='quiz')renderQuiz()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
function renderNav(){topicButtons.innerHTML=topics.map((t,i)=>`<button class="${i===current?'active':''}" data-topic="${i}">${i+1}. ${t.t}</button>`).join('');mobileTopic.innerHTML=topics.map((t,i)=>`<option value="${i}" ${i===current?'selected':''}>${i+1}. ${t.t}</option>`).join('');document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{current=+b.dataset.topic;renderLesson()});mobileTopic.onchange=e=>{current=+e.target.value;renderLesson()}}
function activity(t){if(t.steps)return `<div class="prediction"><b>Predict:</b> Which law should be used first?</div><div id="steps" class="steps">${t.steps.map((s,i)=>`<div class="step" data-step="${i}"><code>${s}</code><span>${i?'Hidden until revealed':'Starting expression'}</span></div>`).join('')}</div><div class="btnrow"><button class="btn" id="prevStep">Previous</button><button class="btn primary" id="nextStep">Next step</button><button class="btn" id="resetStep">Reset</button></div>`;
if(t.d==='precedence')return `<div class="prediction"><b>Predict:</b> Evaluate A+B·C̅ before pressing Run.</div>${abcControls()}<button class="btn primary" id="runAct">Evaluate step by step</button><div id="actOut" class="output">Choose values and make a prediction.</div>`;
if(['demorgan-product','demorgan-sum'].includes(t.d))return `<div class="prediction"><b>Predict:</b> Will both forms match for this input?</div>${abControls()}<div class="btnrow"><button class="btn primary" id="runAct">Verify input</button><button class="btn" id="allRows">Verify all rows</button></div><div id="actOut" class="output">Choose inputs.</div><div id="miniTable"></div>`;
if(['circuit-expression','expression-circuit'].includes(t.d))return `<div class="prediction"><b>Predict:</b> Identify the first operation and final gate.</div><div class="formula">${t.d==='circuit-expression'?'X=B·C, F=A+X':'F=A+B·C'}</div><div class="btnrow"><button class="btn primary" id="nextCircuit">Reveal next stage</button><button class="btn" id="resetCircuit">Reset</button></div><div id="actOut" class="output">Begin by identifying B·C.</div>`;
if(t.d==='foundations')return `<div class="prediction"><b>Predict:</b> Classify A, B̅, A+B·C, and 0 or 1.</div><div class="btnrow"><button class="btn primary" id="runAct">Reveal classifications</button></div><div id="actOut" class="output">Think before revealing.</div>`;
if(t.d==='equivalence')return `<div class="prediction"><b>Predict:</b> Are A+A·B and A equivalent?</div><button class="btn primary" id="allRows">Build verification table</button><div id="miniTable"></div>`;
return `<div class="prediction"><b>Predict:</b> Do both sides remain equal for the selected values?</div>${abcControls()}<button class="btn primary" id="runAct">Compare both sides</button><div id="actOut" class="output">Choose values, predict, then compare.</div>`}
function abControls(){return `<div class="controls"><label>A<select id="a"><option>0</option><option>1</option></select></label><label>B<select id="b"><option>0</option><option>1</option></select></label></div>`}function abcControls(){return `<div class="controls"><label>A<select id="a"><option>0</option><option>1</option></select></label><label>B<select id="b"><option>0</option><option>1</option></select></label><label>C<select id="c"><option>0</option><option>1</option></select></label></div>`}
function renderLesson(){const t=topics[current];renderNav();lessonPanel.innerHTML=`<h2>${current+1}. ${t.t}</h2><div class="box explain"><h3>Detailed explanation</h3><p>${t.e}</p></div><div class="box example"><h3>Worked examples</h3><ul>${t.x.map(x=>`<li>${x}</li>`).join('')}</ul></div><section><h3>Guided activity</h3>${activity(t)}</section><section class="check"><h3>Knowledge check</h3><p><b>${t.q}</b></p><div class="options">${t.o.map((o,i)=>`<label class="option"><input type="radio" name="kc" value="${i}"> ${o}</label>`).join('')}</div><button class="btn primary" id="checkAnswer">Check answer</button><p id="checkFeedback" class="feedback"></p></section>`;bindActivity(t);checkAnswer.onclick=()=>{const s=document.querySelector('input[name=kc]:checked');if(!s){checkFeedback.textContent='Select an answer first.';return}const ok=+s.value===t.a;checkFeedback.className='feedback '+(ok?'correct':'incorrect');checkFeedback.textContent=(ok?'Correct. ':'Try again. ')+t.f;if(ok){completed.add(current);updateProgress()}}}
function vals(){return {A:+($('a')?.value||0),B:+($('b')?.value||0),C:+($('c')?.value||0)}}
function bindActivity(t){if(t.steps){let s=0,els=[...document.querySelectorAll('[data-step]')];const draw=()=>els.forEach((e,i)=>{e.style.display=i<=s?'grid':'none';e.classList.toggle('active',i===s);e.lastElementChild.textContent=i<=s?(t.laws[i]||'Transformation'):''});nextStep.onclick=()=>{s=Math.min(t.steps.length-1,s+1);draw()};prevStep.onclick=()=>{s=Math.max(0,s-1);draw()};resetStep.onclick=()=>{s=0;draw()};draw();return}
if($('runAct'))runAct.onclick=()=>{const {A,B,C}=vals();if(t.d==='foundations')actOut.innerHTML='A: literal<br>B̅: complemented literal<br>A+B·C: Boolean expression<br>0 and 1: Boolean values';else if(t.d==='precedence'){const n=inv(C),p=B&n,r=A|p;actOut.innerHTML=`Step 1: C̅=${n}<br>Step 2: B·C̅=${B}·${n}=${p}<br>Step 3: A+B·C̅=${A}+${p}=${r}`}else if(t.d.startsWith('demorgan')){const product=t.d==='demorgan-product',l=product?inv(A&B):inv(A|B),r=product?(inv(A)|inv(B)):(inv(A)&inv(B));actOut.innerHTML=`Left side=${l}<br>Right side=${r}<br><b>${l===r?'They match.':'Mismatch.'}</b>`}else{let l=0,r=0,formula='';if(t.d==='identity'){l=A|0;r=A;formula='A+0=A'}if(t.d==='complement'){l=A|inv(A);r=1;formula='A+A̅=1'}if(t.d==='rearrangement'){l=A|B;r=B|A;formula='A+B=B+A'}if(t.d==='distributive'){l=A&(B|C);r=(A&B)|(A&C);formula='A·(B+C)=A·B+A·C'}actOut.innerHTML=`${formula}<br>Left=${l}, Right=${r}<br><b>${l===r?'Equal for this input.':'Not equal.'}</b>`}};
if($('allRows'))allRows.onclick=()=>buildMini(t);if($('nextCircuit')){const arr=t.d==='circuit-expression'?['First gate: AND, so X=B·C.','Final gate: OR combines A and X.','Substitute X: F=A+B·C.']:['Evaluate B·C first, so use an AND gate.','Name its output X=B·C.','Use a final OR gate: F=A+X.'];let i=-1;nextCircuit.onclick=()=>{i=Math.min(arr.length-1,i+1);actOut.textContent=arr[i]};resetCircuit.onclick=()=>{i=-1;actOut.textContent='Begin by identifying B·C.'}}}
function buildMini(t){let rows=[];for(let A=0;A<2;A++)for(let B=0;B<2;B++){let l,r,h1,h2;if(t.d==='demorgan-product'){l=inv(A&B);r=inv(A)|inv(B);h1='(A·B)̅';h2='A̅+B̅'}else if(t.d==='demorgan-sum'){l=inv(A|B);r=inv(A)&inv(B);h1='(A+B)̅';h2='A̅·B̅'}else{l=A|(A&B);r=A;h1='A+A·B';h2='A'}rows.push([A,B,l,r])}miniTable.innerHTML=`<div class="truth-wrap"><table class="truth-table"><thead><tr><th>A</th><th>B</th><th>${h1}</th><th>${h2}</th><th>Match?</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r[2]===r[3]?'match':'mismatch'}">${r.map(v=>`<td>${v}</td>`).join('')}<td>${r[2]===r[3]?'Yes':'No'}</td></tr>`).join('')}</tbody></table></div>`}
function updateProgress(){const p=Math.round(completed.size/topics.length*100);progressBar.style.width=p+'%';progressText.textContent=`${completed.size} of ${topics.length} concepts completed (${p}%)`}

const practiceSets={
'and':{name:'AND gate: F=A·B',vars:['A','B'],cols:['A','B','F'],calc:r=>r.A&r.B,help:'AND is 1 only when both inputs are 1.'},
'or':{name:'OR gate: F=A+B',vars:['A','B'],cols:['A','B','F'],calc:r=>r.A|r.B,help:'OR is 1 when at least one input is 1.'},
'xor':{name:'XOR gate: F=A⊕B',vars:['A','B'],cols:['A','B','F'],calc:r=>r.A^r.B,help:'XOR is 1 when the inputs differ.'},
'demorgan':{name:'DeMorgan: F=(A·B)̅',vars:['A','B'],cols:['A','B','A·B','F'],calc:r=>inv(r.A&r.B),mid:r=>r.A&r.B,help:'Calculate A·B first, then complement it.'},
'absorption':{name:'Absorption: F=A+A·B',vars:['A','B'],cols:['A','B','A·B','F'],calc:r=>r.A|(r.A&r.B),mid:r=>r.A&r.B,help:'Calculate A·B, then OR it with A.'},
'precedence':{name:'Precedence: F=A+B·C̅',vars:['A','B','C'],cols:['A','B','C','C̅','B·C̅','F'],calc:r=>r.A|(r.B&inv(r.C)),mids:r=>[inv(r.C),r.B&inv(r.C)],help:'Evaluate C̅, then B·C̅, then OR with A.'}
};
let practiceKey='and',practiceRows=[];
function rowObjects(vars){const n=2**vars.length;return Array.from({length:n},(_,i)=>Object.fromEntries(vars.map((v,j)=>[v,(i>>(vars.length-1-j))&1])))}
function renderPractice(){truthPractice.innerHTML=`<h2>Truth-table practice</h2><p>Complete each output cell yourself, then check the table. Intermediate columns are included for expressions that require multiple operations.</p><div class="truth-toolbar"><label>Practice expression<select id="practiceSelect">${Object.entries(practiceSets).map(([k,v])=>`<option value="${k}" ${k===practiceKey?'selected':''}>${v.name}</option>`).join('')}</select></label><button class="btn" id="newPractice">Reset table</button><button class="btn" id="hintPractice">Show hint</button><button class="btn primary" id="checkPractice">Check answers</button></div><p id="practiceHint" class="observation hidden"></p><div id="practiceTable"></div><div id="practiceResult"></div>`;practiceSelect.onchange=e=>{practiceKey=e.target.value;drawPracticeTable()};newPractice.onclick=drawPracticeTable;hintPractice.onclick=()=>{practiceHint.textContent=practiceSets[practiceKey].help;practiceHint.classList.remove('hidden')};checkPractice.onclick=gradePractice;drawPracticeTable()}
function expectedCells(set,r){if(set.mids){const m=set.mids(r);return [...m,set.calc(r)]}if(set.mid)return [set.mid(r),set.calc(r)];return [set.calc(r)]}
function drawPracticeTable(){const set=practiceSets[practiceKey];practiceRows=rowObjects(set.vars);if($('practiceHint'))practiceHint.classList.add('hidden');practiceResult.innerHTML='';practiceTable.innerHTML=`<div class="truth-wrap"><table class="truth-table"><thead><tr>${set.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${practiceRows.map((r,ri)=>{const fixed=set.vars.map(v=>`<td>${r[v]}</td>`).join('');const count=set.cols.length-set.vars.length;return `<tr data-practice-row="${ri}">${fixed}${Array.from({length:count},(_,ci)=>`<td><select aria-label="Row ${ri+1}, answer ${ci+1}" data-answer-cell="${ri}-${ci}"><option value="">?</option><option value="0">0</option><option value="1">1</option></select></td>`).join('')}</tr>`}).join('')}</tbody></table></div>`}
function gradePractice(){const set=practiceSets[practiceKey];let right=0,total=0;practiceRows.forEach((r,ri)=>{const exp=expectedCells(set,r);let rowOK=true;exp.forEach((e,ci)=>{total++;const el=document.querySelector(`[data-answer-cell="${ri}-${ci}"]`);const ok=el.value!==''&&+el.value===e;if(ok)right++;else rowOK=false;el.style.borderColor=ok?'#19764c':'#ed625e'});document.querySelector(`[data-practice-row="${ri}"]`).className=rowOK?'match':'mismatch'});const pct=Math.round(right/total*100);practiceResult.innerHTML=`<div class="score-card"><div><b>${right}/${total}</b>correct cells</div><div><b>${pct}%</b>practice score</div></div><p class="${right===total?'correct':'incorrect'}"><b>${right===total?'Excellent. The table is complete and correct.':'Review the red rows, use the hint, and try again.'}</b></p>`}
function renderQuiz(){quiz.innerHTML=`<h2>Lecture 3 quiz</h2><p>One question is included for every concept.</p>${topics.map((t,i)=>`<div class="quiz-item"><b>${i+1}. ${t.q}</b>${t.o.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}<p id="qf${i}"></p></div>`).join('')}<button class="btn primary" id="gradeQuiz">Submit quiz</button><div id="quizScore"></div>`;gradeQuiz.onclick=()=>{let n=0;topics.forEach((t,i)=>{const a=document.querySelector(`input[name="q${i}"]:checked`),ok=a&&+a.value===t.a;if(ok)n++;qf=document.getElementById('qf'+i);qf.className=ok?'correct':'incorrect';qf.textContent=ok?'Correct.':'Correct answer: '+t.o[t.a]+'. '+t.f});quizScore.innerHTML=`<div class="score-card"><div><b>${n}/${topics.length}</b>correct answers</div><div><b>${Math.round(n/topics.length*100)}%</b>quiz score</div></div>`}}
renderLesson();renderPractice();updateProgress();
</script>
</body>
