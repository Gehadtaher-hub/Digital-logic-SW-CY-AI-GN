<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Circuits Studio</title><style>:root{--bg:#f3fbfa;--card:#fff;--navy:#173f5f;--blue:#1f7a8c;--cyan:#38b2ac;--green:#238b66;--red:#c24d5a;--coral:#f25f5c;--gold:#f2b134;--violet:#6657a8;--line:#c9e2df;--text:#17343d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#fff8e8 0,#f2fbfa 35%,#e2f4f3 100%);color:var(--text);font-family:Segoe UI,Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:linear-gradient(110deg,#173f5f,#1f7a8c 55%,#38b2ac);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:5px solid var(--gold)}.btn,.nav{border:1px solid #83b8c8;border-radius:9px;padding:10px 12px;font-weight:750;cursor:pointer}.btn{background:#fff;color:#12395a;text-decoration:none}.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}aside{background:#f7fcfd;border-right:1px solid var(--line);padding:13px}.nav{display:block;width:100%;text-align:left;margin:6px 0;background:#e6f3f7;color:#12395a}.nav.active,.nav:hover{background:linear-gradient(100deg,var(--blue),var(--violet));color:white;box-shadow:0 5px 14px #6657a82b}main{max-width:1080px;width:100%;padding:22px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:24px;box-shadow:0 8px 24px #1749651c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.metric,.question,.term{border:1px solid var(--line);border-radius:13px;padding:15px;background:#fbfeff}.metric strong{font-size:34px;color:var(--blue)}.option{display:block;border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0;background:#f8fcfd}.good{color:var(--green)}.bad{color:var(--red)}select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.tag{display:inline-block;padding:5px 9px;background:#dff4f7;color:#12637a;border-radius:999px;font-weight:bold}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.primary{background:linear-gradient(100deg,var(--blue),var(--violet));color:white;border-color:transparent}.accent{background:linear-gradient(100deg,var(--coral),var(--gold));color:#17343d;border-color:transparent}.secondary{background:white;color:#12395a}.navigator{display:flex;gap:5px;flex-wrap:wrap}.navigator button{width:38px;height:38px;border:1px solid var(--line);background:white;border-radius:7px}.navigator .cur{border:3px solid var(--blue)}.navigator .ans{background:#dff4ea}.navigator .flag{outline:3px solid #e8a020}.timer{font-size:23px;font-weight:bold;margin-left:auto}.progress{height:9px;background:#e3edf1;margin:12px 0}.progress div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--coral))}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}@media(max-width:760px){.layout{display:block}aside{display:flex;overflow:auto}.nav{min-width:130px}main{padding:10px}header h1{font-size:19px}}.diagram{margin:14px 0;padding:18px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#f7ffff,#fff8ed);overflow:auto}.circuit{display:flex;align-items:center;justify-content:center;gap:10px;min-width:530px}.wire{height:4px;background:var(--blue);width:55px;border-radius:4px}.logic-symbol{width:145px;height:92px;display:block}.symbol-wrap{display:inline-flex;align-items:center;justify-content:center;min-width:145px}.gate-shape{min-width:95px;padding:18px 15px;text-align:center;border:3px solid var(--violet);border-radius:15px 45px 45px 15px;background:#fff;color:var(--navy);font-weight:900;box-shadow:0 6px 14px #6657a824}.gate-invert{border-radius:50%;min-width:72px}.node{min-width:44px;text-align:center;padding:9px;border-radius:9px;background:#e4f7f5;border:2px solid var(--cyan);font-weight:850}.led{display:inline-flex;width:44px;height:44px;border-radius:50%;align-items:center;justify-content:center;font-weight:900;border:3px solid #9cb;box-shadow:inset 0 0 9px #0002}.led.on{background:#4ade80;color:#073b22;box-shadow:0 0 18px #4ade80}.led.off{background:#d9e2e2;color:#526}.gate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.gate-card{padding:12px;border:1px solid var(--line);border-radius:12px;background:#f9fefe}.seg{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff1c7;color:#725000;font-weight:800}.diagram-option{display:block;border:2px solid var(--line);border-radius:12px;padding:10px;margin:9px 0;background:#fff;cursor:pointer}.diagram-option:hover{border-color:var(--coral);background:#fff9f2}</style></head><body><header><h1>Digital Circuits Activity Studio</h1><a class="btn" href="index.html">Back to eBook</a></header><div class="layout"><aside><button class="nav active" onclick="go('home',this)">Dashboard</button><button class="nav" onclick="go('practice',this)">Practice</button><button class="nav" onclick="go('challenge',this)">Challenge</button><button class="nav" onclick="go('exam',this)">Examination</button><button class="nav" onclick="go('mock',this)">Mock Exam</button><button class="nav" onclick="go('simulator',this)">Gate Simulator</button><button class="nav" onclick="go('designer',this)">Circuit Designer</button><button class="nav" onclick="go('diagrams',this)">Diagram Questions</button><button class="nav" onclick="go('mastery',this)">Mastery</button><button class="nav" onclick="go('glossary',this)">Glossary</button><button class="nav" onclick="go('reports',this)">Reports</button></aside><main><div id="app"></div></main></div><script>const lectures=[{"title":"Introduction to Digital Systems","summary":"Verified practice on digital and analog systems, ADC/DAC, waveforms, timing, and number-system foundations.","questions":[{"q":"Which statement best distinguishes a digital signal from an analog signal?","o":["Digital uses discrete levels; analog varies continuously","Digital varies continuously; analog uses two levels","Both are always continuous","Both use only 0 and 1"],"a":0,"e":"Digital signals use discrete states, while analog signals vary continuously.","difficulty":"easy","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q01"},{"q":"Which sequence correctly describes analog-to-digital conversion?","o":["Encoding, sampling, amplification","Sampling, quantization, encoding","Quantization, decoding, sampling","Filtering, storage, decoding"],"a":1,"e":"An ADC samples the signal, quantizes each sample, then encodes the level in binary.","difficulty":"easy","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q02"},{"q":"How many quantization levels are available in a 3-bit ADC?","o":["3","6","8","16"],"a":2,"e":"An n-bit converter provides 2^n levels, so 2^3 = 8.","difficulty":"easy","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q03"},{"q":"A 3-bit ADC covers 0 V to 5 V using 8 equal levels. What step size is used in the lecture example?","o":["0.3125 V","0.625 V","1.25 V","1.667 V"],"a":1,"e":"Step size = voltage range / levels = 5/8 = 0.625 V.","difficulty":"medium","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q04"},{"q":"In the 3-bit ADC example, which code represents level 4?","o":["011","100","101","111"],"a":1,"e":"Decimal level 4 is binary 100.","difficulty":"medium","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q05"},{"q":"Which device converts a binary value into a proportional analog voltage or current?","o":["ADC","DAC","Register","Decoder"],"a":1,"e":"A DAC converts digital data to an analog output.","difficulty":"easy","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q06"},{"q":"A 3-bit DAC has Vref = 5 V and input 101₂. Using Vout = D·Vref/(2^n−1), what is Vout?","o":["2.50 V","3.00 V","3.57 V","5.00 V"],"a":2,"e":"101₂ = 5, so Vout = 5×5/7 ≈ 3.57 V.","difficulty":"challenge","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q07"},{"q":"Which is an advantage of digital systems emphasized in the lecture?","o":["Unlimited resolution","High noise immunity","No need for storage","All outputs are analog"],"a":1,"e":"Discrete logic levels make digital systems comparatively resistant to noise.","difficulty":"easy","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q08"},{"q":"A positive-going pulse begins with which transition?","o":["HIGH to LOW","LOW to HIGH","HIGH to HIGH","LOW to LOW"],"a":1,"e":"A positive-going pulse rises from LOW to HIGH before returning LOW.","difficulty":"easy","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q09"},{"q":"A falling edge is which transition?","o":["LOW to HIGH","HIGH to LOW","LOW to LOW","HIGH to HIGH"],"a":1,"e":"A falling edge changes from HIGH to LOW.","difficulty":"easy","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q10"},{"q":"What is the period of a 1 MHz clock?","o":["1 ms","1 µs","10 µs","1 ns"],"a":1,"e":"T = 1/f = 1/1,000,000 s = 1 µs.","difficulty":"medium","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q11"},{"q":"A waveform has T = 20 ms and pulse width = 5 ms. What is its duty cycle?","o":["20%","25%","40%","75%"],"a":1,"e":"Duty cycle = 5/20 × 100% = 25%.","difficulty":"medium","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q12"},{"q":"If frequency increases, what happens to period?","o":["It increases","It decreases","It remains fixed","It becomes zero"],"a":1,"e":"Frequency and period are reciprocals: f = 1/T.","difficulty":"easy","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q13"},{"q":"Rise time is commonly measured between which amplitude levels?","o":["0% and 100%","10% and 90%","25% and 75%","40% and 60%"],"a":1,"e":"Rise time is measured from 10% to 90% of maximum amplitude.","difficulty":"medium","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q14"},{"q":"What is the main purpose of a timing diagram?","o":["Measure resistance","Show digital signals changing over time","Convert decimal to binary","Store a bit"],"a":1,"e":"Timing diagrams show signal levels and transitions along a time axis.","difficulty":"easy","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q15"},{"q":"Which hierarchy item is a functional unit?","o":["ALU","Single transistor","Binary digit","Voltage level"],"a":0,"e":"An arithmetic logic unit is a functional unit inside a digital system.","difficulty":"easy","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q16"},{"q":"How many bits are in one nibble?","o":["2","4","8","16"],"a":1,"e":"A nibble contains four bits.","difficulty":"easy","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q17"},{"q":"Binary 101.01₂ equals which decimal value?","o":["5.25","5.50","6.25","10.25"],"a":0,"e":"101.01₂ = 4 + 1 + 1/4 = 5.25.","difficulty":"medium","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q18"},{"q":"Why is hexadecimal useful in digital systems?","o":["It removes the need for binary","Each hex digit compactly represents four binary bits","It uses only 0 and 1","It is always shorter than decimal"],"a":1,"e":"One hexadecimal digit maps directly to a 4-bit binary group.","difficulty":"medium","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q19"},{"q":"Which system combines analog input, digital processing, and analog playback?","o":["Digital audio system","Pure mechanical counter","Passive resistor network","Unclocked inverter"],"a":0,"e":"Digital audio uses an ADC, digital processing, then a DAC for playback.","difficulty":"scenario","source":"Lecture 1: Introduction to Digital Systems; textbook Chapter 1","id":"L1Q20"},{"q":"Which transfer method sends all bits of a word at the same time?","o":["Serial transfer","Parallel transfer","Analog transfer","Quantized transfer"],"a":1,"e":"Parallel transfer uses multiple lines to send the bits simultaneously.","difficulty":"easy","source":"Lecture 1: Binary digits, waveforms, serial and parallel data transfer","id":"L1Q21"},{"q":"Which transfer method sends bits one after another over a single data path?","o":["Parallel transfer","Serial transfer","Hybrid transfer","Level transfer"],"a":1,"e":"Serial transfer sends successive bits over one line or channel.","difficulty":"easy","source":"Lecture 1: Serial and parallel data transfer","id":"L1Q22"},{"q":"How many complete cycles occur in 4 ms for a 2 kHz waveform?","o":["2","4","8","16"],"a":2,"e":"2 kHz means 2000 cycles/s. In 0.004 s, cycles = 2000 × 0.004 = 8.","difficulty":"medium","source":"Lecture 1: Period and frequency","id":"L1Q23"},{"q":"A pulse is HIGH for 3 μs in a 12 μs period. What is the duty cycle?","o":["20%","25%","33.3%","75%"],"a":1,"e":"Duty cycle = 3/12 × 100% = 25%.","difficulty":"medium","source":"Lecture 1: Digital pulses and duty cycle","id":"L1Q24"},{"q":"What is the frequency of a waveform with a period of 250 μs?","o":["250 Hz","1 kHz","4 kHz","40 kHz"],"a":2,"e":"f = 1/T = 1/(250 × 10⁻⁶) = 4000 Hz = 4 kHz.","difficulty":"challenge","source":"Lecture 1: Period and frequency","id":"L1Q25"},{"q":"Which logic function produces the complement of its input?","o":["AND","OR","NOT","XOR"],"a":2,"e":"The NOT function changes logic 1 to 0 and logic 0 to 1.","difficulty":"easy","source":"Lecture 1, slide 3: Basic logic functions","id":"L1Q26"},{"q":"For a two-input OR function, which input condition makes the output HIGH?","o":["Both inputs must be LOW","At least one input is HIGH","Inputs must differ","Both inputs must be HIGH only"],"a":1,"e":"OR is HIGH when one or more inputs are HIGH.","difficulty":"easy","source":"Lecture 1, slide 3: NOT, AND, and OR functions","id":"L1Q27"},{"q":"For a two-input AND function, which condition makes the output HIGH?","o":["At least one input is HIGH","Both inputs are HIGH","Both inputs are LOW","Inputs are different"],"a":1,"e":"AND is HIGH only when all inputs are HIGH.","difficulty":"easy","source":"Lecture 1, slide 3: NOT, AND, and OR functions","id":"L1Q28"},{"q":"How long does it take to send an 8-bit word serially if one bit takes 2 μs?","o":["2 μs","4 μs","8 μs","16 μs"],"a":3,"e":"Eight bits at 2 μs per bit require 8 × 2 μs = 16 μs.","difficulty":"medium","source":"Lecture 1: Serial data transfer","id":"L1Q29"},{"q":"Which quantity describes the time for a pulse to change from approximately 10% to 90% of its amplitude?","o":["Pulse width","Rise time","Period","Duty cycle"],"a":1,"e":"Rise time measures the LOW-to-HIGH transition interval, commonly from 10% to 90%.","difficulty":"easy","source":"Lecture 1: Digital waveform characteristics","id":"L1Q30"}]},{"title":"Number Systems and Codes","summary":"Verified practice on conversions, complements, signed values, arithmetic, digital codes, and registers.","questions":[{"q":"Convert 45₁₀ to binary.","o":["101011₂","101101₂","110101₂","111001₂"],"a":1,"e":"45 = 32 + 8 + 4 + 1, producing 101101₂.","difficulty":"medium","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q01"},{"q":"Convert 10.625₁₀ to binary.","o":["1010.011₂","1010.101₂","1100.101₂","1011.001₂"],"a":1,"e":"10₁₀ = 1010₂ and 0.625₁₀ = 0.101₂.","difficulty":"challenge","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q02"},{"q":"Convert 456₁₀ to octal.","o":["700₈","710₈","720₈","750₈"],"a":1,"e":"Repeated division by 8 gives digits 7,1,0, so 456₁₀ = 710₈.","difficulty":"medium","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q03"},{"q":"Convert 754₁₀ to hexadecimal.","o":["2E2₁₆","2F2₁₆","3F2₁₆","2F4₁₆"],"a":1,"e":"754 ÷ 16 gives hexadecimal digits 2, F, 2.","difficulty":"challenge","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q04"},{"q":"Convert 11011101₂ to hexadecimal.","o":["BD₁₆","CD₁₆","DD₁₆","DE₁₆"],"a":2,"e":"Group as 1101 1101, giving D D.","difficulty":"medium","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q05"},{"q":"Convert 101110₂ to octal.","o":["46₈","54₈","56₈","66₈"],"a":2,"e":"Group as 101 110, giving 5 and 6.","difficulty":"medium","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q06"},{"q":"What is the 1s complement of 11001010₂?","o":["00110101₂","00110110₂","11001011₂","10110101₂"],"a":0,"e":"Invert every bit to obtain 00110101₂.","difficulty":"easy","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q07"},{"q":"What is the 2s complement of 11001010₂?","o":["00110101₂","00110110₂","11001011₂","01010110₂"],"a":1,"e":"Invert to 00110101₂ and add 1, giving 00110110₂.","difficulty":"medium","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q08"},{"q":"In 4-bit twos-complement representation, what is the range?","o":["−7 to +7","−8 to +7","−8 to +8","−15 to +15"],"a":1,"e":"An n-bit twos-complement range is −2^(n−1) to 2^(n−1)−1.","difficulty":"easy","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q09"},{"q":"What is −39 in 8-bit twos-complement form?","o":["10100111","11011000","11011001","11011010"],"a":2,"e":"+39 is 00100111; invert and add 1 to get 11011001.","difficulty":"challenge","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q10"},{"q":"Calculate 1011₂ + 1101₂.","o":["10110₂","11000₂","11010₂","11100₂"],"a":1,"e":"11 + 13 = 24, and 24₁₀ = 11000₂.","difficulty":"medium","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q11"},{"q":"Calculate 1110₂ + 1011₂.","o":["10101₂","11001₂","11101₂","10001₂"],"a":1,"e":"14 + 11 = 25, and 25₁₀ = 11001₂.","difficulty":"medium","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q12"},{"q":"Calculate 1010₂ − 1001₂.","o":["0000₂","0001₂","0010₂","0011₂"],"a":1,"e":"10 − 9 = 1, represented as 0001₂.","difficulty":"easy","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q13"},{"q":"Calculate 101₂ × 11₂.","o":["1010₂","1101₂","1111₂","10001₂"],"a":2,"e":"5 × 3 = 15, and 15₁₀ = 1111₂.","difficulty":"medium","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q14"},{"q":"Calculate 1011₂ ÷ 10₂.","o":["Quotient 100, remainder 1","Quotient 101, remainder 1","Quotient 110, remainder 0","Quotient 111, remainder 1"],"a":1,"e":"11 ÷ 2 gives quotient 5 (101₂) and remainder 1.","difficulty":"challenge","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q15"},{"q":"What is the BCD representation of decimal 59?","o":["0101 1001","0011 1011","0101 1010","0011 1001"],"a":0,"e":"Encode each decimal digit separately: 5 = 0101 and 9 = 1001.","difficulty":"medium","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q16"},{"q":"Convert binary 1101 to Gray code.","o":["1001","1011","1100","1111"],"a":1,"e":"Keep the MSB, then XOR adjacent binary bits: 1,0,1,1.","difficulty":"challenge","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q17"},{"q":"For even parity, which parity bit should be appended to data 1010?","o":["0","1","Either value","Two parity bits"],"a":0,"e":"1010 contains two 1s, already even, so the parity bit is 0.","difficulty":"easy","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q18"},{"q":"What is the Excess-3 code for decimal digit 4?","o":["0100","0101","0111","1000"],"a":2,"e":"Add 3 to 4 to obtain 7, represented as 0111.","difficulty":"medium","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q19"},{"q":"How many flip-flops are needed for a 16-bit register?","o":["4","8","16","32"],"a":2,"e":"Each flip-flop stores one bit, so 16 bits require 16 flip-flops.","difficulty":"easy","source":"Lecture 2: Number Systems, Complements, Arithmetic, and Codes","id":"L2Q20"},{"q":"Convert 111010₂ to decimal.","o":["54","56","58","60"],"a":2,"e":"111010₂ = 32 + 16 + 8 + 2 = 58.","difficulty":"medium","source":"Lecture 2: Binary-to-decimal conversion","id":"L2Q21"},{"q":"Convert 3A₁₆ to decimal.","o":["48","56","58","60"],"a":2,"e":"3A₁₆ = 3×16 + 10 = 58.","difficulty":"medium","source":"Lecture 2: Hexadecimal conversion","id":"L2Q22"},{"q":"Convert 73₈ to binary.","o":["111001₂","111011₂","111101₂","110111₂"],"a":1,"e":"Convert each octal digit to three bits: 7→111 and 3→011, giving 111011₂.","difficulty":"medium","source":"Lecture 2: Octal and binary conversion","id":"L2Q23"},{"q":"What is the 8-bit binary representation of unsigned decimal 200?","o":["10101000","11000100","11001000","11101000"],"a":2,"e":"200 = 128 + 64 + 8, giving 11001000₂.","difficulty":"medium","source":"Lecture 2: Decimal-to-binary conversion","id":"L2Q24"},{"q":"What decimal value does 11110110₂ represent as an 8-bit two’s-complement number?","o":["−8","−10","−12","246"],"a":1,"e":"Invert 11110110 to 00001001 and add 1 to obtain 00001010, so the value is −10.","difficulty":"challenge","source":"Lecture 2: Signed two’s-complement numbers","id":"L2Q25"},{"q":"In 8-bit unsigned addition, what happens when 11111111₂ and 00000001₂ are added?","o":["Result 00000000 with carry out 1","Result 11111110 with no carry","Result 00000001 with carry out 0","Result 11111111 with carry out 1"],"a":0,"e":"255 + 1 = 256, so the 8-bit result is 00000000 with a carry out.","difficulty":"challenge","source":"Lecture 2: Binary addition and overflow","id":"L2Q26"},{"q":"Which 4-bit pattern is not a valid single BCD digit?","o":["0101","1001","1010","0011"],"a":2,"e":"BCD digit codes are valid only from 0000 through 1001.","difficulty":"easy","source":"Lecture 2: Binary-coded decimal","id":"L2Q27"},{"q":"Convert Gray code 1011 to binary.","o":["1001","1101","1110","1010"],"a":1,"e":"Keep the first bit; cumulative XOR gives binary 1101.","difficulty":"challenge","source":"Lecture 2: Gray-code conversion","id":"L2Q28"},{"q":"For odd parity, which parity bit is appended to 1100?","o":["0","1","Either","No parity bit"],"a":1,"e":"1100 contains two 1s. Adding parity bit 1 makes the total number of 1s odd.","difficulty":"medium","source":"Lecture 2: Parity codes","id":"L2Q29"},{"q":"What is 10000₂ − 00001₂?","o":["01110₂","01111₂","10001₂","11111₂"],"a":1,"e":"16 − 1 = 15, which is 01111₂ in five bits.","difficulty":"easy","source":"Lecture 2: Binary subtraction","id":"L2Q30"}]},{"title":"Logic Gates","summary":"Verified practice on gate behavior, truth tables, Boolean symbols, bit streams, and universal-gate implementation.","questions":[{"q":"What is the output of a NOT gate when its input is 1?","o":["0","1","Undefined","Depends on a second input"],"a":0,"e":"A NOT gate outputs the complement of its single input.","difficulty":"easy","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q01"},{"q":"When does a two-input OR gate output 0?","o":["Only for 00","Only for 11","Whenever inputs differ","Whenever either input is 1"],"a":0,"e":"OR is 0 only when all inputs are 0.","difficulty":"easy","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q02"},{"q":"When does a two-input AND gate output 1?","o":["For any input 1","Only for 11","Only for 00","Whenever inputs differ"],"a":1,"e":"AND requires all inputs to be 1.","difficulty":"easy","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q03"},{"q":"For A=1 and B=0, what is A XOR B?","o":["0","1","Undefined","2"],"a":1,"e":"XOR outputs 1 when its inputs differ.","difficulty":"easy","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q04"},{"q":"For A=1 and B=1, what is A XNOR B?","o":["0","1","Undefined","Depends on clock"],"a":1,"e":"XNOR outputs 1 when its inputs are equal.","difficulty":"easy","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q05"},{"q":"For A=0 and B=0, what is A NOR B?","o":["0","1","Undefined","A"],"a":1,"e":"OR gives 0 and the following inversion gives 1.","difficulty":"medium","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q06"},{"q":"For A=1 and B=1, what is A NAND B?","o":["0","1","A","B"],"a":0,"e":"AND gives 1 and NAND inverts it to 0.","difficulty":"medium","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q07"},{"q":"Which gates are universal gates?","o":["AND and OR","NAND and NOR","XOR and XNOR","NOT and BUFFER"],"a":1,"e":"Any Boolean function can be built using only NAND gates or only NOR gates.","difficulty":"easy","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q08"},{"q":"How can a NAND gate implement NOT A?","o":["Tie both NAND inputs to A","Tie one input to 0","Use A and its complement","Leave one input floating"],"a":0,"e":"NAND(A,A) = NOT(A·A) = NOT A.","difficulty":"medium","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q09"},{"q":"How many input combinations appear in a three-variable truth table?","o":["3","6","8","16"],"a":2,"e":"Three binary variables give 2^3 = 8 combinations.","difficulty":"easy","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q10"},{"q":"Which Boolean operator represents the OR gate?","o":["Multiplication dot","Plus sign","Overbar only","XOR symbol only"],"a":1,"e":"Boolean addition, written +, represents OR.","difficulty":"easy","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q11"},{"q":"Which Boolean operator represents the AND gate?","o":["Multiplication dot","Plus sign","Overbar","Equality sign"],"a":0,"e":"Boolean multiplication, commonly written with a dot, represents AND.","difficulty":"easy","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q12"},{"q":"Two bit streams 1100 and 1010 enter an AND gate bit by bit. What is the output?","o":["1000","1110","0110","1011"],"a":0,"e":"Bitwise AND gives 1 only where both streams contain 1.","difficulty":"medium","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q13"},{"q":"Two bit streams 1100 and 1010 enter an OR gate bit by bit. What is the output?","o":["1000","1110","0110","1011"],"a":1,"e":"Bitwise OR gives 1110.","difficulty":"medium","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q14"},{"q":"Two bit streams 1100 and 1010 enter an XOR gate bit by bit. What is the output?","o":["0010","0110","1001","1110"],"a":1,"e":"XOR marks differing bit positions, producing 0110.","difficulty":"medium","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q15"},{"q":"A lamp controlled by an AND gate turns on under which switch condition?","o":["Either switch closed","Both switches closed","Both switches open","The switches differ"],"a":1,"e":"The AND gate requires both inputs to be active.","difficulty":"scenario","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q16"},{"q":"A comparison circuit must output 1 when two bits differ. Which gate should be used?","o":["AND","OR","XOR","XNOR"],"a":2,"e":"XOR is an inequality detector.","difficulty":"scenario","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q17"},{"q":"A comparison circuit must output 1 when two bits are equal. Which gate should be used?","o":["NAND","NOR","XOR","XNOR"],"a":3,"e":"XNOR is an equality detector.","difficulty":"scenario","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q18"},{"q":"What is the expression for a NAND gate output?","o":["A+B","A·B","NOT(A·B)","NOT(A+B)"],"a":2,"e":"NAND is an AND operation followed by inversion.","difficulty":"easy","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q19"},{"q":"Why can reducing the number of gates be advantageous?","o":["It always increases delay","It can reduce hardware, cost, power, and delay","It removes Boolean logic","It requires more wiring"],"a":1,"e":"A simpler circuit usually requires fewer components and may use less power and delay.","difficulty":"challenge","source":"Lecture 3: Logic Gates and Truth Tables","id":"L3Q20"},{"q":"For inputs A=0 and B=1, what is the NAND output?","o":["0","1","A","Undefined"],"a":1,"e":"A·B = 0, and NAND complements that result to 1.","difficulty":"easy","source":"Lecture 3: NAND truth table","id":"L3Q21"},{"q":"For inputs A=0 and B=1, what is the NOR output?","o":["0","1","B","Undefined"],"a":0,"e":"A+B = 1, and NOR complements that result to 0.","difficulty":"easy","source":"Lecture 3: NOR truth table","id":"L3Q22"},{"q":"Which gate outputs 1 for inputs 00 and 11 but 0 for 01 and 10?","o":["XOR","XNOR","OR","NAND"],"a":1,"e":"XNOR is HIGH when its inputs are equal.","difficulty":"medium","source":"Lecture 3: XNOR function","id":"L3Q23"},{"q":"Which gate outputs 1 for inputs 01 and 10 but 0 for 00 and 11?","o":["XOR","XNOR","AND","NOR"],"a":0,"e":"XOR is HIGH when its inputs differ.","difficulty":"medium","source":"Lecture 3: XOR function","id":"L3Q24"},{"q":"What is the output of NOT(NOT A)?","o":["0","1","A","NOT A"],"a":2,"e":"Double complementation returns the original variable A.","difficulty":"easy","source":"Lecture 3: Inverter operation","id":"L3Q25"},{"q":"Three inputs A, B, and C feed an AND gate. When is the output 1?","o":["When any input is 1","When exactly two inputs are 1","Only when A=B=C=1","Only when all inputs are 0"],"a":2,"e":"A multi-input AND is HIGH only when every input is HIGH.","difficulty":"easy","source":"Lecture 3: Multi-input AND gate","id":"L3Q26"},{"q":"Three inputs feed an OR gate. What is the output for 000?","o":["0","1","Depends on order","Undefined"],"a":0,"e":"An OR gate is LOW only when all inputs are LOW.","difficulty":"easy","source":"Lecture 3: Multi-input OR gate","id":"L3Q27"},{"q":"If A=1 and B=0, what is NOT A OR B?","o":["0","1","A","B"],"a":0,"e":"NOT A = 0, and 0 OR 0 = 0.","difficulty":"medium","source":"Lecture 3: Gate combinations and truth tables","id":"L3Q28"},{"q":"Which NAND-only expression implements A OR B?","o":["NAND(A,B)","NAND(NAND(A,A),NAND(B,B))","NAND(NAND(A,B),A)","NAND(A,A)"],"a":1,"e":"By DeMorgan, A+B = NOT(NOT A · NOT B); NAND inverters followed by NAND implement OR.","difficulty":"challenge","source":"Lecture 3: Universal NAND implementation","id":"L3Q29"},{"q":"Which NOR-only connection implements NOT A?","o":["NOR(A,A)","NOR(A,0)","NOR(A,1)","NOR(NOT A,A)"],"a":0,"e":"NOR(A,A) = NOT(A+A) = NOT A.","difficulty":"medium","source":"Lecture 3: Universal NOR implementation","id":"L3Q30"}]},{"title":"Boolean Algebra and K-Maps","summary":"Verified practice on Boolean laws, DeMorgan, SOP, POS, minterms, maxterms, K-maps, and don’t-cares.","questions":[{"q":"Simplify A + 0.","o":["0","1","A","NOT A"],"a":2,"e":"By the identity law, OR with 0 leaves A unchanged.","difficulty":"easy","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q01"},{"q":"Simplify A·1.","o":["0","1","A","NOT A"],"a":2,"e":"By the identity law, AND with 1 leaves A unchanged.","difficulty":"easy","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q02"},{"q":"Simplify A + 1.","o":["0","1","A","NOT A"],"a":1,"e":"By the null law, A OR 1 is always 1.","difficulty":"easy","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q03"},{"q":"Simplify A·0.","o":["0","1","A","NOT A"],"a":0,"e":"By the null law, A AND 0 is always 0.","difficulty":"easy","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q04"},{"q":"Simplify A + A.","o":["0","1","A","NOT A"],"a":2,"e":"The idempotent law gives A + A = A.","difficulty":"easy","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q05"},{"q":"Simplify A + NOT A.","o":["0","1","A","NOT A"],"a":1,"e":"A variable OR its complement is 1.","difficulty":"easy","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q06"},{"q":"Simplify A·NOT A.","o":["0","1","A","NOT A"],"a":0,"e":"A variable AND its complement is 0.","difficulty":"easy","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q07"},{"q":"Simplify A + A·B.","o":["B","A","A+B","A·B"],"a":1,"e":"The absorption law gives A + AB = A.","difficulty":"medium","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q08"},{"q":"Apply DeMorgan: NOT(A+B) equals what?","o":["NOT A + NOT B","NOT A · NOT B","A·B","A+B"],"a":1,"e":"The complement of an OR equals the AND of the complements.","difficulty":"medium","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q09"},{"q":"Apply DeMorgan: NOT(A·B) equals what?","o":["NOT A + NOT B","NOT A · NOT B","A·B","A+B"],"a":0,"e":"The complement of an AND equals the OR of the complements.","difficulty":"medium","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q10"},{"q":"Which expression is in Sum of Products form?","o":["(A+B)(C+D)","AB + NOT A·C","A(B+C)","NOT(A+B)"],"a":1,"e":"SOP is an OR of product terms.","difficulty":"medium","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q11"},{"q":"Which expression is in Product of Sums form?","o":["AB + CD","A+B+C","(A+B)(C+NOT D)","A·B·C"],"a":2,"e":"POS is an AND of sum terms.","difficulty":"medium","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q12"},{"q":"In canonical SOP, which truth-table rows are selected?","o":["Rows where F=0","Rows where F=1","Only the first row","Only rows with even indices"],"a":1,"e":"Canonical SOP is the sum of minterms for output-1 rows.","difficulty":"easy","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q13"},{"q":"In canonical POS, which truth-table rows are selected?","o":["Rows where F=0","Rows where F=1","Only the last row","Only rows with odd indices"],"a":0,"e":"Canonical POS is the product of maxterms for output-0 rows.","difficulty":"easy","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q14"},{"q":"Which is a valid K-map group size?","o":["3","5","6","8"],"a":3,"e":"K-map group sizes are powers of two: 1, 2, 4, 8, and so on.","difficulty":"easy","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q15"},{"q":"Can K-map groups wrap around the map edges?","o":["Yes","No","Only in a 2-variable map","Only for zeros"],"a":0,"e":"Opposite K-map edges are adjacent and may be grouped.","difficulty":"medium","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q16"},{"q":"For F(A,B,C)=Σm(1,3,5,7), what is the simplified result?","o":["A","B","C","A+B"],"a":2,"e":"All selected minterms are exactly the rows where C=1, so F=C.","difficulty":"challenge","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q17"},{"q":"What does X represent in a K-map?","o":["A forced 0","A forced 1","A don’t-care condition","An invalid cell"],"a":2,"e":"A don’t-care may be used as 0 or 1 when it helps simplification.","difficulty":"easy","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q18"},{"q":"When simplifying an SOP K-map, which cells are normally grouped?","o":["1s","0s","Row labels","Only X cells"],"a":0,"e":"SOP simplification groups output-1 cells, optionally using don’t-cares.","difficulty":"medium","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q19"},{"q":"What is the main benefit of Boolean or K-map simplification?","o":["More gates","Fewer gates and literals","More variables","A larger truth table"],"a":1,"e":"Simplification reduces expression complexity and often the required hardware.","difficulty":"scenario","source":"Lecture 4: Boolean Algebra, SOP/POS, and Karnaugh Maps","id":"L4Q20"},{"q":"Simplify A·A.","o":["0","1","A","NOT A"],"a":2,"e":"The idempotent law gives A·A = A.","difficulty":"easy","source":"Lecture 4: Boolean algebra laws","id":"L4Q21"},{"q":"Simplify A + A·B + A·C.","o":["A","B+C","A+B+C","A·B·C"],"a":0,"e":"Apply absorption twice: A+AB=A and A+AC=A.","difficulty":"medium","source":"Lecture 4: Absorption law","id":"L4Q22"},{"q":"Simplify A(A+B).","o":["A","B","A+B","A·B"],"a":0,"e":"The absorption law gives A(A+B)=A.","difficulty":"medium","source":"Lecture 4: Boolean simplification","id":"L4Q23"},{"q":"Which minterm corresponds to A=1, B=0, C=1?","o":["NOT A·B·NOT C","A·NOT B·C","A·B·NOT C","NOT A·NOT B·C"],"a":1,"e":"A minterm uses the variable uncomplemented for 1 and complemented for 0.","difficulty":"medium","source":"Lecture 4: Minterms and canonical SOP","id":"L4Q24"},{"q":"What is the index of minterm A·NOT B·C for variables ordered A,B,C?","o":["3","4","5","6"],"a":2,"e":"The assignment is 101₂, which is decimal 5, so the minterm is m5.","difficulty":"medium","source":"Lecture 4: Minterm indexing","id":"L4Q25"},{"q":"In a four-variable K-map, how many cells are present?","o":["4","8","16","32"],"a":2,"e":"A four-variable truth table and K-map contain 2⁴ = 16 cells.","difficulty":"easy","source":"Lecture 4: Four-variable Karnaugh maps","id":"L4Q26"},{"q":"A K-map group of eight cells eliminates how many changing variables?","o":["1","2","3","4"],"a":2,"e":"A group of 2³ cells eliminates three variables from the resulting term.","difficulty":"challenge","source":"Lecture 4: K-map grouping","id":"L4Q27"},{"q":"May a K-map cell be included in more than one group?","o":["Yes, if overlap helps simplification","No, never","Only if the cell is 0","Only in a two-variable map"],"a":0,"e":"Groups may overlap when that produces larger groups or a simpler expression.","difficulty":"medium","source":"Lecture 4: K-map grouping rules","id":"L4Q28"},{"q":"For F(A,B)=Σm(0,1), what is the simplified expression?","o":["A","NOT A","B","NOT B"],"a":1,"e":"Minterms 0 and 1 cover both values of B while A=0, so F=NOT A.","difficulty":"challenge","source":"Lecture 4: Two-variable K-map simplification","id":"L4Q29"},{"q":"Which theorem changes A + B·C into (A+B)(A+C)?","o":["Commutative law","Distributive law","Complement law","Identity law"],"a":1,"e":"Boolean distributive form gives A+BC=(A+B)(A+C).","difficulty":"challenge","source":"Lecture 4: Distributive law","id":"L4Q30"}]},{"title":"Combinational Circuits","summary":"Verified practice on combinational design, adders, subtractors, BCD correction, decoders, encoders, and multiplexers.","questions":[{"q":"A combinational circuit output depends on what?","o":["Present inputs only","Previous state only","Clock history only","Stored data only"],"a":0,"e":"Combinational circuits have no memory; outputs depend on current inputs.","difficulty":"easy","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q01"},{"q":"Which item is not required in a combinational circuit?","o":["Inputs","Logic gates","Outputs","Memory element"],"a":3,"e":"Combinational circuits do not store state.","difficulty":"easy","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q02"},{"q":"What are the two outputs of a half adder?","o":["Set and reset","Sum and carry","Data and enable","Difference and clock"],"a":1,"e":"A half adder produces Sum and Carry outputs.","difficulty":"easy","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q03"},{"q":"What is the half-adder sum equation?","o":["S=A+B","S=A·B","S=A XOR B","S=NOT A"],"a":2,"e":"The half-adder sum is XOR.","difficulty":"easy","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q04"},{"q":"What is the half-adder carry equation?","o":["C=A+B","C=A·B","C=A XOR B","C=NOT(A+B)"],"a":1,"e":"The carry is 1 only when both inputs are 1.","difficulty":"easy","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q05"},{"q":"For a half adder with A=1 and B=1, what are (S,C)?","o":["(0,0)","(0,1)","(1,0)","(1,1)"],"a":1,"e":"1+1 produces binary 10: sum 0 and carry 1.","difficulty":"medium","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q06"},{"q":"What additional input distinguishes a full adder from a half adder?","o":["Enable","Borrow","Carry-in","Select"],"a":2,"e":"A full adder adds A, B, and Cin.","difficulty":"easy","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q07"},{"q":"What is the full-adder sum equation?","o":["A+B+Cin","A·B·Cin","A XOR B XOR Cin","NOT(A XOR B)"],"a":2,"e":"The sum bit is the XOR of the three inputs.","difficulty":"medium","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q08"},{"q":"For A=0, B=1, Cin=1, what are full-adder outputs (S,Cout)?","o":["(0,0)","(0,1)","(1,0)","(1,1)"],"a":1,"e":"0+1+1 = 2 = binary 10.","difficulty":"medium","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q09"},{"q":"A full adder can be built from which components?","o":["Two half adders and an OR gate","Two decoders only","One NOT gate only","One multiplexer only"],"a":0,"e":"The two half-adder carry outputs are ORed to form Cout.","difficulty":"medium","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q10"},{"q":"What are the outputs of a half subtractor?","o":["Sum and carry","Difference and borrow","Set and reset","Code and enable"],"a":1,"e":"A half subtractor produces Difference and Borrow.","difficulty":"easy","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q11"},{"q":"For a half subtractor with A=0 and B=1, what are (D,Borrow)?","o":["(0,0)","(0,1)","(1,0)","(1,1)"],"a":3,"e":"0−1 requires a borrow and leaves difference 1.","difficulty":"medium","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q12"},{"q":"In a 4-bit adder-subtractor, what does control K=0 select?","o":["Addition","Subtraction","Multiplication","Division"],"a":0,"e":"With K=0, Y passes unchanged and the circuit performs addition.","difficulty":"medium","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q13"},{"q":"In a 4-bit adder-subtractor, what does control K=1 select?","o":["Addition","Subtraction","Storage","Encoding"],"a":1,"e":"K=1 complements Y through XOR and supplies the added 1 for twos-complement subtraction.","difficulty":"medium","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q14"},{"q":"Why does a BCD adder add 0110 after an invalid binary sum?","o":["To divide by two","To correct sums 10 through 15 into valid BCD","To clear the carry","To convert to Gray code"],"a":1,"e":"Adding 6 corrects an invalid 4-bit BCD digit.","difficulty":"challenge","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q15"},{"q":"A decoder with n binary inputs can activate how many output lines?","o":["n","n+1","2n","2^n"],"a":3,"e":"An n-to-2^n decoder provides one output per input combination.","difficulty":"easy","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q16"},{"q":"When enabled, a 2-to-4 decoder activates how many outputs for one input code?","o":["None","One","Two","Four"],"a":1,"e":"A standard decoder is one-hot: exactly one output is active.","difficulty":"medium","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q17"},{"q":"What is the reverse operation of a decoder?","o":["Adder","Encoder","Comparator","Register"],"a":1,"e":"An encoder maps one active input line to a binary code.","difficulty":"easy","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q18"},{"q":"How many select lines does a 4-to-1 multiplexer need?","o":["1","2","3","4"],"a":1,"e":"Two select bits can choose among four inputs.","difficulty":"easy","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q19"},{"q":"For a 4-to-1 MUX, which input is selected by S1S0=10?","o":["A0","A1","A2","A3"],"a":2,"e":"The select value 10₂ is decimal 2, so A2 is routed to the output.","difficulty":"medium","source":"Lecture 5: Combinational Circuits and Adders","id":"L5Q20"},{"q":"For a full adder with A=1, B=1, and Cin=1, what are (S,Cout)?","o":["(0,1)","(1,0)","(1,1)","(0,0)"],"a":2,"e":"1+1+1=3, represented as binary 11, so S=1 and Cout=1.","difficulty":"medium","source":"Lecture 5: Full-adder truth table","id":"L5Q21"},{"q":"For a full adder with A=1, B=0, and Cin=0, what are (S,Cout)?","o":["(0,0)","(0,1)","(1,0)","(1,1)"],"a":2,"e":"The sum is 1 with no carry.","difficulty":"easy","source":"Lecture 5: Full-adder operation","id":"L5Q22"},{"q":"What is the full-adder carry expression?","o":["AB + ACin + BCin","A XOR B XOR Cin","A+B+Cin","ABCin only"],"a":0,"e":"Cout is 1 when at least two of the three inputs are 1, represented by AB+ACin+BCin.","difficulty":"challenge","source":"Lecture 5: Full-adder equations","id":"L5Q23"},{"q":"For a half subtractor, what is the difference equation?","o":["D=A+B","D=A·B","D=A XOR B","D=NOT A"],"a":2,"e":"The difference bit is 1 when A and B differ.","difficulty":"easy","source":"Lecture 5: Half subtractor","id":"L5Q24"},{"q":"For a half subtractor, what is the borrow equation?","o":["A·B","NOT A·B","A·NOT B","A+B"],"a":1,"e":"A borrow is required only when subtracting 1 from 0, so Borrow=NOT A·B.","difficulty":"medium","source":"Lecture 5: Half-subtractor equations","id":"L5Q25"},{"q":"How many full adders are required for a 4-bit ripple-carry adder?","o":["1","2","3","4"],"a":3,"e":"Each bit position requires one full-adder stage.","difficulty":"easy","source":"Lecture 5: Parallel binary adder","id":"L5Q26"},{"q":"What is the main disadvantage of a ripple-carry adder as word size increases?","o":["It cannot add binary numbers","Carry propagation delay increases","It requires analog inputs","It has no sum output"],"a":1,"e":"Each stage may wait for the previous carry, increasing total propagation delay.","difficulty":"medium","source":"Lecture 5: Ripple-carry addition","id":"L5Q27"},{"q":"How many data inputs does an 8-to-1 multiplexer have?","o":["2","3","8","16"],"a":2,"e":"An 8-to-1 multiplexer selects one of eight data inputs.","difficulty":"easy","source":"Lecture 5: Multiplexers","id":"L5Q28"},{"q":"How many select lines are required by an 8-to-1 multiplexer?","o":["2","3","4","8"],"a":1,"e":"Three select bits provide 2³=8 selection combinations.","difficulty":"medium","source":"Lecture 5: Multiplexer selection","id":"L5Q29"},{"q":"A 3-to-8 decoder receives input 101. Which output line is selected in active-HIGH notation?","o":["Y3","Y4","Y5","Y7"],"a":2,"e":"101₂ equals decimal 5, so output Y5 is selected.","difficulty":"medium","source":"Lecture 5: Decoder operation","id":"L5Q30"}]}],glossaryData=[["ADC","Analog-to-digital converter."],["DAC","Digital-to-analog converter."],["Duty cycle","Pulse width divided by period."],["Nibble","Four bits."],["Gray code","Adjacent values differ by one bit."],["NAND","Universal complement-of-AND gate."],["K-map","Visual Boolean simplification method."],["Multiplexer","Selects one data input."],["Decoder","Activates an output from a binary code."],["Flip-flop","Clocked one-bit storage element."],["Latch","Level-sensitive storage element."],["Register","A group of bit-storage elements."]];let state=JSON.parse(localStorage.getItem('digitalRich')||'{}'),history=JSON.parse(localStorage.getItem('digitalHistory')||'[]'),run,tick;function save(){localStorage.setItem('digitalRich',JSON.stringify(state));localStorage.setItem('digitalHistory',JSON.stringify(history))}function all(){let a=[];lectures.forEach((c,ci)=>c.questions.forEach((q,qi)=>a.push({c,ci,q,qi})));return a}function sh(a){return[...a].sort(()=>Math.random()-.5)}function go(n,b){clearInterval(tick);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');({home,practice,challenge,exam:examSetup,mock:mockExam,simulator,designer,diagrams,mastery,glossary,reports}[n])()}function home(){app.innerHTML=`<section class="card"><span class="tag">Five-lecture verified edition</span><h2>Foundations of Digital Circuits</h2><p>Questions verified against the five-lecture course scope, with explanations, source labels, challenges, and configurable examinations.</p><div class="grid"><div class="metric"><strong>${all().length}</strong><br>total questions</div><div class="metric"><strong>${all().filter(x=>['challenge','scenario'].includes(x.q.difficulty)).length}</strong><br>challenge questions</div><div class="metric"><strong>${Object.keys(state).length}</strong><br>practiced answers</div><div class="metric"><strong>${history.length}</strong><br>completed tests</div></div></section>`}function practice(ci=0){let c=lectures[ci];app.innerHTML=`<section class="card"><span class="tag">Practice with feedback</span><h2>${c.title}</h2><select onchange="practice(+this.value)">${lectures.map((x,i)=>`<option value="${i}" ${i==ci?'selected':''}>Lecture ${i+1}: ${x.title}</option>`).join('')}</select>${c.questions.map((q,i)=>card(ci,i,q)).join('')}</section>`}function card(ci,qi,q){let s=state[ci+'_'+qi];return`<div class="question"><b>${qi+1}. ${q.q}</b><small> • ${q.difficulty}</small>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="p${ci}_${qi}" ${s&&s.sel===j?'checked':''} onchange="answer(${ci},${qi},${j})"> ${o}</label>`).join('')}<div id="f${ci}_${qi}">${s?(s.ok?'<span class="good">Correct. </span>':'<span class="bad">Incorrect. </span>')+q.e+'<br><small><b>Verified source:</b> '+q.source+'</small>':''}</div></div>`}function answer(ci,qi,sel){let q=lectures[ci].questions[qi];state[ci+'_'+qi]={sel,ok:sel===q.a};save();document.getElementById('f'+ci+'_'+qi).innerHTML=(sel===q.a?'<span class="good">Correct. </span>':'<span class="bad">Incorrect. </span>')+q.e+'<br><small><b>Verified source:</b> '+q.source+'</small>'}function challenge(){start('Challenge',sh(all().filter(x=>['challenge','scenario'].includes(x.q.difficulty))).slice(0,25),1200,70)}function examSetup(){app.innerHTML=`<section class="card"><h2>Configure examination</h2><div class="grid"><label>Questions<select id="cnt"><option>20</option><option selected>40</option><option>60</option><option>80</option><option>100</option><option>120</option><option>150</option></select></label><label>Minutes<input id="mins" type="number" value="50"></label><label>Passing grade<input id="pass" type="number" value="60"></label><label>Question type<select id="type"><option value="all">All levels</option><option value="easy">Direct</option><option value="medium">Applied</option><option value="challenge">Challenge</option><option value="scenario">Scenario</option></select></label></div><p><button class="btn primary" onclick="makeExam()">Start examination</button></p></section>`}function makeExam(){let p=all().filter(x=>type.value==='all'||x.q.difficulty===type.value);start('Examination',sh(p).slice(0,Math.min(+cnt.value,p.length)),+mins.value*60,+pass.value)}function start(title,items,seconds,pass){run={title,items:items.map(x=>({...x,order:sh([0,1,2,3])})),seconds,pass,answers:{},flags:{},idx:0,start:Date.now()};render();tick=setInterval(()=>{run.seconds--;if(window.timer)timer.textContent=fmt(run.seconds);if(run.seconds<=0)submit()},1000)}function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function render(){let x=run.items[run.idx],sel=run.answers[run.idx];app.innerHTML=`<section class="card"><div class="row"><span class="tag">${run.title}</span><span class="timer" id="timer">${fmt(run.seconds)}</span></div><div class="navigator">${run.items.map((_,i)=>`<button class="${i===run.idx?'cur ':''}${run.answers[i]!==undefined?'ans ':''}${run.flags[i]?'flag':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><div class="progress"><div style="width:${Object.keys(run.answers).length/run.items.length*100}%"></div></div><div class="question"><small>Lecture ${x.ci+1} • ${x.q.difficulty}</small><h2>${run.idx+1}. ${x.q.q}</h2>${x.order.map(j=>`<label class="option"><input type="radio" name="r" ${sel===j?'checked':''} onchange="run.answers[run.idx]=${j};render()"> ${x.q.o[j]}</label>`).join('')}</div><div class="row"><button class="btn secondary" onclick="jump(${Math.max(0,run.idx-1)})">Previous</button><button class="btn secondary" onclick="run.flags[run.idx]=!run.flags[run.idx];render()">Flag</button><button class="btn primary" onclick="jump(${Math.min(run.items.length-1,run.idx+1)})">Next</button><button class="btn secondary" onclick="submit()">Submit</button></div></section>`}function jump(i){run.idx=i;render()}function submit(){clearInterval(tick);let score=run.items.filter((x,i)=>run.answers[i]===x.q.a).length,r={title:run.title,score,total:run.items.length,pct:Math.round(score/run.items.length*100),pass:run.pass,date:new Date().toISOString()};history.unshift(r);save();report(r)}function report(r){app.innerHTML=`<section class="card"><h2>${r.title} report</h2><div class="metric"><strong>${r.score}/${r.total} (${r.pct}%)</strong></div><p class="${r.pct>=r.pass?'good':'bad'}">${r.pct>=r.pass?'Passed':'Not passed'}</p></section>`}function mockExam(){let p=sh(all()),picked=[];lectures.forEach((c,ci)=>{let pool=sh(p.filter(x=>x.ci===ci));picked.push(...pool.slice(0,30))});start('Mock Final Examination',sh(picked),5400,60)}
function simulator(){app.innerHTML=`<section class="card"><span class="tag">Interactive logic laboratory • standard gate symbols</span><h2>Logic Gate Simulator</h2><p>Select a gate and toggle inputs A and B. The output and truth-table result update immediately.</p><details><summary><b>Logic-gate symbol library</b></summary><div id="symbolGallery" class="gate-grid" style="margin:14px 0"></div></details><div class="grid"><label>Gate<select id="gate" onchange="simUpdate()"><option>AND</option><option>OR</option><option>NOT</option><option>NAND</option><option>NOR</option><option>XOR</option><option>XNOR</option><option>BUFFER</option><option>AND3</option><option>OR3</option><option>NAND3</option><option>NOR3</option></select></label><div class="term"><b>Input A</b><p><button class="btn secondary" id="aBtn" onclick="simA^=1;simUpdate()">0</button></p></div><div class="term"><b>Input B</b><p><button class="btn secondary" id="bBtn" onclick="simB^=1;simUpdate()">0</button></p></div><div class="term" id="cBox"><b>Input C</b><p><button class="btn secondary" id="cBtn" onclick="simC^=1;simUpdate()">0</button></p></div><div class="metric"><strong id="simOut">0</strong><br>Output Q</div></div><div id="gateDiagram" class="question" style="text-align:center;font-size:24px;margin-top:16px"></div><h3>Live truth explanation</h3><p id="simExplain"></p><h3>Mini circuit: Half Adder</h3><div class="grid"><div class="metric"><strong id="sumOut">0</strong><br>SUM = A XOR B</div><div class="metric"><strong id="carryOut">0</strong><br>CARRY = A AND B</div></div></section>`;symbolGallery.innerHTML=['AND','OR','NOT','NAND','NOR','XOR','XNOR','BUFFER'].map(g=>`<div class="gate-card">${gateSVG(g)}<b>${g}</b></div>`).join('');simA=0;simB=0;simC=0;simUpdate()}
let simA=0,simB=0,simC=0;function simUpdate(){if(!document.getElementById('gate'))return;let g=gate.value,q=0;if(g==='AND')q=simA&simB;if(g==='OR')q=simA|simB;if(g==='NOT')q=simA?0:1;if(g==='NAND')q=(simA&simB)?0:1;if(g==='NOR')q=(simA|simB)?0:1;if(g==='XOR')q=simA^simB;if(g==='XNOR')q=(simA^simB)?0:1;if(g==='BUFFER')q=simA;if(g==='AND3')q=simA&simB&simC;if(g==='OR3')q=simA|simB|simC;if(g==='NAND3')q=(simA&simB&simC)?0:1;if(g==='NOR3')q=(simA|simB|simC)?0:1;aBtn.textContent=simA;bBtn.textContent=simB;cBtn.textContent=simC;let unary=['NOT','BUFFER'].includes(g),three=g.endsWith('3');bBtn.disabled=unary;cBox.style.display=three?'block':'none';simOut.textContent=q;sumOut.textContent=simA^simB;carryOut.textContent=simA&simB;gateDiagram.innerHTML=`<div class="circuit"><span class="node">A=${simA}</span>${unary?'':`<span class="node">B=${simB}</span>`}${three?`<span class="node">C=${simC}</span>`:''}<span class="wire"></span><span class="symbol-wrap">${gateSVG(g)}</span><span class="wire"></span><span class="led ${q?'on':'off'}">${q}</span></div>`;simExplain.textContent=`${g} with the selected input values produces Q=${q}.`}

function gateSVG(g,label=''){
 const bubble='<circle cx="118" cy="50" r="7" fill="white" stroke="#173f5f" stroke-width="4"/>';
 const common='stroke="#173f5f" stroke-width="4" fill="#fff" stroke-linejoin="round"';
 let shape='';
 if(g==='AND'||g==='AND3'||g==='NAND'||g==='NAND3')shape=`<path d="M25 15 L67 15 A35 35 0 0 1 67 85 L25 85 Z" ${common}/>${g.startsWith('NAND')?bubble:''}`;
 else if(g==='OR'||g==='OR3'||g==='NOR'||g==='NOR3')shape=`<path d="M25 15 Q48 50 25 85 Q72 83 110 50 Q72 17 25 15 Z" ${common}/>${g.startsWith('NOR')?bubble:''}`;
 else if(g==='XOR'||g==='XNOR')shape=`<path d="M18 15 Q41 50 18 85" fill="none" stroke="#173f5f" stroke-width="4"/><path d="M27 15 Q50 50 27 85 Q74 83 111 50 Q74 17 27 15 Z" ${common}/>${g==='XNOR'?bubble:''}`;
 else if(g==='NOT')shape=`<path d="M25 15 L105 50 L25 85 Z" ${common}/>${bubble}`;
 else if(g==='BUFFER')shape=`<path d="M25 15 L110 50 L25 85 Z" ${common}/>`;
 else shape=`<rect x="25" y="15" width="85" height="70" rx="10" ${common}/>`;
 const outX=(g==='NOT'||g.includes('NAND')||g.includes('NOR')||g==='XNOR')?125:115;
 return `<svg class="logic-symbol" viewBox="0 0 160 100" role="img" aria-label="${g} logic gate"><line x1="2" y1="35" x2="30" y2="35" stroke="#1f7a8c" stroke-width="4"/><line x1="2" y1="65" x2="30" y2="65" stroke="#1f7a8c" stroke-width="4"/>${shape}<line x1="${outX}" y1="50" x2="158" y2="50" stroke="#1f7a8c" stroke-width="4"/><text x="70" y="55" text-anchor="middle" font-size="14" font-weight="800" fill="#6657a8">${label||g.replace('3','')}</text></svg>`}
function logic(g,a,b,c=0){if(g==='AND')return a&b;if(g==='OR')return a|b;if(g==='NAND')return(a&b)?0:1;if(g==='NOR')return(a|b)?0:1;if(g==='XOR')return a^b;if(g==='XNOR')return(a^b)?0:1;if(g==='NOT')return a?0:1;if(g==='BUFFER')return a;if(g==='AND3')return a&b&c;if(g==='OR3')return a|b|c;return 0}
let dA=0,dB=0,dC=0;function designer(){app.innerHTML=`<section class="card"><span class="tag">Two-stage circuit builder</span><h2>Logic Gate Design Diagram</h2><p>Build a circuit of the form <b>Q = Gate 2(Gate 1(A,B), C)</b>. Toggle inputs and compare the live output with the diagram.</p><div class="grid"><label>Gate 1<select id="g1" onchange="designUpdate()"><option>AND</option><option>OR</option><option>NAND</option><option>NOR</option><option>XOR</option><option>XNOR</option></select></label><label>Gate 2<select id="g2" onchange="designUpdate()"><option>AND</option><option>OR</option><option>NAND</option><option>NOR</option><option>XOR</option><option>XNOR</option></select></label><div class="term"><b>A</b><p><button id="dABtn" class="btn secondary" onclick="dA^=1;designUpdate()">0</button></p></div><div class="term"><b>B</b><p><button id="dBBtn" class="btn secondary" onclick="dB^=1;designUpdate()">0</button></p></div><div class="term"><b>C</b><p><button id="dCBtn" class="btn secondary" onclick="dC^=1;designUpdate()">0</button></p></div></div><div id="designDiagram" class="diagram"></div><div class="grid"><div class="metric"><strong id="midOut">0</strong><br>Intermediate X</div><div class="metric"><strong id="finalOut">0</strong><br>Final Q</div></div><h3>Generated Boolean form</h3><p id="designExpr" class="seg"></p><p><button class="btn accent" onclick="randomDesign()">Random design challenge</button></p></section>`;dA=dB=dC=0;designUpdate()}
function designUpdate(){if(!document.getElementById('g1'))return;let x=logic(g1.value,dA,dB),q=logic(g2.value,x,dC);dABtn.textContent=dA;dBBtn.textContent=dB;dCBtn.textContent=dC;midOut.textContent=x;finalOut.textContent=q;designExpr.textContent=`Q = ${g2.value}(${g1.value}(A,B), C)`;designDiagram.innerHTML=`<div class="circuit"><span class="node">A=${dA}</span><span class="node">B=${dB}</span><span class="wire"></span><span class="symbol-wrap">${gateSVG(g1.value)}</span><span class="wire"></span><span class="led ${x?'on':'off'}">X=${x}</span><span class="node">C=${dC}</span><span class="wire"></span><span class="symbol-wrap">${gateSVG(g2.value)}</span><span class="wire"></span><span class="led ${q?'on':'off'}">Q=${q}</span></div>`}
function randomDesign(){let gs=['AND','OR','NAND','NOR','XOR','XNOR'];g1.value=gs[Math.floor(Math.random()*gs.length)];g2.value=gs[Math.floor(Math.random()*gs.length)];dA=Math.round(Math.random());dB=Math.round(Math.random());dC=Math.round(Math.random());designUpdate()}
const diagramQs=[
{g1:'AND',g2:'OR',a:1,b:0,c:1,ans:1},{g1:'XOR',g2:'AND',a:1,b:0,c:1,ans:1},{g1:'NAND',g2:'AND',a:1,b:1,c:1,ans:0},{g1:'OR',g2:'XOR',a:0,b:1,c:1,ans:0},{g1:'NOR',g2:'OR',a:0,b:0,c:0,ans:1},{g1:'XNOR',g2:'AND',a:1,b:1,c:1,ans:1},{g1:'AND',g2:'NAND',a:1,b:1,c:1,ans:0},{g1:'XOR',g2:'NOR',a:1,b:1,c:0,ans:1},{g1:'NAND',g2:'XOR',a:1,b:0,c:1,ans:0},{g1:'OR',g2:'AND',a:0,b:0,c:1,ans:0},{g1:'NOR',g2:'NAND',a:1,b:0,c:1,ans:1},{g1:'XNOR',g2:'OR',a:1,b:0,c:0,ans:0}];let dq=0,dscore=0;
function diagrams(){dq=0;dscore=0;drawDiagramQ()}
function drawDiagramQ(){let x=diagramQs[dq];if(!x){app.innerHTML=`<section class="card"><h2>Diagram challenge complete</h2><div class="metric"><strong>${dscore}/${diagramQs.length}</strong><br>correct circuit outputs</div><p><button class="btn primary" onclick="diagrams()">Try again</button></p></section>`;return}let mid=logic(x.g1,x.a,x.b);app.innerHTML=`<section class="card"><span class="tag">Circuit diagram question ${dq+1} of ${diagramQs.length}</span><h2>What is the final output Q?</h2><div class="diagram"><div class="circuit"><span class="node">A=${x.a}</span><span class="node">B=${x.b}</span><span class="wire"></span><span class="symbol-wrap">${gateSVG(x.g1)}</span><span class="wire"></span><span class="node">X</span><span class="node">C=${x.c}</span><span class="wire"></span><span class="symbol-wrap">${gateSVG(x.g2)}</span><span class="wire"></span><span class="led off">Q=?</span></div></div><label class="diagram-option"><input type="radio" name="diagramAns" onchange="checkDiagram(0)"> Output Q = 0</label><label class="diagram-option"><input type="radio" name="diagramAns" onchange="checkDiagram(1)"> Output Q = 1</label><div id="diagramFeedback"></div></section>`}
function checkDiagram(v){let x=diagramQs[dq],mid=logic(x.g1,x.a,x.b),q=logic(x.g2,mid,x.c),ok=v===q;if(ok)dscore++;diagramFeedback.innerHTML=(ok?'<p class="good"><b>Correct.</b> ':'<p class="bad"><b>Incorrect.</b> ')+`Gate 1 gives X=${mid}; Gate 2 then gives Q=${q}.</p><button class="btn primary" onclick="dq++;drawDiagramQ()">Next diagram</button>`}
function mastery(){app.innerHTML=`<section class="card"><h2>Lecture mastery</h2><table><tr><th>Lecture</th><th>Attempted</th><th>Accuracy</th></tr>${lectures.map((c,i)=>{let k=Object.keys(state).filter(x=>x.startsWith(i+'_')),ok=k.filter(x=>state[x].ok).length;return`<tr><td>${c.title}</td><td>${k.length}/${c.questions.length}</td><td>${k.length?Math.round(ok/k.length*100):0}%</td></tr>`}).join('')}</table></section>`}function glossary(){app.innerHTML=`<section class="card"><h2>Glossary</h2><div class="grid">${glossaryData.map(x=>`<div class="term"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div></section>`}function reports(){app.innerHTML=`<section class="card"><h2>Assessment reports</h2>${history.length?history.map(r=>`<p>${new Date(r.date).toLocaleString()} • ${r.title} • <b>${r.pct}%</b></p>`).join(''):'<p>No reports yet.</p>'}</section>`}home();</script></body></html>
