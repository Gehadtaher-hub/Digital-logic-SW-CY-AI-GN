<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 4 K-Map Simulator</title><style>
:root{--navy:#102f46;--blue:#167b91;--cyan:#35c6bd;--violet:#6b57b5;--gold:#f0b43c;--coral:#ef625f;--ink:#17333d;--line:#c7e1e1;--bg:#edf8f7;--green:#138568;--red:#bd4052}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff9e9,#edf8f7 48%,#edeafa)}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,var(--navy),var(--blue),var(--violet));color:#fff;border-bottom:4px solid var(--gold);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff66;border-radius:9px;padding:8px 10px}.layout{display:grid;grid-template-columns:285px 1fr;min-height:100vh}aside{position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto;padding:14px;background:#faffff;border-right:1px solid var(--line)}main{width:min(1120px,100%);padding:20px;margin:auto}.nav{width:100%;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:10px;margin:4px 0;text-align:left;font-weight:750;cursor:pointer}.nav.active{background:linear-gradient(100deg,var(--blue),var(--violet));color:#fff}.nav.done:after{content:' ✓';float:right;color:#26dfb1}.progress{height:12px;background:#dcebea;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--gold),var(--cyan));transition:.3s}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:0 12px 30px #173f5f16}.hero{padding:26px;background:linear-gradient(120deg,#fff,#efffff 60%,#fff3d3)}.hero h1{color:var(--navy);font-size:clamp(1.8rem,4vw,3rem);margin:.2em 0}.module{display:none}.module.active{display:block}.card{padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.tile{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fbffff}.tile h3{color:var(--blue);margin-top:0}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:850;cursor:pointer;background:linear-gradient(100deg,var(--blue),var(--violet));color:#fff}.btn.alt{background:#e7f3f4;color:var(--navy)}.btn.gold{background:linear-gradient(100deg,var(--gold),var(--coral));color:#182f38}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.readout{padding:10px 13px;border-radius:10px;background:var(--navy);color:#fff;font-family:Consolas,monospace;font-weight:800}.callout{border-left:6px solid var(--gold);padding:12px;background:#fff8df;border-radius:9px}.lab{border:2px dashed #83c7c8;background:#f6ffff;border-radius:15px;padding:16px}.signal{height:160px;width:100%;background:#102f46;border-radius:12px}.lamp{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:#cedada;border:6px solid #74888b;font-weight:900}.lamp.on{background:#ffe656;box-shadow:0 0 25px #f0b43c}.switch{min-width:82px}.switch.on{background:var(--gold);color:#17333d}.truth{width:100%;border-collapse:collapse;margin-top:12px}.truth th,.truth td{padding:9px;border:1px solid var(--line);text-align:center}.truth th{background:var(--navy);color:#fff}.truth tr.live{background:#ffefaa;font-weight:900}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.flow div{flex:1;min-width:125px;text-align:center;padding:14px;border-radius:12px;background:#e8f7f6;font-weight:800}.flow b{color:var(--violet)}.bits{display:flex;gap:6px;flex-wrap:wrap}.bit{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:900;transition:.3s}.bit.move{transform:translateY(-8px);background:var(--coral)}.question{padding:14px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.question label{display:block;padding:7px;cursor:pointer}.feedback{font-weight:800}.good{color:var(--green)}.bad{color:var(--red)}details{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}summary{padding:12px;background:#eaf8f8;font-weight:850;cursor:pointer}details>div{padding:13px}.formula{background:var(--navy);color:#fff;border-radius:10px;padding:12px;text-align:center;font-family:Consolas,monospace;font-size:1.15rem}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcf2f4;color:#176578;font-weight:800;margin:3px}.score{font-size:1.25rem;padding:15px;background:#e9f8f4;border-radius:12px;font-weight:900}@media(max-width:790px){.layout{display:block}aside{position:static;height:auto}.top{position:static;flex-direction:column;align-items:flex-start}.navlist{display:grid;grid-template-columns:1fr 1fr}.hero,.card{padding:16px}main{padding:11px}.flow div{min-width:100%}}

.truth,.kmap{border-collapse:collapse;width:100%;margin:12px 0}.truth th,.truth td,.kmap th,.kmap td{border:1px solid var(--line);padding:9px;text-align:center}.truth tr.hi{background:#fff2df;outline:2px solid var(--gold)}.kcell{width:100%;min-height:55px;font-size:19px}.kcell.group{box-shadow:inset 0 0 0 4px var(--coral);background:#fff0ef}.logic-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.signalbox{display:inline-grid;place-items:center;min-width:66px;height:62px;border:3px solid var(--blue);border-radius:13px;background:#eaf8f7;font-size:22px;font-weight:900}.steps{display:grid;gap:9px}.alg-step{padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff}.codewide{font:700 18px ui-monospace,monospace;background:#f4f0ff;padding:12px;border-radius:9px;overflow:auto}
.example-coach{margin:15px 0;padding:16px;border:2px solid var(--gold);border-radius:15px;background:#fffaf0}.example-coach h3{margin:0 0 6px;color:var(--navy)}.example-card{min-height:88px;padding:13px;border-radius:11px;background:#fff;border:1px solid var(--line)}.example-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.example-count{font-weight:800;color:var(--violet)}

.example-circuit{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,#fff,#eefafa);padding:8px;overflow:hidden}.example-circuit svg{display:block;width:100%;height:auto;min-height:150px}.example-circuit .wire{stroke:#167b91;stroke-width:4;fill:none}.example-circuit .gate{fill:#f8f6ff;stroke:#6b57b5;stroke-width:3}.example-circuit .hot{fill:#fff1c9;stroke:#ef625f;stroke-width:3}.example-circuit text{font-family:Segoe UI,Arial,sans-serif;fill:#102f46;font-weight:700}.diagram-caption{text-align:center;margin:5px 0 0;font-size:.9rem;color:#456}
</style></head><body><header class="top"><div class="brand">⚡ Lecture 4 Standard Forms and K-Maps</div><div><a href="index.html">Learning Hub</a> <a href="lectures.html">All Lectures</a></div></header><div class="layout"><aside><h3>Learning path</h3><div class="progress"><i id="bar"></i></div><p><b id="pct">0%</b> completed</p><div class="navlist" id="nav"></div><button class="nav" onclick="resetAll()">Reset progress</button></aside><main><section class="hero"><span class="badge">Lecture 4</span><span class="badge">Interactive</span><span class="badge">Guided learning</span><h1>Turn truth tables into simpler logic</h1><p>Build canonical forms, explore Gray-code adjacency, group K-map cells, and save progress automatically.</p></section><div id="modules"></div></main></div><script>
const modules=[{t:"1. Minterms",body:"<h2>Minterms</h2><div class='grid'><div class='tile'><p>A minterm is an AND term containing every variable exactly once. A minterm is 1 for one truth-table row only.</p><p><b>Example:</b> ABC=101 gives m5=AB'C.</p></div><div class='tile'><p><b>Mapping:</b> bit 0 becomes a complemented literal; bit 1 stays normal.</p></div></div><div class='lab'><h3>Build a minterm</h3><div class='logic-row'><button onclick=toggle('A')>A=<b id=AVal>0</b></button><button onclick=toggle('B')>B=<b id=BVal>0</b></button><button onclick=toggle('C')>C=<b id=CVal>0</b></button></div><p class='readout' id=term></p><p id=detail></p></div>"},
{t:"2. Maxterms",body:"<h2>Maxterms</h2><div class='grid'><div class='tile'><p>A maxterm is an OR term containing every variable exactly once. A maxterm is 0 for one row only.</p><p><b>Example:</b> ABC=101 gives M5=(A'+B+C').</p></div><div class='tile'><p><b>Mapping:</b> bit 0 stays normal; bit 1 becomes complemented.</p></div></div><div class='lab'><h3>Build a maxterm</h3><div class='logic-row'><button onclick=toggle('A')>A=<b id=AVal>0</b></button><button onclick=toggle('B')>B=<b id=BVal>0</b></button><button onclick=toggle('C')>C=<b id=CVal>0</b></button></div><p class='readout' id=term></p><p id=detail></p></div>"},
{t:"3. Canonical SOP",body:"<h2>Canonical Sum of Products</h2><div class='tile'><p>Canonical SOP ORs the minterms of every row where F=1.</p><p><b>Example:</b> 1-rows 1,2,5,7 produce F=\u03a3m(1,2,5,7).</p></div><div class='lab'><h3>Select the 1-rows</h3><div id=rowTable></div><p class='codewide' id=canonical></p></div>"},
{t:"4. Canonical POS",body:"<h2>Canonical Product of Sums</h2><div class='tile'><p>Canonical POS ANDs the maxterms of every row where F=0.</p><p><b>Example:</b> 0-rows 0,3,4,6 produce F=\u03a0M(0,3,4,6).</p></div><div class='lab'><h3>Select the 0-rows</h3><div id=rowTable></div><p class='codewide' id=canonical></p></div>"},
{t:"5. K-Map Layout and Gray Code",body:"<h2>K-Map Layout and Gray Code</h2><div class='tile'><p>Karnaugh maps use Gray-code order so adjacent cells differ in one variable only.</p><p><b>Example:</b> columns use 00,01,11,10. The first and last columns are adjacent.</p></div><div class='lab'><h3>Interactive 3-variable map</h3><div id=map></div><p id=mapInfo></p></div>"},
{t:"6. SOP Grouping",body:"<h2>Grouping 1s for SOP</h2><div class='tile'><p>Group adjacent 1s in rectangles of 1,2,4, or 8 cells. Prefer the largest useful groups.</p><p><b>Example:</b> a group of four eliminates two changing variables.</p></div><div class='lab'><div id=map></div><button onclick=highlightGroup(1)>Show candidate 1-group</button> <button onclick=resetMap()>Reset</button><p id=mapInfo></p></div>"},
{t:"7. Wraparound and Overlap",body:"<h2>Wraparound, Corners, and Overlap</h2><div class='tile'><p>Top and bottom edges are adjacent; left and right edges are adjacent. Groups may overlap.</p><p><b>Example:</b> the four corner cells of a 4-variable K-map form one legal group.</p></div><div class='lab'><div id=map></div><button onclick=wrapDemo()>Highlight wraparound pair</button><p id=mapInfo></p></div>"},
{t:"8. Don't-Care Conditions",body:"<h2>Don't-Care Conditions</h2><div class='tile'><p>An X may be treated as 0 or 1 when useful, but it does not have to be used.</p><p><b>Example:</b> invalid BCD codes 1010\u20131111 may be don't-cares.</p></div><div class='lab'><p>Cells cycle 0 \u2192 1 \u2192 X.</p><div id=map></div><button onclick=highlightGroup(1)>Use X to enlarge a 1-group</button><p id=mapInfo></p></div>"},
{t:"9. POS Grouping",body:"<h2>Grouping 0s for POS</h2><div class='tile'><p>For POS, group 0s instead of 1s. Constant variables create the resulting sum term.</p><p><b>Example:</b> grouping a complete zero column removes every variable that changes inside it.</p></div><div class='lab'><div id=map></div><button onclick=highlightGroup(0)>Show candidate 0-group</button> <button onclick=resetMap()>Reset</button><p id=mapInfo></p></div>"},];let active=0,bits={A:0,B:0,C:0},selected=new Set(),cells=Array(8).fill(0),done=JSON.parse(localStorage.getItem('lecture4Path')||'[]');const $=id=>document.getElementById(id),order=[0,1,3,2];const modulesEl=$('modules');
function build(){nav.innerHTML=modules.map((m,i)=>`<button class="nav ${i===active?'active':''}" onclick="openM(${i})">${m.t}${done.includes(i)?' ✓':''}</button>`).join('');modulesEl.innerHTML=`<section class="module active">${modules[active].body}<div class="checks"><button class="primary" onclick="complete()">Mark understood and continue</button></div></section>`;updateProgress();updateLab()}function openM(i){active=i;build();scrollTo({top:0,behavior:'smooth'})}function complete(){if(!done.includes(active))done.push(active);localStorage.setItem('lecture4Path',JSON.stringify(done));if(active<modules.length-1)active++;build()}function resetAll(){done=[];selected.clear();cells=Array(8).fill(0);localStorage.removeItem('lecture4Path');active=0;build()}function updateProgress(){let p=Math.round(done.length/modules.length*100);bar.style.width=p+'%';pct.textContent=p+'%'}
function toggle(n){bits[n]=1-bits[n];updateLab()}function updateLab(){['A','B','C'].forEach(n=>{let e=$(n+'Val');if(e)e.textContent=bits[n]});if(active<2)drawTerm();if(active===2||active===3)drawRows();if(active>=4)drawMap()}function drawTerm(){let idx=bits.A*4+bits.B*2+bits.C,v=['A','B','C'],b=[bits.A,bits.B,bits.C];if(active===0){term.textContent=`m${idx} = `+b.map((x,i)=>v[i]+(x?'':"'")).join('');detail.textContent='0 becomes complemented; 1 remains normal.'}else{term.textContent=`M${idx} = (`+b.map((x,i)=>v[i]+(x?"'":'')).join(' + ')+')';detail.textContent='0 remains normal; 1 becomes complemented.'}}
function drawRows(){rowTable.innerHTML=`<table class="truth"><tr><th>Index</th><th>ABC</th><th>Select</th></tr>${Array.from({length:8},(_,i)=>`<tr class="${selected.has(i)?'hi':''}"><td>${i}</td><td>${i.toString(2).padStart(3,'0')}</td><td><button onclick="toggleRow(${i})">${selected.has(i)?'Selected':'Select'}</button></td></tr>`).join('')}</table>`;let a=[...selected].sort((a,b)=>a-b);canonical.textContent=active===2?`F = Σm(${a.join(',')})`:`F = ΠM(${a.join(',')})`}function toggleRow(i){selected.has(i)?selected.delete(i):selected.add(i);drawRows()}
function drawMap(){map.innerHTML=`<table class="kmap"><tr><th>A\BC</th>${['00','01','11','10'].map(x=>`<th>${x}</th>`).join('')}</tr>${[0,1].map(a=>`<tr><th>${a}</th>${order.map(bc=>{let i=a*4+bc;return `<td><button class="kcell" data-cell="${i}" onclick="cycle(${i})">${cells[i]}</button></td>`}).join('')}</tr>`).join('')}</table>`;mapInfo.textContent='Gray-code order is 00, 01, 11, 10. Opposite edges are adjacent.'}function cycle(i){cells[i]=active===7?(cells[i]===0?1:cells[i]===1?'X':0):(cells[i]?0:1);drawMap()}function resetMap(){cells=Array(8).fill(0);drawMap()}function highlightGroup(want){let ids=[];cells.forEach((v,i)=>{if(v===want||v==='X')ids.push(i)});document.querySelectorAll('[data-cell]').forEach(e=>e.classList.toggle('group',ids.slice(0,4).includes(+e.dataset.cell)));mapInfo.textContent=ids.length?'Highlighted cells are candidates. A valid group must be rectangular, adjacent, and have size 1,2,4, or 8.':'Set cells first.'}function wrapDemo(){document.querySelectorAll('[data-cell]').forEach(e=>e.classList.toggle('group',[0,2].includes(+e.dataset.cell)));mapInfo.textContent='The first and last Gray-code columns are adjacent through wraparound.'}build();
</script>
<script id="guided-examples-script">
const guidedExamples=[[["m0", "000 → A'B'C'"], ["m1", "001 → A'B'C"], ["m2", "010 → A'BC'"], ["m5", "101 → AB'C"], ["m7", "111 → ABC"]], [["M0", "000 → (A+B+C)"], ["M1", "001 → (A+B+C')"], ["M2", "010 → (A+B'+C)"], ["M5", "101 → (A'+B+C')"], ["M7", "111 → (A'+B'+C')"]], [["Two rows", "Rows 1 and 3 give Σm(1,3)."], ["Three rows", "Rows 1,2,5 give Σm(1,2,5)."], ["Even rows", "Rows 0,2,4,6 give Σm(0,2,4,6)."], ["Odd rows", "Rows 1,3,5,7 give Σm(1,3,5,7)."], ["All rows", "Σm(0,1,2,3,4,5,6,7)=1."]], [["Two zeros", "Rows 0 and 2 give ΠM(0,2)."], ["Three zeros", "Rows 1,4,6 give ΠM(1,4,6)."], ["Even zeros", "Rows 0,2,4,6 give ΠM(0,2,4,6)."], ["Odd zeros", "Rows 1,3,5,7 give ΠM(1,3,5,7)."], ["No zeros", "An empty maxterm list represents constant 1."]], [["Adjacent columns", "00 and 01 differ only in C."], ["Middle columns", "01 and 11 differ only in B."], ["Right columns", "11 and 10 differ only in C."], ["Wraparound", "10 and 00 differ only in B."], ["Gray sequence", "00, 01, 11, 10 changes one bit at a time."]], [["Pair", "Two adjacent 1s remove one variable."], ["Horizontal quad", "Four 1s across a row remove two variables."], ["Vertical quad", "Four 1s in a column pair remove two variables."], ["Octet", "Eight adjacent 1s simplify to one literal."], ["Whole map", "Sixteen 1s simplify to constant 1."]], [["Edge pair", "First and last columns are adjacent."], ["Corner quad", "Four corners form a valid group."], ["Top-bottom wrap", "Top and bottom rows can be adjacent."], ["Overlap", "One cell may support two useful groups."], ["Largest groups", "Choose the largest groups that cover all 1s."]], [["BCD use", "Codes 1010–1111 may be marked X."], ["Helpful pair", "Use X to extend a single 1 into a pair."], ["Helpful quad", "Use X values to form a quad."], ["Helpful octet", "Several X values may complete an octet."], ["Unused X", "Ignore X when no simpler expression results."]], [["Zero pair", "A pair of 0s removes one variable."], ["Zero quad", "A quad of 0s creates a one-literal sum term."], ["Edge zero group", "Zero groups can wrap across edges."], ["Overlapping zeros", "Overlap is allowed when it simplifies POS."], ["SOP vs POS", "Group 1s for SOP and 0s for POS."]]];
let guidedExampleIndex=0;
function exampleCoachHtml(){return `<section class="example-coach"><h3>More guided examples</h3><p>Study one example, predict the result, then move to the next example.</p><div class="example-card"><b id="exampleTitle"></b><p id="exampleText"></p></div><div class="example-toolbar"><button class="btn alt" type="button" onclick="changeExample(-1)">Previous example</button><span class="example-count" id="exampleCount"></span><button class="btn" type="button" onclick="changeExample(1)">Next example</button></div></section>`}
function renderGuidedExample(){const list=guidedExamples[active]||[];if(!list.length)return;guidedExampleIndex=(guidedExampleIndex+list.length)%list.length;const item=list[guidedExampleIndex];const title=document.getElementById('exampleTitle'),text=document.getElementById('exampleText'),count=document.getElementById('exampleCount');if(title)title.textContent=item[0];if(text)text.textContent=item[1];if(count)count.textContent=`Example ${guidedExampleIndex+1} of ${list.length}`;}
function changeExample(step){guidedExampleIndex+=step;renderGuidedExample();}
const originalBuild=build;
build=function(){originalBuild();guidedExampleIndex=0;const module=document.querySelector('.module.active');const lab=module?.querySelector('.lab');if(module){const holder=document.createElement('div');holder.innerHTML=exampleCoachHtml();module.insertBefore(holder.firstElementChild,lab||module.querySelector('.checks'));}renderGuidedExample();};
build();
</script>
<script id="example-circuit-diagrams-script">
function escDiagramText(value){return String(value).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function logicDiagram(topic,index,title,text,lecture){
 const safeTitle=escDiagramText(title),safeText=escDiagramText(text.length>42?text.slice(0,39)+'...':text);
 if(lecture===4){
  const cells=Array.from({length:16},(_,i)=>`<rect x="${120+(i%4)*82}" y="${38+Math.floor(i/4)*48}" width="72" height="38" rx="5" class="${(i+index+topic)%3===0?'hot':'gate'}"/><text x="${156+(i%4)*82}" y="${62+Math.floor(i/4)*48}" text-anchor="middle" font-size="13">${i}</text>`).join('');
  return `<svg viewBox="0 0 520 260" role="img" aria-label="K-map diagram for ${safeTitle}"><text x="260" y="24" text-anchor="middle" font-size="16">${safeTitle}</text><text x="45" y="125" font-size="14">AB</text><text x="275" y="248" text-anchor="middle" font-size="14">CD in Gray-code order</text>${cells}</svg>`;
 }
 if(lecture===5){
  const labels=['Inputs','Design','Adder','Carry','Output']; const mid=labels[topic%labels.length];
  return `<svg viewBox="0 0 620 220" role="img" aria-label="Combinational circuit for ${safeTitle}"><text x="310" y="24" text-anchor="middle" font-size="16">${safeTitle}</text><text x="25" y="82">A</text><text x="25" y="148">B</text><path class="wire" d="M45 78H170M45 144H170"/><rect x="170" y="52" width="150" height="118" rx="22" class="gate"/><text x="245" y="104" text-anchor="middle">${mid}</text><text x="245" y="130" text-anchor="middle" font-size="13">Example ${index+1}</text><path class="wire" d="M320 111H465"/><circle cx="488" cy="111" r="25" class="hot"/><text x="488" y="117" text-anchor="middle">Y</text><text x="310" y="204" text-anchor="middle" font-size="13">${safeText}</text></svg>`;
 }
 const gate=['NOT','OR','AND','SOP','LAW','DeMorgan','EVAL','SIMPLIFY','CIRCUIT'][topic]||'LOGIC';
 return `<svg viewBox="0 0 620 220" role="img" aria-label="Logic circuit for ${safeTitle}"><text x="310" y="24" text-anchor="middle" font-size="16">${safeTitle}</text><text x="25" y="82">A</text><text x="25" y="148">B</text><path class="wire" d="M45 78H175M45 144H175"/><path class="gate" d="M175 48 Q315 48 365 111 Q315 174 175 174 Z"/><text x="265" y="106" text-anchor="middle">${gate}</text><text x="265" y="130" text-anchor="middle" font-size="13">Example ${index+1}</text><path class="wire" d="M365 111H490"/><circle cx="510" cy="111" r="20" class="hot"/><text x="510" y="117" text-anchor="middle">F</text><text x="310" y="204" text-anchor="middle" font-size="13">${safeText}</text></svg>`;
}
function attachExampleDiagram(lecture){
 const card=document.querySelector('.example-card'); if(!card)return;
 card.querySelector('.example-circuit')?.remove();
 const title=document.getElementById('exampleTitle')?.textContent||''; const text=document.getElementById('exampleText')?.textContent||'';
 const box=document.createElement('div');box.className='example-circuit';box.innerHTML=logicDiagram(active,guidedExampleIndex,title,text,lecture)+'<p class="diagram-caption">Circuit or logic representation for this example</p>';card.appendChild(box);
}

const diagramRenderBase=renderGuidedExample;renderGuidedExample=function(){diagramRenderBase();attachExampleDiagram(4);};renderGuidedExample();
</script></body></html>
